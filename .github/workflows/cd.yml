name: CD

# Pipeline de despliegue continuo para erp-monolithic-api.
#
# Mapeo rama → ambiente → aprobacion:
#   develop → development  (automatico)
#   qa      → qa           (automatico)
#   uat     → uat          (requiere aprobacion manual: falconxtreme2024)
#   main    → production   (requiere aprobacion manual: falconxtreme2024)
#
# Variables de repositorio requeridas (Settings > Secrets and variables > Actions > Variables):
#   GCP_PROJECT_ID         — ID del proyecto GCP
#   GCP_REGION             — Region de Cloud Run (ej. us-central1)
#   GCP_ARTIFACT_REGISTRY  — Host de Artifact Registry (ej. us-central1-docker.pkg.dev)
#   GCP_AR_REPO            — Nombre del repositorio en Artifact Registry (ej. erp-backend)
#
# Secretos de repositorio requeridos (Settings > Secrets and variables > Actions > Secrets):
#   GCP_SA_KEY             — Service account JSON codificado en base64 (Cloud Run + AR)
#
# Variables de ambiente requeridas (Settings > Environments > <nombre> > Variables):
#   CLOUD_RUN_SERVICE      — Nombre del servicio Cloud Run (ej. erp-api-development)
#
# Secretos de ambiente requeridos (Settings > Environments > <nombre> > Secrets):
#   DATABASE_URL             — URL de conexion pooled a Supabase para ese ambiente
#   DIRECT_URL               — URL de conexion directa a Supabase para migraciones DDL
#   FIREBASE_PROJECT_ID      — ID del proyecto Firebase (para Firebase Admin SDK)
#   FIREBASE_CLIENT_EMAIL    — client_email del service account de Firebase Admin
#   FIREBASE_PRIVATE_KEY     — private_key del service account (con \n literales)
#   RESEND_API_KEY           — API key de Resend para envio de correo transaccional
#
# Variables de ambiente requeridas adicionales (Settings > Environments > <nombre> > Variables):
#   EMAIL_FROM               — Remitente verificado en Resend (ej. no-reply@kairosnexo.com)
#   APP_BASE_URL             — URL base de la app web para el boton del correo de bienvenida
#   GCS_BUCKET_NAME          — Nombre del bucket GCS para fotos de vehiculos

on:
  push:
    branches: [develop, qa, uat, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: >-
      Deploy →
      ${{ github.ref_name == 'main' && 'production'
       || github.ref_name == 'uat'  && 'uat'
       || github.ref_name == 'qa'   && 'qa'
       || 'development' }}
    runs-on: ubuntu-latest

    # La resolucion del ambiente activa la cola de aprobacion para uat y production.
    # Las variables y secretos de BD se inyectan desde el ambiente correspondiente.
    environment: >-
      ${{ github.ref_name == 'main' && 'production'
       || github.ref_name == 'uat'  && 'uat'
       || github.ref_name == 'qa'   && 'qa'
       || 'development' }}

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      GCP_AR_REPO: ${{ vars.GCP_AR_REPO }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Autenticacion GCP ---
      # La SA key llega como JSON codificado en base64.
      # Permisos minimos necesarios: Artifact Registry Writer + Cloud Run Developer.
      - name: Auth GCP
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud auth configure-docker "$GCP_ARTIFACT_REGISTRY" --quiet
          rm -f /tmp/sa.json

      # --- Build y push de la imagen Docker ---
      - name: Build y push imagen Docker
        run: |
          IMAGE="${GCP_ARTIFACT_REGISTRY}/${GCP_PROJECT_ID}/${GCP_AR_REPO}/${CLOUD_RUN_SERVICE}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # --- Prisma migrate deploy ---
      # Corre ANTES del deploy de Cloud Run: garantiza que el schema de BD
      # esta actualizado antes de que el nuevo codigo arranque.
      # Usa DIRECT_URL (conexion directa a Supabase) porque las migraciones
      # DDL no funcionan sobre PgBouncer en modo transaction.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # --- Resolución automática de migraciones fallidas (solo develop y qa) ---
      # Si una migración anterior falló (P3018, P3009, etc.) y fue corregida en
      # el código, la marcamos como rolled-back para que migrate deploy pueda
      # re-aplicarla con el SQL actualizado.
      # En uat y production este paso no corre: un fallo de migración requiere
      # revisión manual antes de re-intentar.
      - name: Resolver migraciones fallidas
        if: contains(fromJSON('["develop", "qa"]'), github.ref_name)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          FAILED=$(psql "$DIRECT_URL" -t -A -c \
            "SELECT migration_name FROM _prisma_migrations \
             WHERE finished_at IS NULL AND rolled_back_at IS NULL \
             ORDER BY started_at" 2>/dev/null || true)
          if [ -z "$FAILED" ]; then
            echo "Sin migraciones fallidas pendientes."
            exit 0
          fi
          while IFS= read -r migration; do
            [ -z "$migration" ] && continue
            echo "Resolviendo: $migration"
            npx prisma migrate resolve \
              --rolled-back "$migration" \
              --schema=apps/api/prisma/schema.prisma
          done <<< "$FAILED"

      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      # --- Deploy a Cloud Run ---
      # Las vars se escriben a un YAML via Python para manejar correctamente
      # caracteres especiales en FIREBASE_PRIVATE_KEY (\n, =, etc.).
      # Mejora pendiente: migrar a GCP Secret Manager para produccion.
      - name: Deploy a Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
        run: |
          python3 - << 'PYEOF'
          import os, json
          rows = {
              "NODE_ENV": "production",
              "DATABASE_URL": os.environ["DATABASE_URL"],
              "FIREBASE_PROJECT_ID": os.environ["FIREBASE_PROJECT_ID"],
              "FIREBASE_CLIENT_EMAIL": os.environ["FIREBASE_CLIENT_EMAIL"],
              "FIREBASE_PRIVATE_KEY": os.environ["FIREBASE_PRIVATE_KEY"],
              "RESEND_API_KEY": os.environ["RESEND_API_KEY"],
              "EMAIL_FROM": os.environ["EMAIL_FROM"],
              "APP_BASE_URL": os.environ["APP_BASE_URL"],
              "GCS_BUCKET_NAME": os.environ["GCS_BUCKET_NAME"],
          }
          with open("/tmp/env-vars.yaml", "w") as f:
              for k, v in rows.items():
                  f.write(f"{k}: {json.dumps(v)}\n")
          PYEOF

          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image="$IMAGE" \
            --region="$GCP_REGION" \
            --platform=managed \
            --env-vars-file=/tmp/env-vars.yaml \
            --allow-unauthenticated \
            --quiet
          rm -f /tmp/env-vars.yaml

      # --- CORS en bucket GCS (fotos de vehiculos) ---
      # Aplica la politica CORS al bucket para permitir uploads desde el
      # navegador. El origin se resuelve por ambiente via APP_BASE_URL.
      - name: Configurar CORS en bucket GCS
        if: ${{ vars.GCS_BUCKET_NAME != '' }}
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
        run: |
          envsubst < infra/gcs-cors.json > /tmp/gcs-cors.json
          gcloud storage buckets update "gs://${GCS_BUCKET_NAME}" \
            --cors-file=/tmp/gcs-cors.json
          rm -f /tmp/gcs-cors.json
