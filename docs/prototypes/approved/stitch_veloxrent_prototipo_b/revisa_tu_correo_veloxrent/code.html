<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisa tu correo - VeloxRent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: #FFFFFF;
      color: #1F2A33;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .font-brand {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-white flex flex-col justify-center items-center px-4 select-none">
  
  <main class="w-full max-w-[380px] flex flex-col items-center text-center">
    <!-- Brand Name -->
    <div class="mb-10 text-center w-full">
      <h1 class="font-brand text-[22px] font-bold text-[#1F2A33] tracking-tight">VeloxRent</h1>
    </div>

    <!-- Icon: Mail / Sobre -->
    <div class="w-14 h-14 rounded-full bg-[#F5F4F0] flex items-center justify-center mb-6 text-[#1F2A33]">
      <svg class="w-7 h-7 text-[#1F2A33]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"></path>
      </svg>
    </div>

    <!-- Main Heading -->
    <h2 class="font-brand text-[20px] font-bold text-[#1F2A33] leading-snug mb-3 max-w-[340px]">
      Si el correo existe en nuestro sistema, te enviamos un enlace para recuperar tu acceso
    </h2>

    <!-- Secondary Description -->
    <p class="text-[14px] text-[#4E4A45] leading-relaxed mb-8">
      Revisa también tu carpeta de spam
    </p>

    <!-- Secondary Button: Volver a iniciar sesión -->
    <div class="w-full">
      <a href="#" class="inline-flex items-center justify-center w-full h-11 px-4 text-[14px] font-medium text-[#1F2A33] bg-transparent border border-[#1F2A33] rounded-[4px] hover:bg-[#1F2A33]/5 active:bg-[#1F2A33]/10 transition-colors duration-150">
        Volver a iniciar sesión
      </a>
    </div>
  </main>


</body></html>
