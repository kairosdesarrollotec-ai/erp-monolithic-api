<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión — Móvil - VeloxRent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Public Sans', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: '#1F2A33',
            surface: '#FFFFFF',
            neutral: {
              charcoal: '#1A1D21',
              muted: '#4E4A45',
              border: '#A39C90',
            },
            accent: {
              orange: '#9E4C08',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: #FFFFFF;
      color: #1A1D21;
      -webkit-font-smoothing: antialiased;
    }
    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="bg-[#FFFFFF] min-h-screen flex items-center justify-center p-4 text-neutral-charcoal">

  <!-- Main Mobile Container (390px target optimized, full width with 24px padding) -->
  <div class="w-full max-w-[380px] bg-white flex flex-col justify-between py-6">
    
    <!-- Top & Form Content -->
    <div class="w-full">
      
      <!-- Brand Header -->
      <div class="mb-10 text-left">
        <div class="flex items-center gap-2.5 mb-8">
          <div class="w-7 h-7 bg-brand rounded-[3px] flex items-center justify-center text-white font-display font-bold text-sm tracking-tight">
            VR
          </div>
          <span class="font-display font-bold text-[22px] leading-none tracking-tight text-brand">
            VeloxRent
          </span>
        </div>

        <h1 class="font-display font-bold text-[20px] text-[#1F2A33] tracking-tight">
          Ingresa a tu cuenta
        </h1>
        <p class="text-neutral-muted text-[14px] mt-1.5 font-normal">
          Acceso al sistema interno de gestión operativa
        </p>
      </div>

      <!-- Login Form -->
      <form class="w-full space-y-5" onsubmit="event.preventDefault();">
        
        <!-- Field: Correo o usuario -->
        <div class="space-y-1.5">
          <label for="username" class="block text-[13px] font-medium text-neutral-charcoal">
            Correo o usuario
          </label>
          <div class="relative">
            <input type="text" id="username" name="username" placeholder="nombre@veloxrent.pe o usuario" class="w-full h-12 px-3.5 bg-white border-[1.5px] border-neutral-border rounded-[2px] text-[15px] text-neutral-charcoal placeholder-neutral-muted/60 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors" autocomplete="username" required="">
          </div>
        </div>

        <!-- Field: Contraseña -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label for="password" class="block text-[13px] font-medium text-neutral-charcoal">
              Contraseña
            </label>
          </div>
          <div class="relative">
            <input type="password" id="password" name="password" placeholder="••••••••••••" class="w-full h-12 pl-3.5 pr-12 bg-white border-[1.5px] border-neutral-border rounded-[2px] text-[15px] text-neutral-charcoal placeholder-neutral-muted/60 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors" autocomplete="current-password" required="">
            <button type="button" aria-label="Mostrar u ocultar contraseña" class="absolute right-0 top-0 h-12 w-12 flex items-center justify-center text-neutral-muted hover:text-neutral-charcoal transition-colors focus:outline-none" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Action Button: Ingresar -->
        <div class="pt-3">
          <button type="submit" class="w-full h-[48px] bg-[#1F2A33] text-white font-sans font-medium text-[14px] rounded-[4px] shadow-sm hover:bg-[#1F2A33]/90 active:bg-[#1F2A33]/95 transition-all flex items-center justify-center">
            Ingresar
          </button>
        </div>

        <!-- Link: Forgot Password -->
        <div class="pt-2 text-center">
          <a href="javascript:void(0)" class="inline-block text-[14px] font-medium text-[#9E4C08] hover:underline focus:outline-none focus:ring-1 focus:ring-[#9E4C08] py-2 px-1">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

      </form>
    </div>

    <!-- Subdued footer indicator for internal system -->
    <div class="py-4 text-center">
      <p class="text-[12px] text-neutral-muted">
        VeloxRent ERP v2.6 · Uso exclusivo para personal autorizado
      </p>
    </div>

  </div>




</body></html>
