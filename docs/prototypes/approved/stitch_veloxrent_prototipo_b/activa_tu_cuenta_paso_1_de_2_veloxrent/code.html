<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activa tu cuenta — Paso 1 de 2 - VeloxRent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: #FFFFFF;
      color: #1F2A33;
    }
    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-white p-6 antialiased">
  <main class="w-full max-w-[380px] mx-auto flex flex-col items-stretch">
    <!-- Brand -->
    <div class="mb-6">
      <span class="font-heading font-bold text-[22px] tracking-tight text-[#1F2A33]">VeloxRent</span>
    </div>

    <!-- Stepper (2 dots: 1 active #C6600A, 2 inactive #E2DFD8) -->
    <div class="flex items-center gap-2 mb-6" aria-label="Progreso de activación"><div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#9E4C08]" aria-current="step" title="Paso 1 activo"></span><span class="w-6 h-[2px] bg-[#DDDAD4]"></span><span class="w-2.5 h-2.5 rounded-full bg-[#DDDAD4]" title="Paso 2 pendiente"></span></div><span class="text-[12px] font-medium text-[#4E4A45] ml-2 tracking-wide uppercase">PASO 1 DE 2</span></div>

    <!-- Greeting & Title -->
    <div class="space-y-1 mb-6">
      <h1 class="font-heading font-bold text-[22px] text-[#1F2A33] leading-snug">Hola, [Nombre]</h1>
      <h2 class="font-heading font-medium text-[18px] text-[#1F2A33]">Crea tu nueva contraseña</h2>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-4" onsubmit="event.preventDefault()">
      <!-- Field: Nueva contraseña -->
      <div class="flex flex-col gap-1.5">
        <label for="new-password" class="text-sm font-medium text-[#1F2A33]">Nueva contraseña</label>
        <div class="relative flex items-center">
          <input type="password" id="new-password" name="new-password" placeholder="••••••••" class="w-full h-11 px-3.5 pr-10 text-sm bg-white text-[#1F2A33] border-[1.5px] border-[#A39C90] rounded-[2px] focus:outline-none focus:border-[#1F2A33] transition-colors placeholder:text-[#A39C90]">
          <button type="button" id="toggle-pwd" aria-label="Mostrar u ocultar contraseña" class="absolute right-3 text-[#736E66] hover:text-[#1F2A33] transition-colors p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Field: Confirmar contraseña -->
      <div class="flex flex-col gap-1.5">
        <label for="confirm-password" class="text-sm font-medium text-[#1F2A33]">Confirmar contraseña</label>
        <div class="relative flex items-center">
          <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" class="w-full h-11 px-3.5 pr-10 text-sm bg-white text-[#1F2A33] border-[1.5px] border-[#A39C90] rounded-[2px] focus:outline-none focus:border-[#1F2A33] transition-colors placeholder:text-[#A39C90]">
          <button type="button" id="toggle-confirm-pwd" aria-label="Mostrar u ocultar confirmación de contraseña" class="absolute right-3 text-[#736E66] hover:text-[#1F2A33] transition-colors p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Requirements checklist -->
      <div class="pt-1 pb-2">
        <p class="text-xs font-medium text-[#736E66] mb-2.5">Tu contraseña debe contener:</p>
        <ul class="flex flex-col gap-2 text-[13px] text-[#4E4A45]">
          <!-- Requirement 1: Min 8 chars (demo active state or pending with live script) -->
          <li class="req-item flex items-center gap-2 transition-colors duration-150 text-[#736E66]" id="req-length">
            <span class="icon-indicator w-4 h-4 rounded-full flex items-center justify-center border border-[#A39C90] text-transparent transition-all">
              <svg class="w-3 h-3 text-white" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3.5 8.5 6.5 11.5 12.5 4.5"></polyline>
              </svg>
            </span>
            <span class="">Mínimo 8 caracteres</span>
          </li>

          <!-- Requirement 2: Uppercase letter -->
          <li class="req-item flex items-center gap-2 transition-colors duration-150 text-[#736E66]" id="req-upper">
            <span class="icon-indicator w-4 h-4 rounded-full flex items-center justify-center border border-[#A39C90] text-transparent transition-all">
              <svg class="w-3 h-3 text-white" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3.5 8.5 6.5 11.5 12.5 4.5"></polyline>
              </svg>
            </span>
            <span class="">Al menos una letra mayúscula</span>
          </li>

          <!-- Requirement 3: Number -->
          <li class="req-item flex items-center gap-2 transition-colors duration-150 text-[#736E66]" id="req-number">
            <span class="icon-indicator w-4 h-4 rounded-full flex items-center justify-center border border-[#A39C90] text-transparent transition-all">
              <svg class="w-3 h-3 text-white" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3.5 8.5 6.5 11.5 12.5 4.5"></polyline>
              </svg>
            </span>
            <span class="">Al menos un número</span>
          </li>
        </ul>
      </div>

      <!-- Action Button -->
      <div class="mt-2">
        <button type="submit" id="btn-continue" disabled="" class="w-full h-11 bg-[#1F2A33] text-white font-medium text-sm rounded-[4px] disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer transition-opacity flex items-center justify-center">Continuar</button>
      </div>
    </form>
  </main>

  <script>
    // Password toggles
    function setupToggle(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', () => {
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
      });
    }
    setupToggle('toggle-pwd', 'new-password');
    setupToggle('toggle-confirm-pwd', 'confirm-password');

    // Requirements live evaluation
    const newPwd = document.getElementById('new-password');
    const confirmPwd = document.getElementById('confirm-password');
    const reqLength = document.getElementById('req-length');
    const reqUpper = document.getElementById('req-upper');
    const reqNumber = document.getElementById('req-number');
    const btnContinue = document.getElementById('btn-continue');

    function updateReq(el, isValid) {
      const indicator = el.querySelector('.icon-indicator');
      if (isValid) {
        el.classList.remove('text-[#736E66]');
        el.classList.add('text-[#1E7D4B]', 'font-medium');
        indicator.classList.remove('border-[#A39C90]', 'bg-transparent');
        indicator.classList.add('border-[#1E7D4B]', 'bg-[#1E7D4B]');
      } else {
        el.classList.remove('text-[#1E7D4B]', 'font-medium');
        el.classList.add('text-[#736E66]');
        indicator.classList.remove('border-[#1E7D4B]', 'bg-[#1E7D4B]');
        indicator.classList.add('border-[#A39C90]', 'bg-transparent');
      }
    }

    function evaluatePassword() {
      const val = newPwd.value;
      const confirmVal = confirmPwd.value;

      const hasLength = val.length >= 8;
      const hasUpper = /[A-Z]/.test(val);
      const hasNumber = /[0-9]/.test(val);

      updateReq(reqLength, hasLength);
      updateReq(reqUpper, hasUpper);
      updateReq(reqNumber, hasNumber);

      const allValid = hasLength && hasUpper && hasNumber && val === confirmVal && val.length > 0;
      if (hasLength && hasUpper && hasNumber) {
        btnContinue.removeAttribute('disabled');
      } else {
        btnContinue.setAttribute('disabled', 'true');
      }
    }

    newPwd.addEventListener('input', evaluatePassword);
    confirmPwd.addEventListener('input', evaluatePassword);
  </script>






</body></html>
