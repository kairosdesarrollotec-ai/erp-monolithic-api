  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#1F2A33',
              orange: '#C6600A',
              border: '#A39C90',
              grayText: '#4E4A45',
              subtleBg: '#F8F8F6'
            }
          },

            title: ['Space Grotesk', 'sans-serif'],

      }
    }

  <style>
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: #FFFFFF;
      color: #1F2A33;
      -webkit-font-smoothing: antialiased;
    }
    .font-title {
      font-family: 'Space Grotesk', sans-serif;
    }
    .workplace-card {
      border: 1.5px solid #A39C90;
      border-radius: 4px;
      height: 100px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      background-color: #FFFFFF;
    }
    .workplace-card:hover,
    .workplace-card:focus-visible {
      border-color: #C6600A;
      box-shadow: 0 4px 14px -3px rgba(198, 96, 10, 0.15);
      transform: translateY(-2px);
      outline: none;
    }
    .workplace-card:hover .icon-container,
    .workplace-card:focus-visible .icon-container {
      background-color: #FFF3EB;
      color: #C6600A;
      border-color: rgba(198, 96, 10, 0.2);
    }
    .workplace-card:hover .arrow-indicator,
    .workplace-card:focus-visible .arrow-indicator {
      opacity: 1;
      transform: translateX(0);
      color: #C6600A;
    }
    .workplace-card:active {
      transform: translateY(0);

              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>

      </div>

      <!-- Enlace inferior: Cerrar sesión / Usar otra cuenta -->
      <div class="mt-8 text-center">
