<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Inicio de sesión - VeloxRent</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            space: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#1F2A33',
              accent: '#C6600A',
              border: '#A39C90',
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      font-family: 'Inter', sans-serif;
    }
    .login-card {
      width: 380px;
      max-width: 100%;
    }
    .input-field {
      border: 1.5px solid #A39C90;
      border-radius: 2px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #1F2A33;
      box-shadow: 0 0 0 1px #1F2A33;
    }
  </style>
</head>
<body class="bg-white text-[#1F2A33]">
<!-- Tarjeta de inicio de sesión de 380px de ancho -->
<main class="login-card mx-auto flex flex-col">
<!-- Encabezado / Branding -->
<div class="mb-8">
<div class="font-space font-bold text-[22px] leading-tight text-[#1F2A33] tracking-tight">
        VeloxRent
      </div>
<h1 class="font-space font-semibold text-[20px] leading-tight text-[#1F2A33] mt-2">
        Ingresa a tu cuenta
      </h1>
</div>
<!-- Formulario -->
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Campo Correo o usuario -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] font-medium text-[#1F2A33]" for="username">
          Correo o usuario
        </label>
<input autocomplete="username" class="input-field w-full h-11 px-3.5 text-[14px] text-[#1F2A33] bg-white placeholder-[#8E877D]" id="username" name="username" placeholder="ejemplo@veloxrent.com" required="" type="text" value="usuario@empresa.com">
</div>
<!-- Campo Contraseña -->
<div class="flex flex-col gap-1.5">
<label class="text-[13px] font-medium text-[#1F2A33]" for="password">
          Contraseña
        </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="input-field w-full h-11 pl-3.5 pr-11 text-[14px] text-[#1F2A33] bg-white placeholder-[#8E877D]" id="password" name="password" placeholder="••••••••" required="" type="password" value="secretPassword123">
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-0 top-0 h-11 w-11 flex items-center justify-center text-[#55606A] hover:text-[#1F2A33] transition-colors focus:outline-none" id="togglePassword" type="button">
<!-- Eye icon -->
<svg class="w-5 h-5" fill="none" id="eyeIcon" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Eye off icon (oculto por defecto) -->
<svg class="w-5 h-5 hidden" fill="none" id="eyeOffIcon" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Botón Ingresar -->
<div class="flex items-center gap-2 text-[14px] text-[#C22B2B]" role="alert" style="background-color: #FBE9E9; border-left: 3px solid #C22B2B; border-radius: 2px; padding: 10px 14px; margin-top: -4px; margin-bottom: 0px; font-family: 'Public Sans', sans-serif;">
<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="#C22B2B" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Correo o contraseña incorrectos</span>
</div><button class="w-full h-11 mt-1 bg-[#1F2A33] text-white font-medium text-[15px] rounded-[4px] hover:bg-[#2C3B47] active:bg-[#161E25] transition-colors focus:outline-none focus:ring-2 focus:ring-[#1F2A33] focus:ring-offset-2 cursor-pointer flex items-center justify-center" type="submit">
        Ingresar
      </button>
<!-- Enlace ¿Olvidaste tu contraseña? -->
<div class="text-center mt-2">
<a class="text-[14px] text-[#C6600A] hover:underline font-medium focus:outline-none focus:ring-1 focus:ring-[#C6600A] rounded-sm py-0.5" href="#recuperar-password">
          ¿Olvidaste tu contraseña?
        </a>
</div>
</form>
</main>
<script>
    // Interacción simple para alternar mostrar/ocultar contraseña
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        if (eyeIcon && eyeOffIcon) {
          eyeIcon.classList.toggle('hidden', isPassword);
          eyeOffIcon.classList.toggle('hidden', !isPassword);
        }
      });
    }
  </script>

</body></html>
