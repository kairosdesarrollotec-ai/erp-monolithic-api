# Postgres local para desarrollo de apps/api.
# El mismo docker-compose.yml se usa como base para levantar la BD
# en cualquier entorno (local, staging) - las credenciales productivas
# reales van siempre por variables de entorno (.env), nunca hardcodeadas
# aqui ni en el repositorio.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kairos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kairos_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kairos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kairos_postgres_data:
