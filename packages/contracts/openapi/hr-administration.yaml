            application/json:
              schema: { $ref: '#/components/schemas/TrainingResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.REGISTER_TRAINING }
