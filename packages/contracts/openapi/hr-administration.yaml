openapi: 3.1.0
info:
  title: KAIROS ERP - Human Resources Administration API
  version: 0.15.0
  description: >
    0.15.0 (23-oct-2026, Frente C7):
    - DEC-HR-DOC-VERSION-001 (HU-31): Modelo de documentos TH con versiones append-only (hr_document_versions) e índice único parcial para versión vigente única por documento (idx_hr_doc_single_current). Confirmación de lectura ligada a la versión vigente.
    - DEC-HR-APPROVAL-001 (C5): Aprobación/denegación de permisos (AUTHORIZE_LEAVE) y concesión de vacaciones (SCHEDULE_VACATION) exclusivo de GERENCIA por defecto.
    0.14.0 (23-oct-2026, Frente R6):
    - DEC-HR-DOCS-SENSITIVE-001 (HU-31 & HU-35):
      (1) HU-31 Documentación de Talento Humano con versión vigente: POST /hr-documents (solo Gerencia), GET /hr-documents/active y POST /hr-documents/{id}/confirm-read. Versionado append-only, auditoría de lectura por colaborador.
      (2) HU-35 Datos personales sensibles del colaborador (DNI, sueldo base, contrato y cuenta bancaria): protegidos por permiso específico HR_ADMINISTRATION.VIEW_EMPLOYEE_SENSITIVE_DATA (por defecto solo GERENCIA, editable en la matriz ADM-02). Sin este permiso, documentNumber, baseSalary, bankName, bankAccountNumber, bankAccountCci, contractType, contractUrl, contractNotes salen en null y se listan en restrictedFields.
    0.13.0 (23-oct-2026, Frente R4):
    - DEC-ADP-SELF-SERVICE-001 Autoservicio de vacaciones y permisos: GET/POST /me/leaves y GET/POST /me/vacations para el propio colaborador (resuelve su ficha por cuenta/contexto). Vacaciones se crean en SOLICITADA y emiten notificaciones in-app vía outbox (PermisoSolicitado.v1, VacacionSolicitada.v1).
    - PATCH /vacations/{id}/resolve para resolución por Gerencia: soporta conceder menos días de los solicitados (grantedDays), reprogramar o rechazar/cancelar.
    0.12.0 (23-oct-2026, Frente R3):
    - DEC-ADP-FIELD-TRIP-001 Cascada de salidas a campo: exactamente 3 niveles con tiempo configurable por tenant (3..10 min, vigente 5 min). Nivel 1 y 2 = Gerencia; Nivel 3 = Administracion o Gerencia. Agotados los 3 niveles: NO_AUTORIZADA con mensaje de consulta manual a Gerencia. Permiso AUTHORIZE_FIELD_TRIP otorgado a ADMINISTRACION por defecto y editable en la matriz ADM-02.
    0.11.0 (23-oct-2026, Frente D):
    (1) DEC-ADP-VAC-001 Vacaciones: cupo máximo de 1 persona POR EMPRESA a la vez (actualizado de 1 por área a 1 por empresa;
    sin lista de espera, se reprograma si no hay cupo; aprueba Gerencia).
    (2) Alerta de fin de periodo de prueba: 15 días antes del vencimiento de los 3 meses a Gerencia.
    0.10.0 (22-oct-2026, Respuestas Russbel #4, #5, #9, #10 y HU-35; ADITIVO salvo lo marcado COMPORTAMIENTO CAMBIADO):
    (1) #10 Vacaciones en conflicto: POST /vacations/{id}/reschedule (nuevas fechas libres + motivo, estado REPROGRAMADA, conserva las
    fechas originales) y POST /vacations/{id}/cancel (estado CANCELADA, libera el cupo, motivo). Misma regla de capacidad que programar
    (BR-ADP-002: maximo 1 persona por area dentro de la misma empresa, parametrizada en el back; PENDIENTE de confirmar si pasa a
    «2 por empresa»), transaccion Serializable, auditoria. Permiso SCHEDULE_VACATION. VacationRequestResponse suma originalStartDate,
    originalEndDate, rescheduleCount, statusReason, statusChangedAt, statusChangedById.
    (2) #9 Asistencia con autoservicio y control: POST /me/attendance (marca propia con foto obligatoria en la entrada, ubicacion
    obligatoria, geocerca contra la sede, una marca por dia y tipo, hora del cliente con tope de antiguedad), GET /me/attendance,
    GET /attendance/pending-review, PATCH /attendance/{id}/review (aprobar o corregir marcas fuera de geocerca) y
    GET|PUT|DELETE /branches/{branchId}/geofence. Permisos nuevos editables en ADM-02: LOG_OWN_ATTENDANCE, REVIEW_ATTENDANCE,
    MANAGE_GEOFENCE. COMPORTAMIENTO CAMBIADO: POST /employees/{id}/attendance (registro «a nombre de» otro colaborador) ahora exige
    `reason` en PRESENTE/TARDANZA (422 ATTENDANCE_REASON_REQUIRED) y queda auditado como origen ON_BEHALF.
    (3) #5 La terminacion crea la vacante en Reclutamiento de forma asincrona: EmploymentTerminationResponse.vacancyCreatedId se
    informa en el expediente (GET /employees/{id}) una vez consumido el evento (en la respuesta inmediata de /terminate es null).
    (4) #4 La cascada de salidas a campo publica eventos de alerta (solicitada / escalada / nadie autorizo / resuelta) que el tablero
    muestra a quien tenga NOTIFICATIONS.RECEIVE_FIELD_TRIP_ALERTS (v0 Gerencia); sin cambio HTTP.
    (5) HU-35 COMPORTAMIENTO CAMBIADO: EmployeeResponse.documentNumber y baseSalary salen en null (y se listan en `restrictedFields`)
    para roles sin permiso: el documento requiere HR_ADMINISTRATION.VIEW_EMPLOYEE_DOCUMENT (v0 Gerencia, RRHH, Administracion; no
    Auditoria ni Finanzas) y el sueldo HR_ADMINISTRATION.MANAGE_SALARY (v0 solo Gerencia). La busqueda por documento en GET /employees
    solo aplica si el rol puede ver documentos.

    0.9.0 (frente B2, 2026-10-21): POST /employees: `baseSalary` solo lo fija Gerencia (HR_ADMINISTRATION.MANAGE_SALARY), igual que en
    PATCH. Otro rol que envie un `baseSalary` distinto de null recibe 403 EMPLOYEE_SALARY_GERENCIA_ONLY y NO se crea la ficha
    (COMPORTAMIENTO CAMBIADO). Sin sueldo (omitido o null) la ficha se crea normalmente con `baseSalary: null` = pendiente de que
    Gerencia lo complete con PATCH (el campo ya era nulable).

    0.8.0 — Respuestas de negocio 2026-10-20 (frente B, ADITIVO salvo lo indicado): (1) Catálogo de áreas = 7 del organigrama +
    Gerencia General / Subgerencia (GERENCIA_GENERAL) + Gestión y Procesos (GESTION_Y_PROCESOS); «RRHH» / «Recursos Humanos» se
    mapean a TALENTO_HUMANO (areaCode, areaName y filtros). Nuevos POST /hr-areas (alta; 409 HR_AREA_ALREADY_EXISTS),
    POST /hr-areas/{code}/deactivate (409 HR_AREA_IN_USE si hay colaboradores activos) y /reactivate: SOLO Gerencia (permiso nuevo
    HR_ADMINISTRATION.MANAGE_AREAS); GET /hr-areas acepta includeInactive=true (solo MANAGE_AREAS) y HrArea expone `isActive`.
    (2) Vacaciones: el cupo «máximo 1 persona por área» se evalúa POR EMPRESA (misma área en dos empresas ya no choca); sin
    cambio de esquema HTTP. (3) PATCH /employees/{id}: `baseSalary` solo lo cambia Gerencia (permiso nuevo
    HR_ADMINISTRATION.MANAGE_SALARY); otro rol con un valor distinto al vigente recibe 403 EMPLOYEE_SALARY_GERENCIA_ONLY y no se
    guarda nada (reenviar el mismo valor no cuenta); `email` vacío ("" o null) desvincula la ficha sin error (accountRelink
    UNLINKED); el backend NO notifica a la cuenta anterior. EmployeeResponse añade `areaCode` (= areaId). (4) HU-29: POST
    /employees/{id}/attendance acepta `latitude`, `longitude`, `accuracy` OPCIONALES (ubicación automática); 422
    INVALID_ATTENDANCE_RECORD si están fuera de rango o viene solo una coordenada; AttendanceRecordResponse los devuelve (null si
    no se capturó).

    0.7.0 — H-02 / DEC-ADP-AREAS-001..003 (ADITIVO, sin romper clientes): catálogo de áreas de RR.HH. por empresa como dato
    de referencia. Nuevo GET /hr-areas (lectura; mismos permisos HR_ADMINISTRATION.VIEW_EMPLOYEES, MANAGE_EMPLOYEES o
    SCHEDULE_VACATION). POST /employees y PATCH /employees/{id} aceptan `areaCode` (código del catálogo; manda sobre
    `areaId`/`areaName`; 422 HR_AREA_NOT_FOUND si no existe); el texto libre (`areaName`, `areaId`) sigue permitido por
    compatibilidad: si coincide con un área del catálogo (sin mayúsculas ni tildes) se guarda como esa área, y si no, se guarda
    como texto libre con `areaId` normalizado — así la capacidad de vacaciones por área (BR-ADP-002, 1 persona a la vez) no se
    parte por diferencias de escritura. `Employee.areaId` es el `code` cuando el área es del catálogo. GET /employees y GET
    /vacations/calendar aceptan `areaCode` como alias de `areaId`. Sin cambios de esquema en las respuestas existentes. La
    semilla del catálogo trae solo las áreas documentadas de VeloxRent (Administración, Talento Humano, Servicios Generales,
    Desarrollo de Tecnología, Atención al cliente, Marketing, Operaciones).

    0.6.0 — DEC-ADP-EDIT-ETAG-001 / DEC-ADP-RELINK-001 (ADITIVO, sin romper clientes): PATCH /employees/{id} acepta el
    header OPCIONAL If-Match (ETag fuerte de la versión de la ficha, ej. "3"); si no coincide responde 412
    EMPLOYEE_VERSION_CONFLICT sin aplicar la edición (If-Match mal formado = 400 IF_MATCH_INVALID). EmployeeResponse expone
    `version` y GET/PATCH /employees/{id} devuelven el header ETag. La respuesta del PATCH añade `accountRelink`
    (UpdateEmployeeResponse) SOLO cuando la edición cambió el vínculo con la cuenta: action RELINKED (nueva cuenta) o
    UNLINKED (no hay cuenta con el correo nuevo), para que el front muestre el aviso.

    0.5.0 — DEC-ADP-LINK-EMAIL-002: PATCH /employees/{id} con un correo distinto
    en una ficha YA vinculada la re-vincula a la cuenta del correo nuevo (audita
    EMPLOYEE_ACCOUNT_RELINKED); si no existe cuenta con ese correo la ficha queda
    sin vincular (EMPLOYEE_ACCOUNT_UNLINKED) hasta que exista y se use
    POST /employees/{id}/link-account; 409 EMPLOYEE_ACCOUNT_ALREADY_LINKED si la
    cuenta del correo nuevo ya pertenece a otro colaborador (no se aplica la
    edición). Sin cambios de esquema. Foto de asistencia: solo PRESENTE y
    TARDANZA (permisos y faltas no la llevan).

    0.4.0 — DEC-ADP-ATT-EVIDENCE-002: la evidencia de asistencia es OBLIGATORIA
    en marcaciones de presencia (PRESENTE/TARDANZA) de registros nuevos:
    POST /employees/{id}/attendance responde 422 ATTENDANCE_EVIDENCE_REQUIRED
    sin `evidence`; las faltas y permisos no la exigen (no hay foto posible) y los
    registros históricos sin evidencia siguen válidos (evidenceMissing = true).
    Nuevo POST /employees/{id}/attendance/evidence/upload-url (URL firmada GCS,
    la pide el propio colaborador o quien tenga LOG_ATTENDANCE); su `storageRef`
    es el que se envía en evidence.storageRef (se valida el prefijo del
    colaborador). DEC-ADP-LINK-EMAIL-001: nuevo POST /employees/{id}/link-account
    (vincula la ficha con la cuenta del mismo correo; 409 si ya está vinculado a
    otro); EmployeeResponse expone `accountLinked`; el correo del colaborador se
    normaliza (trim + minúsculas) y al crear/editar se intenta vincular.

    0.3.0 — DEC-TZ-LIMA-001 — Zona horaria de negocio America/Lima (UTC-5,
    sin DST): toda fecha date-only (YYYY-MM-DD) enviada a esta API como
    inicio/fin/ventana de viaje, disponibilidad, reserva, alquiler, devolución
    o reporte se interpreta como 00:00 America/Lima (= 05:00Z); los date-time
    con offset/Z se respetan tal cual. Los textos de notificaciones/documentos
    muestran fecha y hora de Lima. Los campos `format: date` de calendario
    puro (p. ej. travelStartDate) no cambian.

    0.3.0 — DEC-ADP-ATT-EVIDENCE-001: POST /employees/{id}/attendance
    acepta `evidence` opcional {kind: WHATSAPP_PHOTO, storageRef|url,
    capturedAtLocal, note}; la asistencia NO es biométrica ni se importa (no
    existe ni existirá un comando de importación); la corroboración es la foto
    con reloj+hora+rostro enviada al grupo de WhatsApp. El registro guarda
    quién la corroboró. AttendanceRecordResponse expone `evidence` y
    `evidenceMissing`. Compatible hacia atrás: la evidencia es opcional. Los
    honorarios se llenan manualmente por Gerencia; el GPS de salidas a campo
    sigue pendiente.

    Contrato del módulo de Administración de Personal (ADP-01 a ADP-10).
    Fuentes canónicas: BDD-06 (BDD-ADP-001 v1.9), SDD-06 (SDD-KAIROS-MVP-002 / ADP v2.1) y TDD-06 (TDD-KAIROS-MVP-002 / ADP v2.1).
    Cubre los 5 subflujos de personal:
      1. Asistencia y control de faltas/tardanzas con deducciones salariales a fin de mes (ADP-P01..04, BR-ADP-001).
      2. Solicitud y autorización de permisos/salidas antes de hora exclusiva de Jefatura (ADP-P05..06, BR-ADP-003).
      3. Programación de vacaciones con validación de capacidad de área (máximo 1 persona a la vez, BR-ADP-002, DR-ADP-001).
      4. Cascada de autorización de salidas a campo en 3 niveles con temporizador de 5 min por nivel, SIN 4to nivel automático (ADP-P12..14, BR-ADP-004, DR-ADP-002) y control de retrasos con advertencias/observación (BR-ADP-005).
      5. Desvinculación laboral (renuncia/despido) y emisión de evento RelacionLaboralTerminada hacia Reclutamiento (ADP-P15..17, BR-ADP-006, ADR-KAI-006).

    Todas las rutas requieren `Authorization: Bearer <Firebase ID token>` y autorización deny-by-default por la matriz
    dinámica de permisos (módulo HR_ADMINISTRATION, ADM-02): nunca se decide por nombre de persona ni de rol.
    Contexto de trabajo: las rutas que operan sobre un recurso concreto (`/employees/{id}/...`, `/leaves/{id}/...`,
    `/field-trips/{id}/...`) validan contra la empresa y sede del propio colaborador; las rutas de listado, resumen,
    calendario y descuentos reciben `companyId` y `branchId` (contexto vigente del usuario, 403 si no es una
    asignación activa).

    Errores: cuerpo `{ statusCode, code, detail }` (ver schema ProblemDetail). Códigos de negocio: EMPLOYEE_NOT_FOUND,
    DUPLICATE_EMPLOYEE_DOCUMENT, HR_AREA_NOT_FOUND, AREA_REQUIRED, CANDIDATE_ALREADY_EMPLOYEE, EMPLOYEE_TERMINATED, EMPLOYEE_STATUS_TRANSITION_NOT_ALLOWED,
    ATTENDANCE_ALREADY_LOGGED, INVALID_ATTENDANCE_RECORD, INVALID_PAYROLL_MONTH, DEDUCTIONS_BEFORE_MONTH_END,
    LEAVE_NOT_FOUND, LEAVE_ALREADY_RESOLVED, INVALID_LEAVE_STATUS, INVALID_DATE_RANGE, VACATION_OVERLAP,
    FIELD_TRIP_NOT_FOUND, FIELD_TRIP_NOT_PENDING, FIELD_TRIP_NOT_AUTHORIZED, FIELD_TRIP_TIMEOUT_NOT_ELAPSED,
    INVALID_FIELD_TRIP_DATES, INVALID_AUTHORIZATION_LEVEL, AUTHORIZATION_LEVEL_NOT_REACHED, NO_AUTHORIZATION_AVAILABLE,
    EMPLOYMENT_ALREADY_TERMINATED, INVALID_TERMINATION_NOTICE, TERMINATION_NOTES_REQUIRED, FINAL_SETTLEMENT_REQUIRED,
    FIELD_TRIP_REJECTION_REASON_REQUIRED, EMPLOYEE_NOT_LINKED, ATTENDANCE_NOT_FOUND, ATTENDANCE_NOT_RECLASSIFIABLE, INVALID_ATTENDANCE_EVIDENCE,
    INVALID_ATTENDANCE_RECLASSIFICATION, LEAVE_EVIDENCE_NOT_ALLOWED, INVALID_LEAVE_EVIDENCE, EVIDENCE_STORAGE_UNAVAILABLE,
    TRAINING_ATTENDEES_INVALID, INVALID_TRAINING.

    Automatismos (v0.2.0): la cascada de salidas a campo avanza sola cuando vence el temporizador de cada nivel
    (3 niveles x 5 min, termina en NO_AUTORIZADA, nunca aprueba por defecto) y el memo por reincidencia (4ª tardanza al
    regresar de campo, 2ª falta injustificada del mes) se genera automáticamente; ambos quedan en la auditoría.

paths:
  /employees:
    post:
      operationId: createEmployee
      summary: Registrar nuevo colaborador en administración de personal
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployeeRequest' }
      responses:
        '201':
          description: Colaborador registrado exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: 'Rol sin permiso HR_ADMINISTRATION.MANAGE_EMPLOYEES o contexto no autorizado; o baseSalary enviado sin permiso HR_ADMINISTRATION.MANAGE_SALARY (EMPLOYEE_SALARY_GERENCIA_ONLY)' }
        '409': { description: Documento ya registrado para la empresa o Idempotency-Key en conflicto }
    get:
      operationId: listEmployees
      summary: Listar colaboradores con filtros de empresa, sede, estado y área
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid }, description: Sede del contexto de trabajo; el listado se limita a esa sede }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/EmployeeStatus' } }
        - { name: areaId, in: query, required: false, schema: { type: string } }
        - { name: areaCode, in: query, required: false, schema: { type: string }, description: 'Código del catálogo de áreas (alias de areaId; se normaliza). Si vienen ambos manda areaCode.' }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Lista de colaboradores
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EmployeeResponse' }
                  total: { type: integer }
        '400': { description: Parámetros inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.VIEW_EMPLOYEES o contexto empresa/sede no vigente }

  /hr-areas:
    get:
      operationId: listHrAreas
      summary: Catálogo de áreas de RR.HH. de la empresa (dato de referencia, solo lectura)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid }, description: Sede del contexto de trabajo (el catálogo es de la empresa) }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean }, description: Incluye áreas desactivadas. Solo con permiso HR_ADMINISTRATION.MANAGE_AREAS (Gerencia). }
      responses:
        '200':
          description: Áreas activas de la empresa, ordenadas por sortOrder y nombre (lista vacía si la empresa aún no tiene catálogo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrAreaList' }
        '400': { description: Parámetros inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: 'Rol sin permiso HR_ADMINISTRATION.VIEW_EMPLOYEES, MANAGE_EMPLOYEES o SCHEDULE_VACATION (o sin MANAGE_AREAS si se pide includeInactive), o contexto no vigente' }
    post:
      operationId: createHrArea
      summary: Dar de alta un área en el catálogo de la empresa (solo Gerencia General)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHrAreaRequest' }
      responses:
        '201':
          description: Área creada (el `code` se deriva del nombre; queda al final del orden)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrArea' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_AREAS (solo Gerencia) o contexto no vigente }
        '409': { description: Ya existe un área con ese código, nombre o alias en la empresa, activa o inactiva (HR_AREA_ALREADY_EXISTS) }
        '422': { description: El nombre no produce un código válido (HR_AREA_NAME_INVALID) }

  /hr-areas/{code}/deactivate:
    post:
      operationId: deactivateHrArea
      summary: Desactivar un área del catálogo (solo Gerencia); deja de ofrecerse, conserva el histórico. Idempotente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HrAreaContextRequest' }
      responses:
        '200':
          description: Área desactivada (o ya lo estaba)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrArea' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_AREAS }
        '409': { description: Hay colaboradores activos asignados al área (HR_AREA_IN_USE) }
        '422': { description: El área no existe en la empresa (HR_AREA_NOT_FOUND) }

  /hr-areas/{code}/reactivate:
    post:
      operationId: reactivateHrArea
      summary: Reactivar un área desactivada (solo Gerencia). Idempotente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HrAreaContextRequest' }
      responses:
        '200':
          description: Área activa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HrArea' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_AREAS }
        '422': { description: El área no existe en la empresa (HR_AREA_NOT_FOUND) }

  /employees/{id}:
    get:
      operationId: getEmployee
      summary: Obtener expediente y detalle del colaborador
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detalle completo del colaborador
          headers:
            ETag: { description: Versión de la ficha, ej. "3" (úsala en If-Match al editar), schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDetailResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.VIEW_EMPLOYEES }
        '404': { description: Colaborador no encontrado }
    patch:
      operationId: updateEmployee
      summary: Actualizar datos laborales del colaborador (área, puesto, salario, sede, correo). Si cambia el correo de una ficha vinculada, se re-vincula a la cuenta del correo nuevo (o queda sin vincular si no existe)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: If-Match
          in: header
          required: false
          description: ETag fuerte con la versión de la ficha que el cliente leyó (ej. "3"). Opcional; si se envía y no coincide, 412 EMPLOYEE_VERSION_CONFLICT.
          schema: { type: string, example: '"3"' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeRequest' }
      responses:
        '200':
          description: Colaborador actualizado (incluye `accountRelink` si cambió el vínculo con la cuenta)
          headers:
            ETag: { description: Versión nueva de la ficha, ej. "4", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateEmployeeResponse' }
        '400': { description: Datos inválidos o If-Match mal formado (IF_MATCH_INVALID) }
        '401': { description: Token ausente o inválido }
        '403': { description: 'Rol sin permiso HR_ADMINISTRATION.MANAGE_EMPLOYEES, o baseSalary distinto al vigente sin permiso MANAGE_SALARY (solo Gerencia): code EMPLOYEE_SALARY_GERENCIA_ONLY' }
        '404': { description: Colaborador no encontrado }
        '409': { description: El colaborador ya está terminado (EMPLOYEE_TERMINATED) o el correo nuevo pertenece a una cuenta ya vinculada a otro colaborador (EMPLOYEE_ACCOUNT_ALREADY_LINKED) }
        '412': { description: La ficha cambió desde que se leyó - recargar (EMPLOYEE_VERSION_CONFLICT) }
        '422': { description: Cambio de estado no permitido por edición - TERMINADO solo se registra con /terminate (EMPLOYEE_STATUS_TRANSITION_NOT_ALLOWED) }

  /employees/{id}/attendance:
    post:
      operationId: logAttendance
      summary: Registrar marcación o reporte de asistencia/falta (ADP-P01..04, BR-ADP-001)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogAttendanceRequest' }
      responses:
        '201':
          description: Asistencia registrada exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.LOG_ATTENDANCE }
        '404': { description: Colaborador no encontrado }
        '409': { description: Ya existe marcación para la fecha indicada (ATTENDANCE_ALREADY_LOGGED) o el colaborador está terminado (EMPLOYEE_TERMINATED) }
        '422': { description: Registro inválido, p. ej. una tardanza sin minutos (INVALID_ATTENDANCE_RECORD), evidencia mal formada o con storageRef ajeno al colaborador (INVALID_ATTENDANCE_EVIDENCE), o presencia sin foto de evidencia (ATTENDANCE_EVIDENCE_REQUIRED) }
    get:
      operationId: getEmployeeAttendance
      summary: Listar historial de asistencia del colaborador
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: month, in: query, required: false, schema: { type: string, example: '2026-10' } }
        - { name: startDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: endDate, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Registros de asistencia
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceRecordResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.VIEW_EMPLOYEES }
        '404': { description: Colaborador no encontrado }

  /employees/{id}/attendance/evidence/upload-url:
    post:
      operationId: requestAttendanceEvidenceUploadUrl
      summary: Pedir URL firmada para subir la foto de asistencia (reloj + hora + rostro) — DEC-ADP-ATT-EVIDENCE-002
      description: >
        Paso 1 de la evidencia obligatoria. Lo puede pedir el propio colaborador (ficha vinculada a su cuenta por
        correo, con asignación vigente en la sede) o quien tenga HR_ADMINISTRATION.LOG_ATTENDANCE. Paso 2: subir con PUT
        (Content-Type = contentType) a `uploadUrl` y registrar la asistencia con evidence.storageRef = `storageRef`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestAttendanceEvidenceUploadRequest' }
      responses:
        '201':
          description: URL firmada de subida directa y referencia del objeto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceEvidenceUploadSessionResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: No es el propio colaborador y no tiene HR_ADMINISTRATION.LOG_ATTENDANCE }
        '404': { description: Colaborador no encontrado }
        '409': { description: El colaborador está terminado (EMPLOYEE_TERMINATED) }
        '422': { description: Tipo de archivo no admitido o tamaño excedido (INVALID_ATTENDANCE_EVIDENCE) }
        '503': { description: Almacenamiento no configurado (EVIDENCE_STORAGE_UNAVAILABLE) }

  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      summary: Resumen de asistencias, faltas y cálculo de descuentos a fin de mes (BR-ADP-001)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid }, description: Sede del contexto de trabajo (el resumen es de toda la empresa) }
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-10' } }
      responses:
        '200':
          description: Resumen mensual y cálculo de deducciones de nómina (solo colaboradores con tardanzas o faltas injustificadas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyAttendanceSummaryResponse' }
        '400': { description: Parámetros inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.VIEW_EMPLOYEES o LOG_ATTENDANCE }

  /attendance/apply-deductions:
    post:
      operationId: applyMonthDeductions
      summary: Aplicar descuentos por faltas y tardanzas en la liquidación de fin de mes (BR-ADP-001)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyDeductionsRequest' }
      responses:
        '200':
          description: Descuentos liquidados exitosamente para el mes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyDeductionsResponse' }
        '400': { description: Datos inválidos (INVALID_PAYROLL_MONTH) }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_EMPLOYEES }
        '422': { description: El mes todavía no cierra - los descuentos se aplican a fin de mes, nunca en la quincena (DEDUCTIONS_BEFORE_MONTH_END, BR-ADP-001) }

  /employees/{id}/leaves:
    post:
      operationId: requestLeave
      summary: Solicitar permiso o salida antes de hora (ADP-P05..06, BR-ADP-003)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestLeaveRequest' }
      responses:
        '201':
          description: Solicitud de permiso registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin ninguno de los permisos HR_ADMINISTRATION.MANAGE_EMPLOYEES, AUTHORIZE_LEAVE o REQUEST_FIELD_TRIP }
        '404': { description: Colaborador no encontrado }
        '409': { description: El colaborador está terminado (EMPLOYEE_TERMINATED) }
    get:
      operationId: getEmployeeLeaves
      summary: Listar permisos del colaborador
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Historial de permisos del colaborador
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaveRequestResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.VIEW_EMPLOYEES }
        '404': { description: Colaborador no encontrado }

  /leaves/{id}/resolve:
    patch:
      operationId: resolveLeave
      summary: Autorizar o denegar solicitud de permiso (exclusivo Jefatura, BR-ADP-003)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveLeaveRequest' }
      responses:
        '200':
          description: Solicitud de permiso resuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequestResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.AUTHORIZE_LEAVE }
        '404': { description: Solicitud no encontrada }
        '409': { description: La solicitud ya fue resuelta previamente (LEAVE_ALREADY_RESOLVED) }

  /employees/{id}/vacations:
    post:
      operationId: scheduleVacation
      summary: Programar vacaciones con verificación de capacidad por empresa (máximo 1 persona a la vez por empresa, DEC-ADP-VAC-001, BR-ADP-002, DR-ADP-001)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleVacationRequest' }
      responses:
        '201':
          description: Vacaciones programadas exitosamente (estado PROGRAMADA, sin superposición en la empresa)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequestResponse' }
        '400': { description: Rango de fechas inválido }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.SCHEDULE_VACATION }
        '404': { description: Colaborador no encontrado }
        '409':
          description: Conflicto de superposición de vacaciones en la empresa - máximo 1 persona a la vez por empresa, prioridad a quien solicitó primero (VACATION_OVERLAP) o colaborador terminado (EMPLOYEE_TERMINATED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      operationId: getEmployeeVacations
      summary: Listar vacaciones del colaborador
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Historial de vacaciones del colaborador
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VacationRequestResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.VIEW_EMPLOYEES }
        '404': { description: Colaborador no encontrado }

  /vacations/{id}/reschedule:
    post:
      operationId: rescheduleVacation
      summary: Reprogramar vacaciones en conflicto a otra fecha libre (22-oct, #10; sin lista de espera)
      description: >
        Mueve las vacaciones (SOLICITADA / PROGRAMADA / REPROGRAMADA) a nuevas fechas y las deja en estado REPROGRAMADA, conservando las
        fechas originales (`originalStartDate/EndDate`) y contando el cambio (`rescheduleCount`). Valida con la MISMA regla de capacidad
        que programar (BR-ADP-002), ignorando la propia solicitud; si las nuevas fechas chocan: 409 VACATION_OVERLAP. Motivo obligatorio.
        Permiso SCHEDULE_VACATION. Auditoria VACATION_RESCHEDULED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleVacationRequest' }
      responses:
        '200':
          description: Vacaciones reprogramadas (estado REPROGRAMADA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequestResponse' }
        '400': { description: Datos inválidos o rango de fechas invertido (INVALID_DATE_RANGE) }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.SCHEDULE_VACATION }
        '404': { description: Vacaciones no encontradas (VACATION_NOT_FOUND) }
        '409':
          description: Las nuevas fechas chocan con otras vacaciones del área en la empresa (VACATION_OVERLAP), las vacaciones ya no se pueden modificar (VACATION_NOT_MODIFIABLE) o el colaborador está terminado (EMPLOYEE_TERMINATED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422': { description: 'Motivo ausente o corto (VACATION_CHANGE_REASON_REQUIRED), mismas fechas que las actuales (VACATION_RESCHEDULE_UNCHANGED) o fecha de inicio anterior a hoy en Lima (VACATION_DATE_IN_PAST)' }

  /vacations/{id}/cancel:
    post:
      operationId: cancelVacation
      summary: Cancelar vacaciones (22-oct, #10) liberando el cupo del área
      description: SOLICITADA / PROGRAMADA / REPROGRAMADA -> CANCELADA con motivo obligatorio. Permiso SCHEDULE_VACATION. Auditoria VACATION_CANCELLED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelVacationRequest' }
      responses:
        '200':
          description: Vacaciones canceladas (estado CANCELADA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequestResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.SCHEDULE_VACATION }
        '404': { description: Vacaciones no encontradas (VACATION_NOT_FOUND) }
        '409': { description: Las vacaciones ya no se pueden modificar (VACATION_NOT_MODIFIABLE) }
        '422': { description: Motivo ausente o corto (VACATION_CHANGE_REASON_REQUIRED) }

  /vacations/{id}/resolve:
    patch:
      operationId: resolveVacation
      summary: Resolver solicitud de vacaciones (Gerencia aprueba con grantedDays, reprograma o rechaza)
      description: >
        Gerencia aprueba vacaciones (pasa a PROGRAMADA respetando cupo de 1 persona a la vez por empresa, soportando
        conceder menos días de los solicitados con grantedDays), reprograma (REPROGRAMADA con motivo) o rechaza (CANCELADA con motivo).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveVacationRequest' }
      responses:
        '200':
          description: Solicitud de vacaciones resuelta exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequestResponse' }
        '400': { description: Días otorgados inválidos o datos incompletos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.SCHEDULE_VACATION o AUTHORIZE_LEAVE }
        '404': { description: Solicitud de vacaciones no encontrada }
        '409': { description: Conflicto de cupo por empresa o vacaciones ya resueltas }

  /vacations/calendar:
    get:
      operationId: getVacationsCalendar
      summary: Calendario de vacaciones de todas las áreas para verificar disponibilidad (BR-ADP-002)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid }, description: Sede del contexto de trabajo (el calendario es de toda la empresa) }
        - { name: areaId, in: query, required: false, schema: { type: string } }
        - { name: areaCode, in: query, required: false, schema: { type: string }, description: 'Código del catálogo de áreas (alias de areaId; se normaliza). Si vienen ambos manda areaCode.' }
        - { name: year, in: query, required: true, schema: { type: integer, example: 2026 } }
        - { name: month, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200':
          description: Calendario de programación de vacaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VacationRequestResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.VIEW_EMPLOYEES o SCHEDULE_VACATION }

  /field-trips:
    get:
      operationId: listFieldTrips
      summary: Listar solicitudes de salida a campo y estado de cascada
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid }, description: Sede del contexto de trabajo; el listado se limita a esa sede }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/FieldTripStatus' } }
        - { name: employeeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de salidas a campo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FieldTripResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.REQUEST_FIELD_TRIP, AUTHORIZE_FIELD_TRIP ni EVALUATE_FIELD_TRIP_RETURN }

  /employees/{id}/field-trips:
    post:
      operationId: requestFieldTrip
      summary: Solicitar salida a campo e iniciar cascada de 3 niveles con temporizador de 5 min (ADP-P12..14, BR-ADP-004)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestFieldTripRequest' }
      responses:
        '201':
          description: Salida a campo solicitada en estado PENDIENTE_NIVEL_1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTripResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.REQUEST_FIELD_TRIP }
        '404': { description: Colaborador no encontrado }
        '409': { description: El colaborador está terminado (EMPLOYEE_TERMINATED) }

  /field-trips/{id}:
    get:
      operationId: getFieldTrip
      summary: Ver estado y trazabilidad de cascada de salida a campo
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detalle de salida a campo y nivel alcanzado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTripResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.REQUEST_FIELD_TRIP ni AUTHORIZE_FIELD_TRIP }
        '404': { description: Salida a campo no encontrada }

  /field-trips/{id}/authorize:
    post:
      operationId: authorizeFieldTrip
      summary: Autorizar salida a campo en el nivel actual (Nivel 1 de 3, 2 de 3 o 3 de 3; lo decide el permiso AUTHORIZE_FIELD_TRIP, BR-ADP-004)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizeFieldTripRequest' }
      responses:
        '200':
          description: Salida a campo autorizada con el nivel alcanzado (1, 2 o 3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTripResponse' }
        '400': { description: Nivel de autorización inválido - solo 1, 2 o 3, nunca 4 (INVALID_AUTHORIZATION_LEVEL) - o nivel aún no alcanzado por la cascada, no se saltan niveles (AUTHORIZATION_LEVEL_NOT_REACHED) }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.AUTHORIZE_FIELD_TRIP }
        '404': { description: Salida a campo no encontrada }
        '409': { description: La salida no está pendiente de autorización (FIELD_TRIP_NOT_PENDING) o la cascada se agotó sin autorización y no se aprueba por defecto (NO_AUTHORIZATION_AVAILABLE) }

  /field-trips/{id}/advance-timeout:
    post:
      operationId: advanceFieldTripTimeout
      summary: Avanzar temporizador de cascada cuando vence el nivel actual (N1 -> N2 -> N3 -> NO_AUTORIZADA sin 4to nivel)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cascada avanzada al siguiente nivel o finalizada en NO_AUTORIZADA (en ese caso `message` explica que nadie autorizó y la persona no sale)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTripResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.AUTHORIZE_FIELD_TRIP }
        '404': { description: Salida a campo no encontrada }
        '409': { description: La salida no está en estado pendiente de cascada (FIELD_TRIP_NOT_PENDING) o el temporizador de 5 minutos del nivel actual aún no vence (FIELD_TRIP_TIMEOUT_NOT_ELAPSED) }

  /field-trips/{id}/return:
    post:
      operationId: evaluateFieldTripReturn
      summary: Registrar retorno de campo y evaluar tardanza (1-3 advertencia, 4ta colaborador observado, BR-ADP-005)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateFieldTripReturnRequest' }
      responses:
        '200':
          description: Retorno registrado y clasificado (CERRADA_NORMAL con advertencia en la 1ª a 3ª tardanza, u OBSERVADA desde la 4ª); `message` informa la clasificación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTripResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.EVALUATE_FIELD_TRIP_RETURN }
        '404': { description: Salida a campo no encontrada }
        '409': { description: La salida no está en estado AUTORIZADA (FIELD_TRIP_NOT_AUTHORIZED) }

  /employees/{id}/link-account:
    post:
      operationId: linkEmployeeAccount
      summary: Vincular la ficha del colaborador con la cuenta de usuario de su mismo correo — DEC-ADP-LINK-EMAIL-001
      description: >
        El correo de la cuenta de acceso debe coincidir (sin distinguir mayúsculas) con el correo de la ficha.
        Idempotente si ya está vinculada a esa cuenta.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ficha vinculada (accountLinked = true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_EMPLOYEES }
        '404': { description: Colaborador no encontrado (EMPLOYEE_NOT_FOUND) o no existe cuenta con ese correo (USER_ACCOUNT_NOT_FOUND) }
        '409': { description: El correo ya está vinculado a otro colaborador, la ficha a otra cuenta (EMPLOYEE_ACCOUNT_ALREADY_LINKED) o el colaborador está terminado (EMPLOYEE_TERMINATED) }
        '422': { description: La ficha no tiene correo (EMPLOYEE_EMAIL_REQUIRED) }

  /employees/{id}/terminate:
    post:
      operationId: terminateEmployment
      summary: Registrar desvinculación laboral (renuncia/despido) y emitir RelacionLaboralTerminada (BR-ADP-006, ADR-KAI-006)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TerminateEmploymentRequest' }
      responses:
        '200':
          description: Relación laboral terminada y evento RelacionLaboralTerminada.v1 emitido hacia outbox en la misma transacción (Reclutamiento crea la necesidad de personal al consumirlo; `vacancyCreatedId` es siempre null aquí porque la creación es asíncrona)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmploymentTerminationResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.TERMINATE_EMPLOYMENT }
        '404': { description: Colaborador no encontrado }
        '409': { description: El colaborador ya fue terminado previamente (EMPLOYMENT_ALREADY_TERMINATED) }
        '422': { description: Reglas de BR-ADP-006 incumplidas - renuncia sin pago de la quincena pendiente (FINAL_SETTLEMENT_REQUIRED), despido sin motivo documentado (TERMINATION_NOTES_REQUIRED) o aviso inválido (INVALID_TERMINATION_NOTICE) }

  /field-trips/{id}/reject:
    post:
      operationId: rejectFieldTrip
      summary: Rechazar salida a campo con motivo (ADP-07); queda NO_AUTORIZADA sin abrir niveles adicionales
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectFieldTripRequest' }
      responses:
        '200':
          description: Salida rechazada (NO_AUTORIZADA) con el nivel pendiente y el motivo registrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTripResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.AUTHORIZE_FIELD_TRIP }
        '404': { description: Salida a campo no encontrada }
        '409': { description: La salida no está pendiente de autorización (FIELD_TRIP_NOT_PENDING) }
        '422': { description: Falta el motivo del rechazo (FIELD_TRIP_REJECTION_REASON_REQUIRED) }

  /attendance/{id}/reclassify:
    patch:
      operationId: reclassifyAttendance
      summary: Reclasificar una falta como justificada o injustificada con su justificación (ADP-03)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReclassifyAttendanceRequest' }
      responses:
        '200':
          description: Falta reclasificada; el descuento lo recalcula el sistema y sigue pendiente hasta el cierre de mes. Incluye el memo si se generó por reiteración.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.LOG_ATTENDANCE }
        '404': { description: Registro de asistencia no encontrado (ATTENDANCE_NOT_FOUND) }
        '409': { description: No es una falta, o su descuento ya se aplicó en el cierre de mes (ATTENDANCE_NOT_RECLASSIFIABLE) }
        '422': { description: Clasificación o justificación inválida (INVALID_ATTENDANCE_RECLASSIFICATION) }

  /me/attendance:
    post:
      operationId: logMyAttendance
      summary: Marcar la propia asistencia desde la cuenta personal (22-oct, #9)
      description: >
        El colaborador (ficha vinculada a su cuenta, GET /me/employee) marca ENTRADA (`type=CHECK_IN`, estado PRESENTE o TARDANZA, foto
        OBLIGATORIA) o SALIDA (`type=CHECK_OUT`). La ubicacion (latitude, longitude, accuracy) es OBLIGATORIA y solo se captura en el
        momento de marcar (nunca seguimiento). Se compara con la geocerca de la sede (GET|PUT /branches/{branchId}/geofence): si queda fuera
        de rango la marca se guarda con `outsideGeofence=true` y `reviewStatus=PENDING` hasta que Gerencia/Administracion la aprueben o
        corrijan (PATCH /attendance/{id}/review); si la sede no tiene geocerca configurada la marca se acepta sin evaluar. Una sola marca por
        dia y tipo (409 ATTENDANCE_ALREADY_LOGGED / ATTENDANCE_MARK_ALREADY_LOGGED). `capturedAt` es la hora del dispositivo (admite marcas
        offline): no puede estar en el futuro ni tener mas de 24 h de antigüedad (422 ATTENDANCE_CAPTURE_TOO_OLD); el dia de la marca es el
        dia de Lima de `capturedAt`. Permiso HR_ADMINISTRATION.LOG_OWN_ATTENDANCE (v0 todos los roles de colaborador).
        Foto: subirla con POST /employees/{employeeId}/attendance/evidence/upload-url (el colaborador puede pedirla para si mismo) y enviar su `storageRef`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogMyAttendanceRequest' }
      responses:
        '201':
          description: Marca registrada (revisar `requiresReview` / `outsideGeofence`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.LOG_OWN_ATTENDANCE o sin asignación vigente en esa empresa/sede }
        '404': { description: El usuario no está vinculado a una ficha de colaborador (EMPLOYEE_NOT_LINKED) }
        '409': { description: 'Ya existe la marca del día (ATTENDANCE_ALREADY_LOGGED), la salida ya se marcó (ATTENDANCE_MARK_ALREADY_LOGGED), falta la entrada (ATTENDANCE_CHECK_IN_REQUIRED) o el colaborador está terminado (EMPLOYEE_TERMINATED)' }
        '422': { description: 'Ubicación ausente o inválida (ATTENDANCE_LOCATION_REQUIRED / INVALID_ATTENDANCE_RECORD), foto ausente en la entrada (ATTENDANCE_EVIDENCE_REQUIRED) o inválida (INVALID_ATTENDANCE_EVIDENCE), hora demasiado antigua (ATTENDANCE_CAPTURE_TOO_OLD) o estado no permitido en marca propia (ATTENDANCE_SELF_STATUS_NOT_ALLOWED)' }
    get:
      operationId: getMyAttendance
      summary: Mis marcas de asistencia y la geocerca de mi sede (22-oct, #9)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: month, in: query, required: false, schema: { type: string, example: '2026-10' }, description: 'Mes a listar (YYYY-MM); por defecto el mes actual en Lima.' }
      responses:
        '200':
          description: Marcas propias del mes y geocerca de la sede
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAttendanceResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.LOG_OWN_ATTENDANCE o sin asignación vigente }
        '404': { description: El usuario no está vinculado a una ficha de colaborador (EMPLOYEE_NOT_LINKED) }

  /attendance/pending-review:
    get:
      operationId: listAttendancePendingReview
      summary: Marcas de asistencia fuera de la geocerca pendientes de revisión (22-oct, #9)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Marcas con reviewStatus=PENDING de la empresa (más antiguas primero)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceRecordResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.REVIEW_ATTENDANCE }

  /attendance/{id}/review:
    patch:
      operationId: reviewAttendance
      summary: Aprobar o corregir una marca fuera de la geocerca (22-oct, #9)
      description: >
        Solo marcas con reviewStatus=PENDING (409 ATTENDANCE_NOT_PENDING_REVIEW si no). APPROVE deja la marca tal cual (APPROVED).
        CORRECT exige `note` y al menos un cambio (`status`, `minutesLate`); recalcula el descuento y deja CORRECTED. No se corrige si
        el descuento del mes ya se aplicó. Permiso HR_ADMINISTRATION.REVIEW_ATTENDANCE. Auditoria ATTENDANCE_REVIEWED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewAttendanceRequest' }
      responses:
        '200':
          description: Marca revisada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.REVIEW_ATTENDANCE }
        '404': { description: Registro no encontrado (ATTENDANCE_NOT_FOUND) }
        '409': { description: 'La marca no está pendiente de revisión (ATTENDANCE_NOT_PENDING_REVIEW) o su descuento ya se aplicó (ATTENDANCE_NOT_RECLASSIFIABLE)' }
        '422': { description: 'Corrección sin nota o sin cambios (INVALID_ATTENDANCE_REVIEW) o registro inválido (INVALID_ATTENDANCE_RECORD)' }

  /branches/{branchId}/geofence:
    get:
      operationId: getBranchGeofence
      summary: Geocerca de la sede para las marcas de asistencia (22-oct, #9)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Geocerca vigente (campos en null si no está configurada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchGeofenceResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_GEOFENCE }
        '404': { description: Sede no encontrada en la empresa (BRANCH_NOT_FOUND) }
    put:
      operationId: setBranchGeofence
      summary: Configurar coordenadas y radio de la geocerca de la sede (solo Gerencia/Administración por permiso)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetBranchGeofenceRequest' }
      responses:
        '200':
          description: Geocerca guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchGeofenceResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_GEOFENCE }
        '404': { description: Sede no encontrada en la empresa (BRANCH_NOT_FOUND) }
        '422': { description: 'Coordenadas fuera de rango o radio fuera de 10..5000 m (INVALID_GEOFENCE)' }
    delete:
      operationId: clearBranchGeofence
      summary: Quitar la geocerca de la sede (las marcas propias dejan de evaluarse contra la sede)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Geocerca eliminada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchGeofenceResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_GEOFENCE }
        '404': { description: Sede no encontrada en la empresa (BRANCH_NOT_FOUND) }

  /leaves/{id}/evidence/upload-url:
    post:
      operationId: requestLeaveEvidenceUploadUrl
      summary: Pedir URL firmada para subir el sustento de un permiso pendiente (ADP-04)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
