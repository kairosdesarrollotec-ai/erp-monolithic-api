              schema: { $ref: '#/components/schemas/HrDocumentResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.MANAGE_HR_DOCUMENTS }
        '422': { description: Error de validación o documento ya existente con versión menor }

  /hr-documents/active:
    get:
      operationId: listActiveHrDocuments
      summary: Listar documentos de Talento Humano vigentes para la empresa
      tags: [Human Resources Administration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/HrDocumentCategory' } }
      responses:
        '200':
          description: Documentos vigentes con estado de lectura del colaborador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveHrDocumentsListResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.VIEW_HR_DOCUMENTS }

  /hr-documents/{id}/confirm-read:
    post:
      operationId: confirmHrDocumentRead
      summary: Confirmar la lectura de un documento de Talento Humano vigente
      tags: [Human Resources Administration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lectura confirmada y auditada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmHrDocumentReadResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso HR_ADMINISTRATION.CONFIRM_HR_DOCUMENT_READ }
        '404': { description: Documento no encontrado o no está vigente }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmployeeStatus:
      type: string
      enum: [PERIODO_PRUEBA, PLANILLA, TERMINADO]

    TerminationReason:
      type: string
      enum: [RENUNCIA, DESPIDO]

    AttendanceStatus:
      type: string
      enum: [PRESENTE, TARDANZA, FALTA_JUSTIFICADA, FALTA_INJUSTIFICADA, PERMISO]

    LeaveType:
      type: string
      enum: [PERMISO_HORAS, SALIDA_ANTES_DE_HORA, LICENCIA_MEDICA, PERSONAL]

    LeaveStatus:
      type: string
      enum: [SOLICITADO, AUTORIZADO, DENEGADO]

    VacationStatus:
      type: string
      enum: [SOLICITADA, PROGRAMADA, REPROGRAMADA, CANCELADA, COMPLETADA]

    FieldTripStatus:
      type: string
      enum: [PENDIENTE_NIVEL_1, PENDIENTE_NIVEL_2, PENDIENTE_NIVEL_3, AUTORIZADA, NO_AUTORIZADA, CERRADA_NORMAL, OBSERVADA]

    HrArea:
      type: object
      required: [code, name, description, sortOrder, isActive]
      properties:
        isActive: { type: boolean, description: 'true en el listado normal; false solo con includeInactive=true (Gerencia).' }
        code: { type: string, example: 'ATENCION_AL_CLIENTE', description: 'Código estable; es el valor de Employee.areaId cuando el área viene del catálogo.' }
        name: { type: string, example: 'Atención al cliente' }
        description: { type: string, nullable: true }
        sortOrder: { type: integer }

    CreateHrAreaRequest:
      type: object
      required: [companyId, branchId, name]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        name: { type: string, maxLength: 100, example: 'Logística' }
        description: { type: string, maxLength: 255 }

    HrAreaContextRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }

    HrAreaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HrArea' }

    CreateEmployeeRequest:
      type: object
      required: [companyId, branchId, fullName, documentNumber, jobTitle, hireDate]
      description: 'Área obligatoria aunque ninguno de sus campos lo sea por separado (para no romper clientes): envía `areaCode` (catálogo) o, por compatibilidad, `areaName` (texto libre; `areaId` opcional). 400 AREA_REQUIRED (o 400 de validación) si falta ambos.'
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid, nullable: true }
        documentType: { type: string, default: 'DNI', example: 'DNI' }
        documentNumber: { type: string, example: '45678912' }
        fullName: { type: string, example: 'Carlos Alberto Perez' }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        areaCode: { type: string, example: 'OPERACIONES', description: 'Código del catálogo (GET /hr-areas). Manda sobre areaId/areaName; 422 HR_AREA_NOT_FOUND si no existe.' }
        areaId: { type: string, example: 'OPERACIONES', description: 'Compatibilidad (texto libre): opcional; se normaliza. Se ignora si viene areaCode.' }
        areaName: { type: string, example: 'Operaciones', description: 'Compatibilidad (texto libre). Si coincide con un área del catálogo se guarda como esa área.' }
        jobTitle: { type: string, example: 'Conductor / Auxiliar de Campo' }
        hireDate: { type: string, format: date }
        baseSalary: { type: number, nullable: true }
        bankName: { type: string, nullable: true }
        bankAccountNumber: { type: string, nullable: true }
        bankAccountCci: { type: string, nullable: true }
        contractType: { type: string, nullable: true }
        contractUrl: { type: string, nullable: true }
        contractNotes: { type: string, nullable: true }

    UpdateEmployeeRequest:
      type: object
      properties:
        branchId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email, nullable: true, description: 'Vaciarlo ("" o null) DESVINCULA la ficha de su cuenta sin error (accountRelink UNLINKED).' }
        phone: { type: string, nullable: true }
        areaCode: { type: string, description: 'Código del catálogo de áreas (GET /hr-areas); manda sobre areaId/areaName; 422 HR_AREA_NOT_FOUND si no existe. «RRHH» se mapea a TALENTO_HUMANO.' }
        areaId: { type: string }
        areaName: { type: string }
        jobTitle: { type: string }
        baseSalary: { type: number, nullable: true, description: 'Solo Gerencia (HR_ADMINISTRATION.MANAGE_SALARY) puede cambiarlo; otro rol con un valor distinto al vigente -> 403 EMPLOYEE_SALARY_GERENCIA_ONLY. Reenviar el mismo valor es válido.' }
        bankName: { type: string, nullable: true }
        bankAccountNumber: { type: string, nullable: true }
        bankAccountCci: { type: string, nullable: true }
        contractType: { type: string, nullable: true }
        contractUrl: { type: string, nullable: true }
        contractNotes: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        probationPassed: { type: boolean, nullable: true }
        payrollStartedAt: { type: string, format: date-time, nullable: true }

    EmployeeResponse:
      type: object
      required: [accountLinked, restrictedFields, id, companyId, branchId, fullName, documentType, documentNumber, areaId, areaCode, areaName, jobTitle, status, hireDate, fieldTripLateCount, isFieldTripObserved, createdAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid, nullable: true }
        documentType: { type: string }
        documentNumber: { type: string, nullable: true, description: 'null si el rol no tiene HR_ADMINISTRATION.VIEW_EMPLOYEE_DOCUMENT o VIEW_EMPLOYEE_SENSITIVE_DATA (ver restrictedFields).' }
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        areaId: { type: string }
        areaCode: { type: string, description: 'Código del área (igual a areaId; úsalo con GET /hr-areas).' }
        areaName: { type: string }
        jobTitle: { type: string }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        hireDate: { type: string, format: date }
        probationEvaluatedAt: { type: string, format: date-time, nullable: true }
        probationPassed: { type: boolean, nullable: true }
        payrollStartedAt: { type: string, format: date-time, nullable: true }
        terminatedAt: { type: string, format: date-time, nullable: true }
        terminationReason: { $ref: '#/components/schemas/TerminationReason', nullable: true }
        terminationNoticeDays: { type: integer, nullable: true }
        fieldTripLateCount: { type: integer }
        isFieldTripObserved: { type: boolean }
        baseSalary: { type: number, nullable: true, description: 'null = pendiente O restringido: solo lo ve quien tiene HR_ADMINISTRATION.MANAGE_SALARY o VIEW_EMPLOYEE_SENSITIVE_DATA (ver restrictedFields).' }
        bankName: { type: string, nullable: true }
        bankAccountNumber: { type: string, nullable: true }
        bankAccountCci: { type: string, nullable: true }
        contractType: { type: string, nullable: true }
        contractUrl: { type: string, nullable: true }
        contractNotes: { type: string, nullable: true }
        restrictedFields:
          type: array
          items: { type: string, enum: [documentNumber, baseSalary, bankName, bankAccountNumber, bankAccountCci, contractType, contractUrl, contractNotes] }
          description: Campos enmascarados para el rol del solicitante (HU-35). Vacío si ve todo.
        accountLinked: { type: boolean, description: La ficha está vinculada a una cuenta de usuario por correo (DEC-ADP-LINK-EMAIL-001) }
        version: { type: integer, minimum: 1, description: Versión optimista de la ficha (DEC-ADP-EDIT-ETAG-001); mismo valor que el header ETag }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AccountRelinkNotice:
      type: object
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [RELINKED, UNLINKED]
          description: RELINKED = la ficha pasó a la cuenta del correo nuevo; UNLINKED = no existe cuenta con el correo nuevo y la ficha quedó sin vincular
        reason: { type: string, enum: [EMAIL_CHANGED] }
        previousEmail: { type: string, nullable: true }
        newEmail: { type: string, nullable: true }

    UpdateEmployeeResponse:
      allOf:
        - { $ref: '#/components/schemas/EmployeeResponse' }
        - type: object
          properties:
            accountRelink:
              description: Solo presente si la edición cambió el vínculo con la cuenta de acceso (DEC-ADP-RELINK-001)
              allOf:
                - { $ref: '#/components/schemas/AccountRelinkNotice' }

    EmployeeDetailResponse:
      allOf:
        - { $ref: '#/components/schemas/EmployeeResponse' }
        - type: object
          properties:
            attendanceSummary:
              type: object
              properties:
                totalPresent: { type: integer }
                totalLate: { type: integer }
                totalJustifiedAbsences: { type: integer }
                totalUnjustifiedAbsences: { type: integer }
                pendingDeductionAmount: { type: number }
            recentLeaves:
              type: array
              items: { $ref: '#/components/schemas/LeaveRequestResponse' }
            recentVacations:
              type: array
              items: { $ref: '#/components/schemas/VacationRequestResponse' }
            recentFieldTrips:
              type: array
              items: { $ref: '#/components/schemas/FieldTripResponse' }
            termination:
              nullable: true
              allOf:
                - { $ref: '#/components/schemas/EmploymentTerminationResponse' }
            recentMemos:
              type: array
              items: { $ref: '#/components/schemas/HrMemoResponse' }
            recentTrainings:
              type: array
              items: { $ref: '#/components/schemas/TrainingResponse' }

    LogAttendanceRequest:
      type: object
      required: [date, status]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: 'Registro «a nombre de» otro colaborador (22-oct, #9): motivo OBLIGATORIO en PRESENTE/TARDANZA (422 ATTENDANCE_REASON_REQUIRED); queda en el registro (source ON_BEHALF) y en la auditoría.'
        date: { type: string, format: date }
        checkInTime: { type: string, format: date-time, nullable: true }
        checkOutTime: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        minutesLate: { type: integer, minimum: 0, description: Opcional; una tardanza lo exige mayor a 0 (el sistema no asume 0) }
        deductionAmount: { type: number, minimum: 0, description: Opcional; si no se envía lo calcula el sistema }
        notes: { type: string, nullable: true }
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true, description: 'HU-29 ubicación automática (opcional). Debe ir con longitude; 422 INVALID_ATTENDANCE_RECORD si falta una o está fuera de rango.' }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        accuracy: { type: number, minimum: 0, maximum: 100000, nullable: true, description: Precisión horizontal en metros (opcional) }
        evidence:
          nullable: true
          description: >
            DEC-ADP-ATT-EVIDENCE-001/002. Foto con reloj + hora + rostro que corrobora la marcación. OBLIGATORIA en
            PRESENTE/TARDANZA (422 ATTENDANCE_EVIDENCE_REQUIRED); opcional en faltas y permisos. Se sube con
            POST /employees/{id}/attendance/evidence/upload-url y su `storageRef` va aquí.
          allOf:
            - { $ref: '#/components/schemas/AttendanceEvidenceRequest' }

    AttendanceEvidenceRequest:
      type: object
      required: [kind, capturedAtLocal]
      description: Requiere al menos uno de storageRef o url. Si viene storageRef debe empezar por companies/{companyId}/employees/{employeeId}/attendance/ (el que devuelve la URL de subida).
      properties:
        kind: { type: string, enum: [WHATSAPP_PHOTO, SELF_PHOTO] }
        storageRef: { type: string, nullable: true, maxLength: 2000, description: Referencia interna al objeto almacenado }
        url: { type: string, nullable: true, maxLength: 2000 }
        capturedAtLocal:
          type: string
          description: Fecha y hora de la foto. Sin offset (YYYY-MM-DDTHH:mm[:ss]) se interpreta en America/Lima; no puede estar en el futuro.
          examples: ['2026-10-14T08:05:00']
        note: { type: string, nullable: true, maxLength: 1000 }

    RequestAttendanceEvidenceUploadRequest:
      type: object
      required: [contentType, contentLength]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        contentLength: { type: integer, minimum: 1, maximum: 12582912 }

    AttendanceEvidenceUploadSessionResponse:
      type: object
      required: [uploadUrl, objectUrl, storageRef, expiresAt]
      properties:
        uploadUrl: { type: string, description: URL firmada PUT (15 min) }
        objectUrl: { type: string }
        storageRef: { type: string, description: Valor para evidence.storageRef de logAttendance }
        expiresAt: { type: string, format: date-time }

    AttendanceEvidenceResponse:
      type: object
      required: [kind, capturedAtLocal]
      properties:
        kind: { type: string, enum: [WHATSAPP_PHOTO, SELF_PHOTO] }
        storageRef: { type: string, nullable: true }
        url: { type: string, nullable: true }
        capturedAtLocal: { type: string, description: Hora de la foto en America/Lima sin offset (YYYY-MM-DDTHH:mm:ss) }
        note: { type: string, nullable: true }
        corroboratedBy: { type: string, nullable: true, description: Usuario (Firebase UID) que corroboró la foto y registró la marcación }
        corroboratedAt: { type: string, format: date-time, nullable: true }

    AttendanceRecordResponse:
      type: object
      required: [id, employeeId, date, status, minutesLate, deductionAmount, isDeductionApplied, createdAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        latitude: { type: number, nullable: true, description: 'HU-29: ubicación automática capturada (null si no se envió).' }
        longitude: { type: number, nullable: true }
        accuracy: { type: number, nullable: true }
        date: { type: string, format: date }
        checkInTime: { type: string, format: date-time, nullable: true }
        checkOutTime: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        minutesLate: { type: integer }
        deductionAmount: { type: number }
        isDeductionApplied: { type: boolean }
        payrollMonth: { type: string, nullable: true }
        deductionAppliedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        justification: { type: string, nullable: true }
        reclassifiedAt: { type: string, format: date-time, nullable: true }
        source: { type: string, enum: [SELF, ON_BEHALF], description: 'SELF = el colaborador marcó desde su cuenta; ON_BEHALF = Personal registró a nombre de otro (ver onBehalfReason). Registros históricos: ON_BEHALF.' }
        onBehalfReason: { type: string, nullable: true }
        capturedAt: { type: string, format: date-time, nullable: true, description: Hora del dispositivo al marcar la entrada (solo marcas propias) }
        outsideGeofence: { type: boolean, description: La entrada quedó fuera del radio de la geocerca de la sede }
        distanceMeters: { type: number, nullable: true, description: Distancia a la sede al marcar la entrada (null si la sede no tenía geocerca) }
        geofenceRadiusMeters: { type: integer, nullable: true }
        reviewStatus: { type: string, enum: [PENDING, APPROVED, CORRECTED], nullable: true, description: 'PENDING = fuera de geocerca, espera revisión; null = no requiere revisión.' }
        requiresReview: { type: boolean, description: true si reviewStatus es PENDING }
        reviewedById: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewNote: { type: string, nullable: true }
        checkOut:
          nullable: true
          description: Datos de la salida marcada desde la cuenta personal (null si no hay salida propia)
          allOf:
            - { $ref: '#/components/schemas/AttendanceCheckOutResponse' }
        evidence:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/AttendanceEvidenceResponse' }
        evidenceMissing: { type: boolean, description: true si el registro no tiene evidencia fotográfica (incluye registros previos a 0.3.0) }
        memo:
          nullable: true
          description: Memo generado automáticamente por reiteración de faltas injustificadas del mes
          allOf:
            - { $ref: '#/components/schemas/HrMemoResponse' }
        createdAt: { type: string, format: date-time }

    AttendanceCheckOutResponse:
      type: object
      required: [outsideGeofence]
      properties:
        capturedAt: { type: string, format: date-time, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        accuracy: { type: number, nullable: true }
        outsideGeofence: { type: boolean }
        distanceMeters: { type: number, nullable: true }

    LogMyAttendanceRequest:
      type: object
      required: [companyId, branchId, capturedAt, latitude, longitude, accuracy]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, description: Sede del contexto de trabajo; su geocerca es la que se evalúa }
        type: { type: string, enum: [CHECK_IN, CHECK_OUT], default: CHECK_IN }
        status: { type: string, enum: [PRESENTE, TARDANZA], description: Solo en CHECK_IN. Faltas y permisos los registra Personal. }
        minutesLate: { type: integer, minimum: 1, description: Obligatorio si status=TARDANZA }
        capturedAt: { type: string, format: date-time, description: 'Hora del dispositivo (ISO 8601 con offset/Z). Máx. 24 h de antigüedad (marcas offline) y no futura.' }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0, maximum: 100000, description: Precisión horizontal en metros }
        notes: { type: string, nullable: true, maxLength: 1000 }
        evidence:
          nullable: true
          description: Foto de la marca. OBLIGATORIA en CHECK_IN (422 ATTENDANCE_EVIDENCE_REQUIRED); se ignora en CHECK_OUT (solo la entrada guarda foto).
          allOf:
            - { $ref: '#/components/schemas/MyAttendanceEvidenceRequest' }

    MyAttendanceEvidenceRequest:
      type: object
      description: Requiere al menos uno de storageRef o url. storageRef debe ser el que devolvió la URL de subida de ESTE colaborador.
      properties:
        kind: { type: string, enum: [SELF_PHOTO, WHATSAPP_PHOTO], default: SELF_PHOTO }
        storageRef: { type: string, nullable: true, maxLength: 2000 }
        url: { type: string, nullable: true, maxLength: 2000 }
        note: { type: string, nullable: true, maxLength: 1000 }

    GeofenceInfo:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        radiusMeters: { type: integer, nullable: true }

    MyAttendanceResponse:
      type: object
      required: [employeeId, geofence, items]
      properties:
        employeeId: { type: string, format: uuid }
        geofence: { $ref: '#/components/schemas/GeofenceInfo' }
        items:
          type: array
          items: { $ref: '#/components/schemas/AttendanceRecordResponse' }

    ReviewAttendanceRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, CORRECT] }
        note: { type: string, maxLength: 1000, description: Obligatoria en CORRECT; opcional al aprobar }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        minutesLate: { type: integer, minimum: 1, description: Para TARDANZA corregida }

    SetBranchGeofenceRequest:
      type: object
      required: [companyId, latitude, longitude, radiusMeters]
      properties:
        companyId: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusMeters: { type: integer, minimum: 10, maximum: 5000 }

    BranchGeofenceResponse:
      type: object
      required: [branchId, branchName, configured]
      properties:
        branchId: { type: string, format: uuid }
        branchName: { type: string }
        configured: { type: boolean }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        radiusMeters: { type: integer, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, nullable: true }

    RescheduleVacationRequest:
      type: object
      required: [startDate, endDate, reason]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 500 }

    CancelVacationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    MonthlyAttendanceSummaryResponse:
      type: object
      required: [companyId, month, totalEmployees, totalDeductionsAmount, items]
      properties:
        companyId: { type: string, format: uuid }
        month: { type: string, example: '2026-10' }
        totalEmployees: { type: integer }
        totalDeductionsAmount: { type: number }
        items:
          type: array
          items:
            type: object
            required: [employeeId, employeeName, areaName, totalLates, totalUnjustified, calculatedDeduction, isApplied]
            properties:
              employeeId: { type: string, format: uuid }
              employeeName: { type: string }
              areaName: { type: string }
              totalLates: { type: integer }
              totalUnjustified: { type: integer }
              calculatedDeduction: { type: number }
              isApplied: { type: boolean }

    ApplyDeductionsRequest:
      type: object
      required: [companyId, branchId, month]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, description: Sede del contexto de trabajo }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-10', description: Mes a liquidar; solo se acepta desde el último día del mes (BR-ADP-001) }
        employeeIds:
          type: array
          items: { type: string, format: uuid }
          description: Opcional; si no se especifica se aplica a todos los colaboradores con deducciones pendientes

    ApplyDeductionsResponse:
      type: object
      required: [month, affectedEmployeesCount, totalDeductionsApplied]
      properties:
        month: { type: string }
        affectedEmployeesCount: { type: integer }
        totalDeductionsApplied: { type: number }

    RequestLeaveRequest:
      type: object
      required: [type, date, reason]
      properties:
        type: { $ref: '#/components/schemas/LeaveType' }
        date: { type: string, format: date }
        startTime: { type: string, format: date-time, nullable: true }
        endTime: { type: string, format: date-time, nullable: true }
        reason: { type: string }

    ResolveLeaveRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [AUTORIZADO, DENEGADO] }
        resolutionNotes: { type: string, nullable: true }

    LeaveRequestResponse:
      type: object
      required: [id, employeeId, type, date, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        type: { $ref: '#/components/schemas/LeaveType' }
        date: { type: string, format: date }
        startTime: { type: string, format: date-time, nullable: true }
        endTime: { type: string, format: date-time, nullable: true }
        reason: { type: string }
        status: { $ref: '#/components/schemas/LeaveStatus' }
        authorizedById: { type: string, nullable: true }
        authorizedByName: { type: string, nullable: true }
        resolutionNotes: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ScheduleVacationRequest:
      type: object
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        notes: { type: string, nullable: true }

    ResolveVacationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PROGRAMADA, REPROGRAMADA, CANCELADA]
        grantedDays:
          type: integer
          minimum: 1
          description: Días otorgados por Gerencia (permite conceder menos días de los solicitados)
        statusReason:
          type: string
          maxLength: 1000
          description: Motivo obligatorio si se rechaza o reprograma

    VacationRequestResponse:
      type: object
      required: [id, employeeId, areaId, startDate, endDate, status, requestedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        areaId: { type: string }
        areaName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/VacationStatus' }
        requestedAt: { type: string, format: date-time }
        approvedById: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        grantedDays: { type: integer, nullable: true, description: Días otorgados por Gerencia }
        originalStartDate: { type: string, format: date, nullable: true, description: Fechas antes de la primera reprogramación (null si nunca se reprogramó) }
        originalEndDate: { type: string, format: date, nullable: true }
        rescheduleCount: { type: integer }
        statusReason: { type: string, nullable: true, description: Motivo de la última reprogramación o cancelación }
        statusChangedAt: { type: string, format: date-time, nullable: true }
        statusChangedById: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    RequestFieldTripRequest:
      type: object
      required: [destination, objective, estimatedDeparture, estimatedReturn]
      properties:
        destination: { type: string, example: 'Taller Central Huachipa' }
        objective: { type: string, example: 'Inspección técnica de unidad en mantenimiento' }
        estimatedDeparture: { type: string, format: date-time }
        estimatedReturn: { type: string, format: date-time }

    AuthorizeFieldTripRequest:
      type: object
      required: [authorizationLevel]
      properties:
        authorizationLevel:
          type: integer
          minimum: 1
          maximum: 3
          description: Nivel de autorización alcanzado (Nivel 1 de 3, 2 de 3 o 3 de 3 - NUNCA 4)
        notes: { type: string, nullable: true }

    EvaluateFieldTripReturnRequest:
      type: object
      required: [actualReturn]
      properties:
        actualReturn: { type: string, format: date-time }
        returnNotes: { type: string, nullable: true }

    FieldTripResponse:
      type: object
      required: [id, employeeId, destination, objective, estimatedDeparture, estimatedReturn, status, lateMinutes, createdAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        destination: { type: string }
        objective: { type: string }
        estimatedDeparture: { type: string, format: date-time }
        estimatedReturn: { type: string, format: date-time }
        actualDeparture: { type: string, format: date-time, nullable: true }
        actualReturn: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/FieldTripStatus' }
        authorizationLevel: { type: integer, nullable: true, minimum: 1, maximum: 3 }
        authorizedById: { type: string, nullable: true }
        authorizedByName: { type: string, nullable: true }
        authorizedAt: { type: string, format: date-time, nullable: true }
        level1TimeoutAt: { type: string, format: date-time, nullable: true }
        level2TimeoutAt: { type: string, format: date-time, nullable: true }
        level3TimeoutAt: { type: string, format: date-time, nullable: true }
        lateMinutes: { type: integer }
        returnNotes: { type: string, nullable: true }
        employee: { $ref: '#/components/schemas/FieldTripEmployeeSummary' }
        rejectedById: { type: string, nullable: true }
        rejectedByName: { type: string, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }
        rejectedAtLevel: { type: integer, nullable: true, minimum: 1, maximum: 3, description: Nivel que estaba pendiente al rechazar }
        rejectionReason: { type: string, nullable: true }
        memo:
          nullable: true
          description: Memo generado automáticamente al registrar el retorno (4ª tardanza en adelante)
          allOf:
            - { $ref: '#/components/schemas/HrMemoResponse' }
        message: { type: string, nullable: true, description: Mensaje informativo (ej. al terminar en NO_AUTORIZADA) }
        createdAt: { type: string, format: date-time }

    TerminateEmploymentRequest:
      type: object
      required: [reason, finalSettlementPaid]
      properties:
        reason: { $ref: '#/components/schemas/TerminationReason' }
        noticeDays: { type: integer, minimum: 0, maximum: 90, default: 0, description: Días de aviso. Renuncia sin previo aviso = 0. Despido por reincidencia = 15 (solo se acepta 0 o 15) }
        finalSettlementPaid: { type: boolean, description: Si se pagó la quincena pendiente. Obligatorio en true para RENUNCIA (BR-ADP-006, EX-ADP-003) }
        settlementAmount: { type: number, default: 0 }
        notes: { type: string, nullable: true, description: Obligatoria para DESPIDO (se documenta el motivo, mínimo 5 caracteres) }

    EmploymentTerminationResponse:
      type: object
      required: [id, employeeId, reason, noticeDays, finalSettlementPaid, settlementAmount, terminatedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        reason: { $ref: '#/components/schemas/TerminationReason' }
        noticeDays: { type: integer }
        finalSettlementPaid: { type: boolean }
        settlementAmount: { type: number }
        notes: { type: string, nullable: true }
        terminatedById: { type: string }
        terminatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        vacancyCreatedId: { type: string, format: uuid, nullable: true, description: 'Vacante creada automáticamente en Reclutamiento (22-oct, #5). El consumo del evento es asíncrono: null en la respuesta inmediata de /terminate; el expediente GET /employees/{id} la informa cuando ya se creó.' }

    RejectFieldTripRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 1000, description: Motivo del rechazo (obligatorio) }

    ReclassifyAttendanceRequest:
      type: object
      required: [status, justification]
      properties:
        status: { type: string, enum: [FALTA_JUSTIFICADA, FALTA_INJUSTIFICADA] }
        justification: { type: string, minLength: 5, maxLength: 1000 }

    HrMemoResponse:
      type: object
      required: [id, employeeId, kind, violationNumber, reason, issuedOn, generatedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        kind: { type: string, description: 'Causa del memo: tardanza reiterada al regresar de campo o falta injustificada reiterada' }
        violationNumber: { type: integer, description: Número de la infracción que lo originó (4ª tardanza, 2ª falta del mes, etc.) }
        reason: { type: string }
        issuedOn: { type: string, format: date }
        generatedBy: { type: string, description: SISTEMA cuando se genera automáticamente }
        createdAt: { type: string, format: date-time }

    TrainingResponse:
      type: object
      required: [id, topic, heldOn, durationMinutes, attendees, createdAt]
      properties:
        id: { type: string, format: uuid }
        topic: { type: string }
        heldOn: { type: string, format: date }
        durationMinutes: { type: integer }
        comprehensionNotes: { type: string, nullable: true, description: Nota cualitativa; NO es una evaluación formal de desempeño (BR-ADP-007) }
        attendees:
          type: array
          items:
            type: object
            required: [employeeId, fullName]
            properties:
              employeeId: { type: string, format: uuid }
              fullName: { type: string }
        createdAt: { type: string, format: date-time }

    RegisterTrainingRequest:
      type: object
      required: [companyId, branchId, topic, heldOn, attendeeIds]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        topic: { type: string, maxLength: 200 }
        heldOn: { type: string, format: date }
        durationMinutes: { type: integer, minimum: 1, maximum: 480, description: Referencia ~60 min; no bloqueante }
        attendeeIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        comprehensionNotes: { type: string, nullable: true, maxLength: 2000 }

    RequestLeaveEvidenceUploadRequest:
      type: object
      required: [contentType, contentLength]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        contentLength: { type: integer, minimum: 1, maximum: 10485760 }

    LeaveEvidenceUploadSessionResponse:
      type: object
      required: [uploadUrl, objectUrl, expiresAt]
      properties:
        uploadUrl: { type: string }
        objectUrl: { type: string }
        expiresAt: { type: string, format: date-time }

    RecordLeaveEvidenceRequest:
      type: object
      required: [objectUrl, contentType]
      properties:
        objectUrl: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }

    LeaveEvidenceResponse:
      type: object
      required: [id, leaveId, objectUrl, contentType, uploadedById, createdAt]
      properties:
        id: { type: string, format: uuid }
        leaveId: { type: string, format: uuid }
        objectUrl: { type: string }
        contentType: { type: string }
        uploadedById: { type: string }
        createdAt: { type: string, format: date-time }

    MyEmployeeResponse:
      type: object
      required: [id, companyId, branchId, fullName, areaId, areaName, jobTitle, status, fieldTripLateCount, isFieldTripObserved]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        fullName: { type: string }
        areaId: { type: string }
        areaName: { type: string }
        jobTitle: { type: string }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        fieldTripLateCount: { type: integer }
        isFieldTripObserved: { type: boolean }

    FieldTripEmployeeSummary:
      type: object
      required: [id, fullName, areaName, jobTitle, fieldTripLateCount, isFieldTripObserved]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        areaName: { type: string }
        jobTitle: { type: string }
        fieldTripLateCount: { type: integer }
        isFieldTripObserved: { type: boolean }

    ProblemDetail:
      type: object
      description: Cuerpo de error de dominio (DomainExceptionFilter). `code` es estable y apto para que el front decida el mensaje.
      required: [statusCode, code, detail]
      properties:
        statusCode: { type: integer }
        code: { type: string, example: VACATION_OVERLAP }
        detail: { type: string }

    HrDocumentCategory:
      type: string
      enum: [REGULATION, POLICY, FORMAT]

    PublishHrDocumentRequest:
      type: object
      required: [companyId, branchId, code, title, category, fileUrl]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        code: { type: string, example: 'RIT-001' }
        title: { type: string, example: 'Reglamento Interno de Trabajo 2026' }
        category: { $ref: '#/components/schemas/HrDocumentCategory' }
        fileUrl: { type: string, example: 'https://storage.kairos.pe/hr-docs/rit-001-v2.pdf' }
        fileHash: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        mimeType: { type: string }
        sizeBytes: { type: integer, nullable: true }

    HrDocumentResponse:
      type: object
      required: [id, companyId, code, title, category, version, fileUrl, isActive, publishedBy, publishedAt, createdAt, hasRead]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        category: { $ref: '#/components/schemas/HrDocumentCategory' }
        version: { type: integer }
        fileUrl: { type: string }
        fileHash: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        mimeType: { type: string }
        sizeBytes: { type: integer, nullable: true }
        isActive: { type: boolean }
        publishedBy: { type: string }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        hasRead: { type: boolean, description: 'Indica si el colaborador actual ya confirmó la lectura de esta versión vigente.' }
        readAt: { type: string, format: date-time, nullable: true }

    ActiveHrDocumentsListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HrDocumentResponse' }
        total: { type: integer }

    ConfirmHrDocumentReadResponse:
      type: object
      required: [documentId, employeeId, readAt]
      properties:
        documentId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        readAt: { type: string, format: date-time }
