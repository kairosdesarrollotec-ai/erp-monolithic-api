openapi: 3.1.0
info:
  title: KAIROS ERP - Rentals API
  version: 1.12.0
  description: >
    1.12.0 — Respuestas de negocio de Russbel (2026-10-20). Aditivo salvo lo marcado. (a) DEC-ALQ-DRIVERRATE-002: la tarifa diaria del
    conductor de la empresa (digitada a mano por alquiler) es OBLIGATORIA: POST complete-delivery responde 422 COMPANY_DRIVER_RATE_REQUIRED
    si el contrato es «con conductor de la empresa» y no hay tarifa manual. set-company-driver-daily-rate solo se acepta mientras el
    alquiler está en PENDING_DELIVERY (hasta terminar el proceso de alquiler = completar entrega); desde ACTIVE/EXTENSION_PENDING/
    RETURN_IN_PROGRESS/CLOSED/CANCELLED responde 409 COMPANY_DRIVER_RATE_CLOSED (COMPORTAMIENTO CAMBIADO: antes se permitía hasta el cierre).
    (b) DEC-ALQ-VEHDATA-001: `RentalResponse.vehicleFuelPrice` (number|null) y `vehicleWarnings[]` (un `VehicleDataWarning` por cada dato
    faltante del vehículo: capacidad, garantía, combustible; no bloquea). (c) ENTREGA-02: nueva zona de evidencia `ALCOHOL_TEST` (foto de la
    prueba, sin hora; se sube con upload-url/evidence mientras el alquiler está en VALIDATION y NO cuenta para las 35 fotos); register-alcohol-test
    con DESFAVORABLE o RECHAZADO exige esa foto: 422 ALCOHOL_TEST_PHOTO_REQUIRED.

    1.11.0 — DEC-ALQ-CAPWARN-001/002 (G-05; aviso de capacidad en el flujo de acompañantes). Aditivo. `RentalResponse` expone
    `vehiclePassengerCapacity` (entero o null; null = el vehículo aún no tiene capacidad registrada en Flota, DEC-FLT-CAP-002: sin tope,
    el alquiler NO se bloquea) y `companionsCount` (acompañantes registrados = parties con rol RESPONSIBLE; el firmante es SIGNER y no cuenta).
    Sin cambios en requests ni en operaciones.

    1.10.0 — DEC-ALQ-DRIVERRATE-001..004 (F-02; respuesta de Russbel 19-oct-2026: «este precio todavía no lo tenemos, pero pongamos que se
    pueda rellenar manualmente cuando se requiera»). Aditivo. (a) Nuevo POST /rentals/{id}/commands/set-company-driver-daily-rate
    (If-Match + Idempotency-Key; permiso RENTAL.FORMALIZE_CONTRACT): digita la tarifa diaria del conductor de la empresa (PEN, monto > 0,
    máx. 2 decimales) en el alquiler; solo con contrato «con conductor de la empresa» y alquiler no cerrado/cancelado. Devuelve el alquiler
    con `companyDriverCharge`. (b) `CompanyDriverChargeResponse.source` (`MANUAL` | `ENV` | `NOT_DEFINED`): prioridad valor manual del
    alquiler > env COMPANY_DRIVER_DAILY_RATE > tarifa no definida (`configured=false`, importes «0.00», cobro pendiente de digitar; nunca se
    inventa un monto). Errores con la forma { statusCode, code, detail } (`RentalErrorResponse`): 400 COMPANY_DRIVER_RATE_INVALID,
    409 COMPANY_DRIVER_RATE_CLOSED, 422 COMPANY_DRIVER_RATE_NOT_APPLICABLE.

    1.9.0 — respuestas de negocio de Fiorella (16-oct-2026) sobre el acompañante.
    (a) register-companion EXIGE registrar también al conductor real (`driverCustomerId`, party DRIVER; el
    firmante/acompañante queda RESPONSIBLE) y los checks `companionLicenseVerified`/`driverLicenseVerified`
    (la licencia NO se guarda: ni número ni vencimiento; 422 LICENSE_VERIFICATION_REQUIRED si no están en true).
    Nuevos 422: COMPANION_DRIVER_MUST_DIFFER, DRIVER_CUSTOMER_NOT_FOUND, COMPANION_PASSENGER_CAPACITY_EXCEEDED
    (el límite = capacidad de pasajeros del vehículo; Flota aún no tiene el campo, TODO sin validar).
    (b) `addendumDocumentRef` del acompañante sigue opcional: su autorización es la del firmante.
    (c) El tipo de titular se deduce del tipo de documento del titular (RUC → LEGAL, DNI → NATURAL);
    `holderType` queda como respaldo. (d) GET /rentals/{id} agrega `companyDriverCharge` (tarifa diaria ×
    días del alquiler con conductor de la empresa; vista no persistida; `configured=false` mientras no
    exista la tarifa). BREAKING en el request de register-companion (endpoint de 1.8.0 aún sin consumidores en producción).

    1.8.0 — DEC-ALQ-COMPANION-006: nuevo POST /rentals/{id}/commands/register-companion (acompañante
    autorizado de PERSONA NATURAL; firma como responsable, party role RESPONSIBLE; motivo obligatorio en
    auditoría/evento; no habilita a conducir). Aditivo, sin cambios en operaciones existentes.

    1.6.0 — sesión 2026-10-15 (2): conductor y garantía.
    (a) DEC-ALQ-COMPANY-DRIVER-004: con `withCompanyDriver=true` NO hay garantía (Ficha AS-IS 5-ago:
    se omite el proceso de garantía; la responsabilidad recae en el conductor). formalize-contract
    deja `depositAmount`/`depositCurrency` opcionales (enviarlos > 0 con conductor de la empresa:
    422 DEPOSIT_NOT_APPLICABLE_WITH_COMPANY_DRIVER); no se crea fila de garantía: RentalResponse
    trae `deposit: null`, `depositRequired: false` y `contract.depositRequired: false`. Si venía de
    una reserva con crédito pagado, todo el crédito queda como saldo a favor en
    `reservationCreditExcess` (rental y contract; sin reembolso automático; pendiente Finanzas).
    (b) DEC-ALQ-OWN-DRIVER-005: nuevo POST /rentals/{id}/commands/register-authorized-driver
    (conductor propio autorizado de PERSONA JURÍDICA con su adenda; persona NATURAL: 422
    NATURAL_PERSON_OWN_DRIVER_NOT_ALLOWED). RentalPartyResponse.addendumDocumentRef.
    (c) El conductor no autorizado se registra como incidencia UNAUTHORIZED_DRIVER (incidents.yaml 0.2.0).

    1.5.0 — DEC-ALQ-DRIVER-001 / DEC-ALQ-RESCREDIT-002 (sesión 2026-10-15).
    (a) `withDriver` se renombra a `withCompanyDriver` (servicio de conductor que la EMPRESA
    ofrece al cliente, BR-DOC-003); `withDriver` se conserva como alias DEPRECADO (si llegan
    ambos con valores distintos: 400 CONTRACT_VARIANT_DRIVER_CONFLICT). NO es el "conductor
    distinto del titular" de BR-ALQ-015 (otra persona que maneja un alquiler ya hecho sin
    aprobación previa), que no elige plantilla. La respuesta de contract-template trae
    `variant.withCompanyDriver` y el alias `variant.withDriver`. (b) formalize-contract YA NO
    responde 422 RESERVATION_CREDIT_EXCEEDS_DEPOSIT: si el monto de la reserva supera la
    garantía, `deposit.reservationCreditAmount` = garantía (cubierta), `amountCollected` = 0.00
    y el sobrante queda en el campo nuevo `deposit.reservationCreditExcess` (saldo a favor
    visible; sin reembolso ni cálculo automático; pendiente de Finanzas).

    1.4.0 — DEC-TZ-LIMA-001 — Zona horaria de negocio America/Lima (UTC-5,
    sin DST): toda fecha date-only (YYYY-MM-DD) enviada a esta API como
    inicio/fin/ventana de viaje, disponibilidad, reserva, alquiler, devolución
    o reporte se interpreta como 00:00 America/Lima (= 05:00Z); los date-time
    con offset/Z se respetan tal cual. Los textos de notificaciones/documentos
    muestran fecha y hora de Lima. Los campos `format: date` de calendario
    puro (p. ej. travelStartDate) no cambian.

    Contrato del módulo Alquiler (ALQ-01 a ALQ-11, TDD-03-alquiler.md).
    Implementa el ciclo de vida completo de alquiler: creación directa y desde reserva confirmada (RES-05),
    validación documental (BR-CON-004), prueba de alcolímetro de tolerancia cero (BR-ALQ-005),
    matriz de evaluación notarial y tercer camino (BR-ALQ-003/004), formalización de contrato con garantía (BR-DOC-002/003),
    y entrega formal del vehículo con checklist (35 fotos + 3 videos) y transición de flota a RENTED (BR-INS-003/004).

paths:
  /rentals:
    post:
      operationId: createRental
      summary: Crear alquiler directo (ALQ-01)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRentalRequest' }
      responses:
        '201':
          description: Alquiler creado exitosamente en estado DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '400':
          description: Datos inválidos
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Cliente, vehículo o consulta (inquiryId) no encontrado en la empresa
        '409':
          description: VEHICLE_NOT_AVAILABLE - vehículo no AVAILABLE, de otra sede o con reserva/compromiso solapado
        '422':
          description: Período de alquiler inválido, CUSTOMER_BLOCKED (cliente ROJO) o INQUIRY_NOT_TRANSITIONABLE (inquiryId no está COTIZADA)
        '500':
          description: Error interno del servidor

    get:
      operationId: listRentals
      summary: Bandeja de alquileres con filtros y paginación keyset
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/RentalStatus' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursorCreatedAt, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: cursorId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de alquileres
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RentalResponse' }
        '400':
          description: Parámetros de cursor inválidos o limit fuera de rango
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '500':
          description: Error interno del servidor

  /rentals/from-reservation/{reservationId}:
    post:
      operationId: createRentalFromReservation
      summary: Crear alquiler a partir de reserva confirmada (RES-05 / RES-08 "se presento" / ALQ-01)
      description: >
        Desde 1.3.0 (UC-RES-005, BR-RES-002): en la MISMA transaccion la reserva
        pasa CONFIRMED -> CONVERTED (updateMany atomico por scope + estado), se
        crea el alquiler y el `vehicle_commitment` de la reserva se traslada al
        alquiler (sigue bloqueando el vehiculo; no hay doble conflicto de solape).
        Se audita y se publica el evento `ReservationConverted`. Idempotente: si la
        reserva ya esta CONVERTED se devuelve el alquiler existente (201) en vez de
        fallar. El monto pagado de la reserva sigue trasladandose a la garantia
        (P0-03 opcion a, ver formalize-contract). Es el camino "se presento" del
        protocolo de no-show (RES-08); "no se presento" es `cancel` con reason
        NO_SHOW en reservations.yaml (solo Gerencia).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRentalFromReservationRequest' }
      responses:
        '201':
          description: Alquiler creado exitosamente vinculado a la reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '400':
          description: Datos inválidos
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Reserva no encontrada en la empresa/sede
        '409':
          description: 'RESERVATION_NOT_CONFIRMED - la reserva no esta CONFIRMED (DRAFT, PENDING_SALE_RESOLUTION, CANCELLED...) o cambio de estado mientras se procesaba; RENTAL_ALREADY_EXISTS_FOR_RESERVATION'
        '500':
          description: Error interno del servidor

  /rentals/{id}:
    get:
      operationId: getRental
      summary: Detalle completo de un expediente de alquiler
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Expediente del alquiler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Alquiler no encontrado en la empresa/sede
        '500':
          description: Error interno del servidor

  /rentals/{id}/commands/validate-documents:
    post:
      operationId: validateDocuments
      summary: Validar documentos del cliente e intervinientes (BR-CON-004)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateDocumentsRequest' }
      responses:
        '200':
          description: Documentos validados; alquiler pasa a VALIDATION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '409':
          description: Estado incompatible (debe estar en DRAFT)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: Documentos incompletos
        '428':
          description: Falta header If-Match

  /rentals/{id}/commands/register-alcohol-test:
    post:
      operationId: registerAlcoholTest
      summary: Registrar resultado de prueba de alcolímetro (BR-ALQ-005)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAlcoholTestRequest' }
      responses:
        '200':
          description: Resultado registrado (FAVORABLE -> NOTARY_EVALUATION; DESFAVORABLE/RECHAZADO -> CANCELLED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '409':
          description: Estado incompatible (debe estar en VALIDATION)
        '422':
          description: ALCOHOL_TEST_PHOTO_REQUIRED (DESFAVORABLE o RECHAZADO sin foto ALCOHOL_TEST subida antes)
        '412':
          description: Versión no coincide (If-Match)
        '428':
          description: Falta header If-Match

  /rentals/{id}/commands/evaluate-notary:
    post:
      operationId: evaluateNotary
      summary: Evaluar matriz notarial automática (BR-ALQ-003/004)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateNotaryRequest' }
      responses:
        '200':
          description: Resultado de evaluación notarial
          content:
            application/json:
              schema:
                type: object
                required: [rental, evaluation]
                properties:
                  rental: { $ref: '#/components/schemas/RentalResponse' }
                  evaluation:
                    type: object
                    required: [result, policyVersion, reason, requiresApproval]
                    properties:
                      result: { $ref: '#/components/schemas/NotaryResult' }
                      policyVersion: { type: integer }
                      reason: { type: string }
                      requiresApproval: { type: boolean }
                      approverRole: { type: string }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '409':
          description: Estado incompatible (debe estar en NOTARY_EVALUATION)
        '412':
          description: Versión no coincide (If-Match)
        '428':
          description: Falta header If-Match

  /rentals/{id}/commands/approve-notary-exception:
    post:
      operationId: approveNotaryException
      summary: Aprobar excepción notarial / tercer camino (BR-ALQ-004) - Exclusivo Gerencia
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveNotaryExceptionRequest' }
      responses:
        '200':
          description: Excepción aprobada; alquiler pasa a CONTRACTING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: Rol no autorizado (solo GERENCIA)
        '409':
          description: Estado incompatible
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: Vehículo prohibido para excepción notarial (BR-ALQ-003)
        '428':
          description: Falta header If-Match

  /rentals/{id}/contract-template:
    get:
      operationId: getRentalContractTemplate
      summary: Plantilla de contrato vigente que corresponde al alquiler (BR-DOC-002/003)
      description: >
        Devuelve la plantilla ACTIVE de la empresa para la combinación titular
        persona natural/jurídica × con/sin conductor (BR-DOC-003). Si la empresa
        aún no cargó la plantilla de esa combinación se devuelve la plantilla
        genérica `RENTAL_CONTRACT` con `fallbackUsed: true`. Sin `holderType` solo
        se consulta la genérica. `template` es null cuando no hay ninguna vigente
        (formalizar fallaría con NO_ACTIVE_CONTRACT_TEMPLATE). Solo lectura:
        formalize-contract vuelve a resolverla en el servidor.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: holderType, in: query, required: false, schema: { $ref: '#/components/schemas/ContractHolderType' } }
        - { name: withCompanyDriver, in: query, required: false, description: 'true si el cliente pide que la empresa le ofrezca un conductor (BR-DOC-003). Obligatorio si se envía holderType (o su alias deprecado withDriver).', schema: { type: string, enum: ['true', 'false'] } }
        - { name: withDriver, in: query, required: false, deprecated: true, description: 'DEPRECADO: alias de withCompanyDriver.', schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Plantilla resuelta (o null si no hay vigente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractTemplateSelectionResponse' }
        '400':
          description: Parámetros inválidos
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Alquiler no encontrado en la empresa y sede

  /rentals/{id}/commands/register-authorized-driver:
    post:
      operationId: registerAuthorizedDriver
      summary: Registrar conductor propio autorizado de persona jurídica con su adenda (DEC-ALQ-OWN-DRIVER-005, BR-ALQ-015)
      description: >
        Solo PERSONA JURÍDICA: la empresa asume la responsabilidad y el conductor firma una adenda aparte
        (`addendumDocumentRef`). Persona NATURAL con conductor propio distinto del titular NO está permitido
        (conduce quien alquila, o se pide el conductor de la empresa): 422 NATURAL_PERSON_OWN_DRIVER_NOT_ALLOWED.
        El tipo de titular se toma del contrato formalizado; si aún no hay contrato, enviar `holderType`.
        Estados admitidos: VALIDATION, NOTARY_EVALUATION, CONTRACTING, PENDING_DELIVERY. Incrementa la versión del alquiler (If-Match).
        Permiso: RENTAL.FORMALIZE_CONTRACT.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAuthorizedDriverRequest' }
      responses:
        '200':
          description: Conductor autorizado registrado; el alquiler trae la nueva party con role DRIVER y `addendumDocumentRef`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '400': { description: ADDENDUM_DOCUMENT_REQUIRED o datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Sin permiso o contexto no autorizado }
        '404': { description: Alquiler no encontrado }
        '409': { description: RENTAL_DRIVER_ALREADY_REGISTERED o RENTAL_DRIVER_REGISTRATION_CLOSED (estado posterior a la entrega) }
        '422': { description: NATURAL_PERSON_OWN_DRIVER_NOT_ALLOWED, HOLDER_TYPE_REQUIRED, HOLDER_TYPE_MISMATCH o DRIVER_CUSTOMER_NOT_FOUND }
        '412': { description: Versión no coincide (If-Match) }
        '428': { description: Falta header If-Match }
        '500': { description: Error interno }

  /rentals/{id}/commands/register-companion:
    post:
      operationId: registerCompanion
      summary: Registrar acompañante autorizado de persona natural como responsable del contrato (DEC-ALQ-COMPANION-006, BR-ALQ-015)
      description: >
        Excepción de conductor (BDD ALQ-P03; Ficha AS-IS): si el titular persona NATURAL no puede firmar (p. ej. su
        brevete extranjero no es válido), un acompañante con licencia vigente firma como RESPONSABLE del contrato.
        Se registra como party con role RESPONSIBLE y se EXIGE registrar también al conductor real (`driverCustomerId`,
        party DRIVER); el responsable legal es quien firma. La licencia no se guarda: solo los checks
        `companionLicenseVerified` y `driverLicenseVerified`. NO habilita al acompañante a conducir: el conductor propio distinto del titular
        sigue sin permitirse en persona natural (register-authorized-driver responde 422 NATURAL_PERSON_OWN_DRIVER_NOT_ALLOWED).
        En persona JURÍDICA no aplica (422 COMPANION_NOT_APPLICABLE_FOR_LEGAL_HOLDER): ahí se usa register-authorized-driver.
        `reason` es obligatorio y queda en auditoría y en el evento AcompananteAutorizadoRegistrado.v1 (no se persiste en columna).
        El tipo de titular se toma del contrato formalizado o, si no hay, del tipo de documento del titular (RUC → LEGAL, DNI → NATURAL); `holderType` es solo respaldo.
        Estados admitidos: VALIDATION, NOTARY_EVALUATION, CONTRACTING, PENDING_DELIVERY. Incrementa la versión (If-Match).
        Permiso: RENTAL.FORMALIZE_CONTRACT.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCompanionRequest' }
      responses:
        '200':
          description: Acompañante registrado; el alquiler trae la nueva party con role RESPONSIBLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '400': { description: COMPANION_REASON_REQUIRED o datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Sin permiso o contexto no autorizado }
        '404': { description: Alquiler no encontrado }
        '409': { description: RENTAL_DRIVER_ALREADY_REGISTERED (el cliente ya es interviniente) o RENTAL_DRIVER_REGISTRATION_CLOSED (estado posterior a la entrega) }
        '412': { description: Versión no coincide (If-Match) }
        '422': { description: 'COMPANION_NOT_APPLICABLE_FOR_LEGAL_HOLDER, HOLDER_TYPE_REQUIRED, HOLDER_TYPE_MISMATCH, COMPANION_CUSTOMER_NOT_FOUND, DRIVER_CUSTOMER_NOT_FOUND, LICENSE_VERIFICATION_REQUIRED, COMPANION_DRIVER_MUST_DIFFER o COMPANION_PASSENGER_CAPACITY_EXCEEDED' }
        '428': { description: Falta header If-Match }
        '500': { description: Error interno }

  /rentals/{id}/commands/set-company-driver-daily-rate:
    post:
      operationId: setCompanyDriverDailyRate
      summary: Digitar la tarifa diaria del conductor de la empresa en el alquiler (DEC-ALQ-DRIVERRATE-001, F-02)
      description: >
        El monto de la tarifa diaria aún no está definido por negocio: un usuario autorizado lo digita a mano en el expediente cuando se
        requiera (cuando no hay tarifa de entorno, o para sobrescribirla en este alquiler). Prioridad: valor manual > env
        COMPANY_DRIVER_DAILY_RATE > «tarifa no definida». `dailyRate` es en PEN, > 0, máximo 2 decimales (hasta 99999999.99). Solo aplica
        a alquileres con contrato formalizado «con conductor de la empresa» (la variante se conoce al formalizar) y en estados
        PENDING_DELIVERY (se puede corregir hasta completar la entrega; después 409 COMPANY_DRIVER_RATE_CLOSED). Es OBLIGATORIA para completar la entrega. Volver a enviarlo corrige el valor (queda en auditoría el valor
        anterior). Incrementa la versión (If-Match) y publica el evento TarifaConductorEmpresaDefinida.v1. La respuesta trae
        `companyDriverCharge` (tarifa × días, con `source`). Permiso: RENTAL.FORMALIZE_CONTRACT.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCompanyDriverDailyRateRequest' }
      responses:
        '200':
          description: Tarifa registrada; el alquiler trae `companyDriverCharge` con `source=MANUAL`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '400':
          description: COMPANY_DRIVER_RATE_INVALID o datos inválidos (monto <= 0, más de 2 decimales)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalErrorResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Sin permiso o contexto no autorizado }
        '404': { description: Alquiler no encontrado }
        '409':
          description: COMPANY_DRIVER_RATE_CLOSED (el proceso de alquiler ya terminó - ACTIVE, EXTENSION_PENDING, RETURN_IN_PROGRESS - o está CLOSED/CANCELLED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalErrorResponse' }
        '412': { description: Versión no coincide (If-Match) }
        '422':
          description: COMPANY_DRIVER_RATE_NOT_APPLICABLE (el alquiler no es con conductor de la empresa o aún no tiene contrato formalizado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalErrorResponse' }
        '428': { description: Falta header If-Match }
        '500': { description: Error interno }

  /rentals/{id}/commands/formalize-contract:
    post:
      operationId: formalizeContract
      summary: Formalizar contrato firmado y registrar garantía (BR-DOC-002/003)
      description: >
        `depositAmount` es la garantía TOTAL del vehículo (se digita a mano hasta
        que Flota la provea). En alquileres de origen Reserva el monto pagado por
        la reserva se traslada íntegro a esa garantía (P0-03 opción a) y solo se
        cobra la diferencia: la respuesta trae `deposit.reservationCreditAmount` y
        `deposit.amountCollected`. En alquiler directo no hay traslado. El traslado
        solo aplica si la reserva sigue CONFIRMED/CONVERTED con el pago validado;
        una reserva cancelada (incluye no-show) no traslada nada. La plantilla se
        elige por `holderType` + `withCompanyDriver` (BR-DOC-003). Si el monto de la reserva supera la garantía, se aplica hasta cubrirla y el sobrante se informa en `deposit.reservationCreditExcess`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormalizeContractRequest' }
      responses:
        '200':
          description: Contrato formalizado; alquiler pasa a PENDING_DELIVERY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '400':
          description: Monto de garantía inválido, o NO_ACTIVE_CONTRACT_TEMPLATE (la empresa no tiene plantilla vigente para la combinación)
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '409':
          description: Estado incompatible (debe estar en CONTRACTING)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: DEPOSIT_NOT_APPLICABLE_WITH_COMPANY_DRIVER (se envió garantía con conductor de la empresa). RESERVATION_CREDIT_CURRENCY_MISMATCH (moneda distinta). Un monto de reserva mayor que la garantía ya NO es error (queda en deposit.reservationCreditExcess).
        '428':
          description: Falta header If-Match

  /rentals/{id}/commands/complete-delivery:
    post:
      operationId: completeDelivery
      summary: Completar entrega física del vehículo con checklist (BR-INS-003/004)
      description: >
        Alquiler directo (sin reserva): fija startAt = ahora y, si viene de una
        consulta, expectedEndAt = startAt + estimatedDays de la cotizacion
        vinculada, re-chequeando la disponibilidad del vehiculo. Alquiler de
        origen Reserva: conserva las fechas acordadas. Con conductor de la empresa exige la tarifa diaria digitada
        (422 COMPANY_DRIVER_RATE_REQUIRED).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteDeliveryRequest' }
      responses:
        '200':
          description: Entrega completada; alquiler pasa a ACTIVE y vehículo a RENTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '409':
          description: Estado incompatible (debe estar en PENDING_DELIVERY), o VEHICLE_NOT_AVAILABLE al re-chequear disponibilidad (solo alquiler directo)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: Falta evidencia obligatoria (mínimo 35 fotos y 3 videos), o COMPANY_DRIVER_RATE_REQUIRED (con conductor de la empresa sin tarifa diaria digitada)
        '428':
          description: Falta header If-Match

  /rentals/{id}/evidence/upload-url:
    post:
      operationId: requestRentalEvidenceUploadSession
      summary: Solicita una URL firmada para subir una foto/video de evidencia de entrega a GCS
      description: >
        Mismo patron que POST /fleet/vehicles/photo-upload-sessions (PROP-008 /
        ADR-KAI-005): el cliente hace PUT del archivo a uploadUrl y luego
        confirma con POST /rentals/{id}/evidence usando el objectUrl devuelto.
        Requiere Idempotency-Key para reintentos seguros.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestEvidenceUploadSessionRequest' }
      responses:
        '201':
          description: Sesión de carga creada correctamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceUploadSessionResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Alquiler no encontrado
        '409':
          description: Estado incompatible (debe estar en PENDING_DELIVERY)
        '413':
          description: contentLength supera el máximo permitido (12 MB foto / 200 MB video)

  /rentals/{id}/evidence:
    post:
      operationId: recordRentalEvidence
      summary: Registra una evidencia (foto/video) ya subida a GCS
      description: >
        Confirma en BD una evidencia subida con la uploadUrl obtenida de
        POST /rentals/{id}/evidence/upload-url. Requiere Idempotency-Key.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordEvidenceRequest' }
      responses:
        '201':
          description: Evidencia registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalEvidenceResponse' }
        '400':
          description: objectUrl no es una URL de GCS válida
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Alquiler no encontrado
        '409':
          description: Estado incompatible (debe estar en PENDING_DELIVERY)
    get:
      operationId: listRentalEvidence
      summary: Lista la evidencia de entrega registrada para un alquiler
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de evidencia (progreso del checklist BR-INS-003/004)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RentalEvidenceResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Alquiler no encontrado

  /rentals/{id}/evidence/{evidenceId}:
    delete:
      operationId: deleteRentalEvidence
      summary: Elimina una evidencia (foto/video) de entrega registrada por error
      description: >
        Solo mientras el alquiler esté en PENDING_DELIVERY; una vez completada la
        entrega la evidencia no se puede alterar. Misma acción de matriz que subirla
        (RENTAL.UPLOAD_EVIDENCE). Se elimina el registro; el archivo del bucket no se toca.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Evidencia eliminada
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Alquiler o evidencia no encontrados
        '409':
          description: Estado incompatible (debe estar en PENDING_DELIVERY)

  /rentals/{id}/documents/upload-url:
    post:
      operationId: requestRentalDocumentUploadSession
      summary: Obtener URL firmada de GCS para subir un documento del cliente (Bug-04 / ALQ-02)
      description: >
        Devuelve una URL de carga firmada de GCS para subir el archivo directamente desde el
        navegador. Después de subir el archivo, llamar a POST /rentals/{id}/documents para
        registrar el documento. Requiere Idempotency-Key.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestRentalDocumentUploadSessionRequest' }
      responses:
        '201':
          description: URL de carga generada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadSessionResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: No autorizado }
        '404': { description: Alquiler no encontrado }

  /rentals/{id}/documents:
    post:
      operationId: recordRentalDocument
      summary: Registrar un documento del cliente ya subido a GCS (Bug-04 / ALQ-02)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordRentalDocumentRequest' }
      responses:
        '201':
          description: Documento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalDocumentResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: No autorizado }
        '404': { description: Alquiler no encontrado }
    get:
      operationId: listRentalDocuments
      summary: Listar documentos del cliente adjuntos a un alquiler
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: companyId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RentalDocumentResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: No autorizado }
        '404': { description: Alquiler no encontrado }

  /rentals/{id}/commands/request-extension:
    post:
      operationId: requestExtension
      summary: Solicitar ampliacion de alquiler (UC-ALQ-006 / BR-ALQ-012)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestExtensionRequest' }
      responses:
        '200':
          description: Ampliacion solicitada; alquiler pasa a EXTENSION_PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '409':
          description: Estado incompatible (debe estar en ACTIVE)
        '412':
          description: Version no coincide (If-Match)
        '422':
          description: No cumple aviso de 12h de anticipacion o excede 3 dias (BR-ALQ-012)
        '428':
          description: Falta header If-Match

  /rentals/{id}/commands/authorize-extension:
    post:
      operationId: authorizeExtension
      summary: Autorizar ampliacion de alquiler (UC-ALQ-006 / BR-ALQ-012)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizeExtensionRequest' }
      responses:
        '200':
          description: Ampliacion autorizada; alquiler regresa a ACTIVE con nuevo expectedEndAt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: Rol no autorizado (solo GERENCIA)
        '409':
          description: Estado incompatible (debe estar en EXTENSION_PENDING)
        '412':
          description: Version no coincide (If-Match)
        '422':
          description: Vehiculo no disponible en la ventana extendida
        '428':
          description: Falta header If-Match

  /rentals/{id}/commands/reject-extension:
    post:
      operationId: rejectExtension
      summary: Rechazar ampliacion de alquiler (UC-ALQ-006 / BR-ALQ-012)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectExtensionRequest' }
      responses:
        '200':
          description: Ampliacion rechazada; alquiler regresa a ACTIVE sin cambiar el plazo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '409':
          description: Estado incompatible (debe estar en EXTENSION_PENDING)
        '412':
          description: Version no coincide (If-Match)
        '428':
          description: Falta header If-Match

  /rentals/{id}/commands/report-extension-breach:
    post:
      operationId: reportExtensionBreach
      summary: Registrar falta grave de ampliacion (UC-ALQ-006b / BR-ALQ-013) - retiene 100% de garantia y marca cliente "rojo"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportExtensionBreachRequest' }
      responses:
        '200':
          description: Falta grave registrada; extension pasa a BREACH, garantia retenida al 100%, cliente marcado "rojo" y el alquiler vuelve a ACTIVE para poder iniciar la devolucion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente (requiere GERENCIA)
        '409':
          description: Estado incompatible (debe estar en EXTENSION_PENDING)
        '412':
          description: Version no coincide (If-Match)
        '428':
          description: Falta header If-Match

components:
  schemas:
    RentalStatus:
      type: string
      enum:
        - DRAFT
        - VALIDATION
        - NOTARY_EVALUATION
        - CONTRACTING
        - PENDING_DELIVERY
        - ACTIVE
        - EXTENSION_PENDING
        - RETURN_IN_PROGRESS
        - CLOSED
        - CANCELLED

    AlcoholTestResult:
      type: string
      enum:
        - FAVORABLE
        - DESFAVORABLE
        - RECHAZADO

    NotaryResult:
      type: string
      enum:
        - MANDATORY
        - DOUBLE_DEPOSIT
        - THIRD_PATH_ELIGIBLE
        - MANUAL_REVIEW

    RentalPartyRole:
      type: string
      enum:
        - SIGNER
        - DRIVER
        - RESPONSIBLE

    CreateRentalRequest:
      type: object
      required: [companyId, branchId, customerId, vehicleId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        planCode: { type: string, enum: [NORMAL, PLUS, LIBRE], default: NORMAL }
        startAt: { type: string, format: date-time }
        expectedEndAt: { type: string, format: date-time }
        inquiryId: { type: string, format: uuid }

    CreateRentalFromReservationRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        planCode: { type: string, enum: [NORMAL, PLUS, LIBRE], default: NORMAL }

    ValidateDocumentsRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        identityDocumentValid: { type: boolean }
        driverLicenseValid: { type: boolean }
        addressOrStayProofValid: { type: boolean }
        notes: { type: string }

    RegisterAlcoholTestRequest:
      type: object
      required: [companyId, branchId, result]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        result: { $ref: '#/components/schemas/AlcoholTestResult' }
        notes: { type: string }

    EvaluateNotaryRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }

    ApproveNotaryExceptionRequest:
      type: object
      required: [companyId, branchId, justification]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        justification: { type: string, minLength: 10 }

    RegisterAuthorizedDriverRequest:
      type: object
      required: [companyId, branchId, driverCustomerId, addendumDocumentRef]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        driverCustomerId: { type: string, format: uuid, description: Cliente (persona) que conducirá. }
        addendumDocumentRef: { type: string, minLength: 1, maxLength: 200, description: Referencia de la adenda firmada por el conductor autorizado. }
        holderType: { $ref: '#/components/schemas/ContractHolderType' }

    RegisterCompanionRequest:
      type: object
      required: [companyId, branchId, companionCustomerId, driverCustomerId, companionLicenseVerified, driverLicenseVerified, reason]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        companionCustomerId: { type: string, format: uuid, description: Cliente (persona) con licencia vigente que firma como responsable. }
        driverCustomerId: { type: string, format: uuid, description: Conductor real del alquiler (party DRIVER); distinto del acompañante. }
        companionLicenseVerified: { type: boolean, description: Check del checklist "licencia vigente verificada" del acompañante (debe ser true; la licencia no se guarda). }
        driverLicenseVerified: { type: boolean, description: Check del checklist "licencia vigente verificada" del conductor real (debe ser true; la licencia no se guarda). }
        reason: { type: string, minLength: 10, maxLength: 500, description: Motivo por el que el titular no puede firmar. }
        addendumDocumentRef: { type: string, minLength: 1, maxLength: 200, description: Referencia documental opcional (la autorización del acompañante es la del firmante; no se exige documento aparte). }
        holderType: { $ref: '#/components/schemas/ContractHolderType' }

    RentalErrorResponse:
      type: object
      required: [statusCode, code, detail]
      description: Forma de los errores de dominio del módulo.
      properties:
        statusCode: { type: integer }
        code: { type: string }
        detail: { type: string }

    SetCompanyDriverDailyRateRequest:
      type: object
      required: [companyId, branchId, dailyRate]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        dailyRate:
          type: string
          pattern: '^(?!0+(\.0{1,2})?$)\d{1,8}(\.\d{1,2})?$'
          description: Tarifa diaria del conductor de la empresa en PEN; > 0, máximo 2 decimales. Ej. "120" o "120.50".

    FormalizeContractRequest:
      type: object
      required: [companyId, branchId, documentRef]
      description: >
        `depositAmount` y `depositCurrency` son obligatorios SALVO con conductor de la empresa
        (`withCompanyDriver=true`), donde no hay garantía y se omiten (DEC-ALQ-COMPANY-DRIVER-004).
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        documentRef: { type: string }
        depositAmount:
          type: string
          description: Garantía TOTAL del vehículo (incluye el monto de reserva que se traslada, si lo hay). Omitir con conductor de la empresa.
        depositCurrency: { type: string, enum: [PEN, USD], description: Omitir con conductor de la empresa. }
        holderType: { $ref: '#/components/schemas/ContractHolderType' }
        withCompanyDriver:
          type: boolean
          description: >
            BR-DOC-003. El cliente pide que la empresa le OFREZCA un conductor (servicio). No es el
            conductor distinto del titular de BR-ALQ-015. Obligatorio si se envía holderType.
        withDriver:
          type: boolean
          deprecated: true
          description: DEPRECADO (DEC-ALQ-DRIVER-001). Alias de withCompanyDriver; si ambos difieren, 400 CONTRACT_VARIANT_DRIVER_CONFLICT.
        signatureData:
          type: string
          nullable: true
          description: >
            Firma digital del cliente capturada en canvas como PNG base64 (data URI sin el prefijo
            "data:image/png;base64,"). Opcional - se almacena junto al contrato cuando se proporciona.

    CompleteDeliveryRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        photosCount:
          type: integer
          minimum: 0
          deprecated: true
          description: >
            Obsoleto - BR-INS-003/004 ahora se valida contra el conteo real de
            RentalEvidence (ver POST /rentals/{id}/evidence), no contra este
            contador. Se mantiene opcional solo por compatibilidad.
        videosCount:
          type: integer
          minimum: 0
          deprecated: true
        notes: { type: string }

    VehicleDataWarning:
      type: object
      description: >
        DEC-ALQ-VEHDATA-001 (Respuestas 2026-10-20 #5). Aviso estructurado por cada dato del vehículo que falta en Flota
        (capacidad de pasajeros, garantía, precio del combustible). NO bloquea; el front pide completarlo con
        PATCH /fleet/vehicles/{id}.
      required: [code, field, message]
      properties:
        code:
          type: string
          enum: [VEHICLE_PASSENGER_CAPACITY_MISSING, VEHICLE_DEPOSIT_MINIMUM_MISSING, VEHICLE_FUEL_PRICE_MISSING]
        field:
          type: string
          enum: [passengerCapacity, depositMinimum, fuelPrice]
        message: { type: string }

    RentalEvidenceZone:
      type: string
      enum: [FRONTAL, LATERAL_IZQUIERDO, LATERAL_DERECHO, POSTERIOR, INTERIOR, ALCOHOL_TEST]
      description: ALCOHOL_TEST = foto de la prueba de alcoholímetro (ENTREGA-02; solo en VALIDATION; no cuenta para las 35 fotos del checklist).

    RequestEvidenceUploadSessionRequest:
      type: object
      required: [companyId, branchId, type, zone, contentType, contentLength]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        type: { type: string, enum: [PHOTO, VIDEO] }
        zone: { $ref: '#/components/schemas/RentalEvidenceZone' }
        contentType:
          type: string
          enum: [image/jpeg, image/webp, video/mp4, video/webm]
        contentLength:
          type: integer
          minimum: 1
          description: >
            Tamaño exacto del archivo en bytes. Máximo 12 MB para PHOTO, 200 MB
            para VIDEO (supuesto propio de esta tarea, sin BR que fije un límite
            de video).

    EvidenceUploadSessionResponse:
      type: object
      required: [uploadUrl, objectUrl]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: URL firmada de GCS (PUT, válida 15 min).
        objectUrl:
          type: string
          format: uri
          description: URL permanente del objeto en GCS. Pasar a POST /rentals/{id}/evidence.

    RecordEvidenceRequest:
      type: object
      required: [companyId, branchId, type, zone, objectUrl]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        type: { type: string, enum: [PHOTO, VIDEO] }
        zone: { $ref: '#/components/schemas/RentalEvidenceZone' }
        objectUrl:
          type: string
          format: uri
          description: objectUrl devuelto por POST /rentals/{id}/evidence/upload-url, ya subido a GCS.

    RentalEvidenceResponse:
      type: object
      required: [id, rentalId, type, zone, objectUrl, uploadedBy, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        type: { type: string, enum: [PHOTO, VIDEO] }
        zone: { $ref: '#/components/schemas/RentalEvidenceZone' }
        objectUrl: { type: string, format: uri }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }

    RequestExtensionRequest:
      type: object
      required: [companyId, branchId, requestedEndAt]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        requestedEndAt: { type: string, format: date-time }

    AuthorizeExtensionRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        addendumDocumentRef: { type: string }

    RejectExtensionRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }

    ReportExtensionBreachRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        notes: { type: string, maxLength: 500, description: 'Nota adicional del operador para el expediente de evaluacion legal (BR-ALQ-013)' }

    RentalPartyResponse:
      type: object
      required: [id, customerId, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/RentalPartyRole' }
        addendumDocumentRef:
          type: string
          nullable: true
          description: Adenda firmada del conductor autorizado (DRIVER de persona jurídica, DEC-ALQ-OWN-DRIVER-005). Null en el resto.
        createdAt: { type: string, format: date-time }

    NotaryEvaluationResponse:
      type: object
      required: [id, policyVersion, result, reason, evaluatedAt]
      properties:
        id: { type: string, format: uuid }
        policyVersion: { type: integer }
        result: { $ref: '#/components/schemas/NotaryResult' }
        reason: { type: string }
        evaluatedAt: { type: string, format: date-time }
        approvedBy: { type: string, nullable: true }
        justification: { type: string, nullable: true }

    RentalContractResponse:
      type: object
      required: [id, documentRef, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid, nullable: true }
        documentRef: { type: string }
        status: { type: string }
        signedAt: { type: string, format: date-time, nullable: true }
        contractVariant:
          type: string
          nullable: true
          description: Combinación con la que se eligió la plantilla (p. ej. NATURAL_NO_DRIVER). Null en contratos anteriores.
        depositRequired: { type: boolean, description: false = con conductor de la empresa, sin garantía (DEC-ALQ-COMPANY-DRIVER-004). }
        reservationCreditExcess: { type: string, description: Crédito de reserva sin garantía a la cual aplicarse (saldo a favor; "0.00" si no aplica). }
        createdAt: { type: string, format: date-time }

    ContractHolderType:
      type: string
      enum: [NATURAL, LEGAL]
      description: BR-DOC-003 - titular persona natural o jurídica.

    ContractTemplateSelectionResponse:
      type: object
      required: [rentalId, requestedType, fallbackUsed, template]
      properties:
        rentalId: { type: string, format: uuid }
        variant:
          type: object
          nullable: true
          required: [holderType, withCompanyDriver, withDriver]
          properties:
            holderType: { $ref: '#/components/schemas/ContractHolderType' }
            withCompanyDriver: { type: boolean, description: 'La empresa ofrece conductor al cliente (BR-DOC-003).' }
            withDriver: { type: boolean, deprecated: true, description: 'Alias deprecado de withCompanyDriver (mismo valor).' }
        requestedType:
          type: string
          description: Tipo de plantilla buscado primero (RENTAL_CONTRACT_NATURAL, ..._NATURAL_DRIVER, ..._LEGAL, ..._LEGAL_DRIVER o RENTAL_CONTRACT).
        fallbackUsed:
          type: boolean
          description: true si no había plantilla vigente para la combinación y se usa la genérica.
        template:
          type: object
          nullable: true
          required: [id, type, name]
          properties:
            id: { type: string, format: uuid }
            type: { type: string }
            name: { type: string }
            version: { type: integer, nullable: true }
            effectiveFrom: { type: string, format: date-time, nullable: true }

    RentalDepositResponse:
      type: object
      required: [id, originalAmount, currency, status, reservationCreditAmount, reservationCreditExcess, amountCollected, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalAmount:
          type: string
          description: Garantía TOTAL retenida (incluye el monto de reserva trasladado).
        currency: { type: string }
        status: { type: string }
        reservationCreditAmount:
          type: string
          description: P0-03 (a) - parte de la garantía ya pagada como reserva. "0.00" en alquiler directo.
        reservationCreditExcess:
          type: string
          description: >
            DEC-ALQ-RESCREDIT-002 - excedente del monto de la reserva sobre la garantía ("0.00" si no hay).
            Saldo a favor solo informativo: sin reembolso ni cálculo automático (pregunta abierta a Finanzas).
        amountCollected:
          type: string
          description: Diferencia cobrada al formalizar = originalAmount - reservationCreditAmount.
        createdAt: { type: string, format: date-time }

    CompanyDriverChargeResponse:
      type: object
      required: [configured, source, dailyRate, currency, days, total]
      description: >
        Servicio de conductor de la empresa: TARIFA DIARIA × días del alquiler, sin garantía (Fiorella, 16-oct-2026).
        Vista calculada (el total no se persiste). Tarifa diaria: valor manual del alquiler (set-company-driver-daily-rate) > parámetro
        COMPANY_DRIVER_DAILY_RATE > no definida (DEC-ALQ-DRIVERRATE-001; el monto aún no lo define negocio y nunca se inventa).
      properties:
        configured: { type: boolean, description: false = la tarifa diaria no está definida (source NOT_DEFINED; importes en "0.00"; el cobro queda pendiente de digitar). }
        source:
          type: string
          enum: [MANUAL, ENV, NOT_DEFINED]
          description: Origen de la tarifa aplicada (MANUAL = digitada en el alquiler; ENV = parámetro del sistema; NOT_DEFINED = sin tarifa).
        dailyRate: { type: string }
        currency: { type: string, enum: [PEN, USD] }
        days: { type: integer, minimum: 0 }
        total: { type: string }

    ReservationCreditResponse:
      type: object
      required: [applicable, reason, reservationId, amount, currency]
      description: >
        P0-03 (a) - vista previa del traslado del monto de la reserva a la garantía (solo GET detalle,
        solo alquileres de origen Reserva).
      properties:
        applicable: { type: boolean }
        reason:
          type: string
          enum: [APPLIED, NO_RESERVATION, RESERVATION_NOT_ACTIVE, PAYMENT_NOT_VALIDATED]
        reservationId: { type: string, format: uuid, nullable: true }
        amount: { type: string }
        currency: { type: string, nullable: true }

    ExtensionRequirements:
      type: object
      required: [noticeGiven, authorized, paid, addendumSigned]
      description: BR-ALQ-012/013 - estado de los 4 requisitos de la ampliación según lo registrado.
      properties:
        noticeGiven:
          type: boolean
          nullable: true
          description: Aviso con 12 h de anticipación al vencimiento. Null si ya no se puede reconstruir.
        authorized: { type: boolean }
        paid: { type: boolean }
        addendumSigned: { type: boolean }

    RentalExtensionResponse:
      type: object
      required: [id, requestedEndAt, status, requestedAt, resolvedAt, paymentId, addendumDocumentRef, requirements]
      properties:
        id: { type: string, format: uuid }
        requestedEndAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, AUTHORIZED, REJECTED, BREACH] }
        requestedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        paymentId: { type: string, nullable: true }
        addendumDocumentRef: { type: string, nullable: true }
        requirements: { $ref: '#/components/schemas/ExtensionRequirements' }

    RentalResponse:
      type: object
      required:
        - id
        - organizationId
        - operatingCompanyId
        - branchId
        - customerId
        - customerName
        - customerDocNumber
        - vehicleId
        - vehiclePlate
        - vehicleBrand
        - vehicleModel
        - vehiclePassengerCapacity
        - vehicleFuelPrice
        - vehicleWarnings
        - companionsCount
        - planCode
        - status
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
        - etag
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        operatingCompanyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        inquiryId: { type: string, format: uuid, nullable: true }
        reservationId: { type: string, format: uuid, nullable: true }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        customerDocNumber: { type: string }
        vehicleId: { type: string, format: uuid }
        vehiclePlate: { type: string }
        vehicleBrand: { type: string }
        vehicleModel: { type: string }
        vehicleDepositMinimum:
          type: number
          nullable: true
          description: Monto mínimo de garantía configurado para el vehículo (PEN).
        vehiclePassengerCapacity:
          type: integer
          nullable: true
          description: Capacidad de pasajeros del vehículo (máximo de acompañantes). Null = sin capacidad registrada en Flota (DEC-FLT-CAP-002); en ese caso el máximo no se valida.
        vehicleFuelPrice:
          type: number
          nullable: true
          description: Precio del combustible del vehículo (PEN). Null = no registrado en Flota (genera aviso VEHICLE_FUEL_PRICE_MISSING).
        vehicleWarnings:
          type: array
          items: { $ref: '#/components/schemas/VehicleDataWarning' }
          description: Un aviso por cada dato del vehículo que falta (capacidad, garantía, combustible). Vacío si está completo. No bloquea.
        companionsCount:
          type: integer
          minimum: 0
          description: Acompañantes registrados en el alquiler (parties con rol RESPONSIBLE). Se compara contra vehiclePassengerCapacity.
        planCode: { type: string }
        status: { $ref: '#/components/schemas/RentalStatus' }
        startAt: { type: string, format: date-time, nullable: true }
        expectedEndAt: { type: string, format: date-time, nullable: true }
        alcoholTestResult: { $ref: '#/components/schemas/AlcoholTestResult', nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        version: { type: integer }
        etag: { type: string }
        parties:
          type: array
          items: { $ref: '#/components/schemas/RentalPartyResponse' }
        notaryEvaluation:
          allOf: [{ $ref: '#/components/schemas/NotaryEvaluationResponse' }]
          nullable: true
        contract:
          allOf: [{ $ref: '#/components/schemas/RentalContractResponse' }]
          nullable: true
        deposit:
          allOf: [{ $ref: '#/components/schemas/RentalDepositResponse' }]
          nullable: true
          description: Null si aún no se formalizó o si el alquiler es con conductor de la empresa (ver depositRequired).
        depositRequired:
          type: boolean
          description: false = alquiler con conductor de la empresa; no se exige ni cobra garantía (Devolución la trata como N/A). true por defecto.
        reservationCreditExcess:
          type: string
          description: Saldo a favor del crédito de reserva ("0.00" si no hay). Con garantía = deposit.reservationCreditExcess; con conductor de la empresa = todo el crédito pagado. Sin reembolso automático (pendiente Finanzas).
        reservationCredit:
          allOf: [{ $ref: '#/components/schemas/ReservationCreditResponse' }]
          nullable: true
          description: Solo en GET /rentals/{id}. Null = alquiler sin reserva de origen.
        companyDriverCharge:
          allOf: [{ $ref: '#/components/schemas/CompanyDriverChargeResponse' }]
          nullable: true
          description: Solo en GET /rentals/{id}. Cargo del servicio de conductor de la empresa (tarifa diaria × días); null si el alquiler no es con conductor de la empresa. No se persiste.
        extensions:
          type: array
          description: Solo en GET /rentals/{id}. Ampliaciones, la más reciente primero.
          items: { $ref: '#/components/schemas/RentalExtensionResponse' }

    RentalDocumentType:
      type: string
      enum: [LICENSE, ID_DOCUMENT, PROOF_OF_ADDRESS, BANK_STATEMENT, OTHER]
      description: Tipo de documento del cliente adjunto a un alquiler.

    RequestRentalDocumentUploadSessionRequest:
      type: object
      required: [companyId, branchId, documentType, contentType, contentLength]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        documentType: { $ref: '#/components/schemas/RentalDocumentType' }
        contentType:
          type: string
          description: MIME type del archivo (image/jpeg, image/png, application/pdf).
        contentLength:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Tamaño en bytes del archivo. Máximo 10 MB.

    DocumentUploadSessionResponse:
      type: object
      required: [uploadUrl, objectUrl, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: URL firmada de GCS para PUT directo (válida 15 minutos).
        objectUrl:
          type: string
          format: uri
          description: URL permanente del objeto en GCS. Pasar a POST /rentals/{id}/documents.
        expiresAt:
          type: string
          format: date-time

    RecordRentalDocumentRequest:
      type: object
      required: [companyId, branchId, documentType, objectUrl]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        documentType: { $ref: '#/components/schemas/RentalDocumentType' }
        objectUrl:
          type: string
          format: uri
          description: objectUrl devuelto por POST /rentals/{id}/documents/upload-url, ya subido a GCS.

    RentalDocumentResponse:
      type: object
      required: [id, rentalId, documentType, objectUrl, createdAt]
      properties:
        id: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        documentType: { $ref: '#/components/schemas/RentalDocumentType' }
        objectUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
