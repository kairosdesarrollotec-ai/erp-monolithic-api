openapi: 3.1.0
info:
  title: KAIROS ERP - Administracion API
  version: 0.3.0
  description: >
    Contrato del modulo Administracion (ADM-01..05, TR-07,
    PANTALLAS-V2-B-SOPORTE.md). Cierra el hallazgo ALTO de revalidacion
    PR#7 ("falta documentacion OpenAPI de Administracion") - hasta esta
    version el modulo no tenia ningun archivo de contrato, a diferencia
    de Reservas/Consultas/Transversal.

    Todas las rutas requieren `Authorization: Bearer <Firebase ID token>`
    y ademas exigen contexto vigente empresa/sede (companyId/branchId) -
    deny-by-default: sin una asignacion activa en esa empresa/sede, 403.

    ADM-02 (permisos): a partir de esta version, la matriz de
    roles/permisos SI se aplica de verdad para las 5 acciones de
    Administracion (MANAGE_USERS, VIEW_AUDIT, MANAGE_PARAMETERS,
    MANAGE_PERMISSIONS, MANAGE_NOTIFICATIONS) - ver
    AdminMatrixAuthorizationService. Reservas/Consultas siguen en sus
    policies estaticas (alcance de una iteracion siguiente).

    ADM-05/TR-07: guardar una plantilla de notificacion NO dispara ningun
    envio real todavia (TR-07 sigue sin construirse) - alcance
    deliberadamente acotado a texto/canal + versionado.
paths:
  /admin/users:
    get:
      operationId: listOrganizationUsers
      summary: ADM-01 - Bandeja de usuarios y asignaciones de la organizacion
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Todas las asignaciones (activas e inactivas) de la organizacion del admin
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationUser' }
        '403':
          description: Sin contexto vigente en esa empresa/sede, o rol sin MANAGE_USERS segun la matriz de permisos vigente
  /admin/companies:
    get:
      operationId: getOrganizationCompanies
      summary: ADM-01 - Empresas y sedes de la organizacion del admin (para el selector de "Agregar usuario")
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Empresas de la organizacion con sus sedes
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationCompany' }
        '403':
          description: Sin contexto vigente en esa empresa/sede, o rol sin MANAGE_USERS
  /admin/assignments:
    post:
      operationId: assignUserToCompany
      summary: ADM-01 - Agregar usuario (asigna empresa/sede/rol a una cuenta de Firebase ya existente)
      description: >
        Unica via para darle a un usuario cualquier permiso en KAIROS. Si
        el correo no existe todavia en Firebase Authentication, se crea
        la cuenta (initialPassword es obligatoria en ese caso). Si ya
        existe, se reutiliza el uid y initialPassword se ignora aunque se
        envie.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignUserRequest' }
      responses:
        '201':
          description: Asignacion creada o reactivada
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties: { id: { type: string, format: uuid } }
        '400':
          description: >
            COMPANY_BRANCH_NOT_IN_ORGANIZATION - la empresa/sede destino
            no pertenece a la organizacion del admin (IDOR) -
            INITIAL_PASSWORD_REQUIRED - el correo es nuevo y no se envio
            initialPassword
        '403':
          description: Sin contexto vigente, o rol sin MANAGE_USERS
  /admin/assignments/{id}/deactivate:
    post:
      operationId: deactivateAssignment
      summary: ADM-01 - Dar de baja una asignacion (nunca borra la fila, conserva el historial de auditoria)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, branchId]
              properties:
                companyId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
      responses:
        '204':
          description: Asignacion dada de baja
        '403':
          description: Sin contexto vigente, o rol sin MANAGE_USERS
        '404':
          description: La asignacion no existe o no pertenece a la organizacion del admin (IDOR)
        '409':
          description: >
            LAST_ADMINISTRATOR_CANNOT_BE_DEACTIVATED - es la unica
            asignacion con rol ADMINISTRACION activa en la organizacion;
            dejarla sin ninguna dejaria la organizacion sin nadie que
            pueda gestionar usuarios/permisos (hallazgo ALTO de
            revalidacion PR#7, "ultimo administrador").
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: ADM-04 - Auditoria administrativa (solo lectura)
      description: >
        Accesible a Administracion Y Auditoria (VIEW_AUDIT). `changes` es
        el `Json` libre tal como lo escribio cada modulo (Reservas,
        Consultas, ADM-01) - no un diff campo-a-campo estructurado, ese
        detalle no existe hoy en los eventos ya guardados.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: actorUid, in: query, required: false, schema: { type: string } }
        - { name: entityType, in: query, required: false, schema: { type: string } }
        - { name: dateFrom, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Eventos de auditoria de la organizacion, filtrados
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
        '403':
          description: Sin contexto vigente, o rol sin VIEW_AUDIT (ni Administracion ni Auditoria)
  /admin/parameters/reservation-deposit-policy:
    get:
      operationId: getReservationDepositPolicy
      summary: ADM-03 - Version vigente + historial del monto de reserva
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Version vigente y su historial completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDepositPolicyResponse' }
        '403':
          description: Sin contexto vigente, o rol sin MANAGE_PARAMETERS
    post:
      operationId: updateReservationDepositPolicy
      summary: ADM-03 - Guardar cambios (siempre INSERTA una version nueva, nunca edita la anterior)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReservationDepositPolicyRequest' }
      responses:
        '201':
          description: Version nueva creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDepositPolicyItem' }
        '400':
          description: 'INVALID_AMOUNT - el monto debe ser un numero positivo'
        '403':
          description: Sin contexto vigente, o rol sin MANAGE_PARAMETERS
  /admin/permissions:
    get:
      operationId: getRolePermissionMatrix
      summary: ADM-02 - Matriz de roles/permisos vigente + catalogo de acciones
      description: >
        Si la organizacion nunca guardo una version propia, devuelve la
        version 0 implicita construida a partir de las policies estaticas
        existentes (`*-role-policy.ts`) - lo que el sistema ya hace hoy,
        no una matriz vacia.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: scopeCompanyId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Ambito a mostrar (aditivo 0.2.1); omitido = toda la organizacion. Si ese ambito no tiene version propia, hereda la de arriba (`scope` dice de donde sale).' }
        - { name: scopeBranchId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Requiere scopeCompanyId' }
      responses:
        '200':
          description: Matriz vigente + catalogo de acciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePermissionMatrixResponse' }
        '400':
          description: 'MATRIX_SCOPE_INVALID (sede sin empresa) o COMPANY_BRANCH_NOT_IN_ORGANIZATION (ambito ajeno)'
        '403':
          description: Sin contexto vigente, o rol sin MANAGE_PERMISSIONS
    post:
      operationId: saveRolePermissionMatrix
      summary: ADM-02 - Guardar una foto completa nueva de la matriz (siempre INSERTA, nunca edita filas existentes)
      description: >
        Valida que la matriz enviada sea completa (una entrada por cada
        combinacion rol x accion del catalogo) y que no habilite a la vez
        un par de acciones incompatibles (segregacion de funciones,
        INCOMPATIBLE_ACTION_PAIRS). A partir de esta version, esta
        matriz SI se consulta en tiempo real para autorizar las 5
        acciones de Administracion (antes solo se guardaba/visualizaba).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRolePermissionMatrixRequest' }
      responses:
        '201':
          description: Nueva version guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePermissionMatrixResponse' }
        '400':
          description: 'INCOMPLETE_MATRIX - falta una entrada rol x accion del catalogo'
        '403':
          description: Sin contexto vigente, o rol sin MANAGE_PERMISSIONS
        '409':
          description: >
            INCOMPATIBLE_PERMISSIONS - segregacion de funciones violada
            (el codigo real del back es INCOMPATIBLE_PERMISSIONS; antes se
            documentaba como INCOMPATIBLE_PERMISSION_COMBINATION) -
            LAST_ADMINISTRATOR_ROLE - la nueva foto dejaria a la organizacion
            sin ningun rol activo con asignaciones y con ADMIN.MANAGE_PERMISSIONS
            y ADMIN.MANAGE_USERS - MATRIX_VERSION_CONFLICT - otra persona
            guardo al mismo tiempo (recargar y reintentar)
  /admin/roles:
    get:
      operationId: listRoles
      summary: ADM-02 - Listar roles de la organizacion (dinamicos)
      description: >
        Los roles son datos, no un enum: el administrador los crea,
        renombra y desactiva. Los 8 roles historicos se siembran como
        roles de sistema (`isSystem: true`, con `key` estable).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Roles de la organizacion
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
        '403':
          description: Sin contexto vigente, o sin permiso ADMIN.MANAGE_PERMISSIONS
    post:
      operationId: createRole
      summary: ADM-02 - Crear un rol (nace con cero permisos)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400':
          description: 'ROLE_NAME_INVALID - vacio o mas de 60 caracteres'
        '403':
          description: Sin contexto vigente, o sin permiso ADMIN.MANAGE_PERMISSIONS
        '409':
          description: 'ROLE_NAME_TAKEN - ya existe un rol con ese nombre (sin distinguir mayusculas) en la organizacion'
  /admin/roles/{id}:
    patch:
      operationId: renameRole
      summary: ADM-02 - Renombrar un rol (If-Match con la version del rol)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'ETag = version del rol' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameRoleRequest' }
      responses:
        '200':
          description: Rol renombrado
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400':
          description: ROLE_NAME_INVALID
        '403':
          description: 'Sin contexto/permiso, o ROLE_NOT_EDITABLE (el rol PLATFORM_ADMIN no se renombra)'
        '404':
          description: El rol no existe o no pertenece a la organizacion (IDOR)
        '409':
          description: ROLE_NAME_TAKEN
        '412':
          description: VERSION_CONFLICT - la version del rol cambio (If-Match desactualizado)
        '428':
          description: If-Match ausente
  /admin/roles/{id}/deactivate:
    post:
      operationId: deactivateRole
      summary: ADM-02 - Desactivar un rol (nunca borra; conserva historial)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, branchId]
              properties:
                companyId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
      responses:
        '200':
          description: Rol desactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403':
          description: 'Sin contexto/permiso, o ROLE_NOT_EDITABLE (PLATFORM_ADMIN)'
        '404':
          description: El rol no existe o no pertenece a la organizacion (IDOR)
        '409':
          description: >
            ROLE_HAS_ACTIVE_ASSIGNMENTS - hay asignaciones activas con ese
            rol - LAST_ADMINISTRATOR_ROLE - desactivarlo dejaria la
            organizacion sin ningun rol activo con asignaciones y con
            ADMIN.MANAGE_PERMISSIONS y ADMIN.MANAGE_USERS
        '412':
          description: VERSION_CONFLICT
        '428':
          description: If-Match ausente
  /me/permissions:
    get:
      operationId: getMyPermissions
      summary: Permisos efectivos del usuario autenticado en el contexto de trabajo vigente
      description: >
        Unica fuente que usa el front para mostrar/ocultar modulos y
        acciones; el back sigue autorizando cada comando por su cuenta.
        Resuelve la matriz del ambito mas especifico (sede > empresa >
        organizacion); sin entrada = denegado. La respuesta cambia solo
        cuando cambia `matrixVersion` o la asignacion.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Permisos efectivos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissionsResponse' }
        '403':
          description: Sin asignacion vigente en esa empresa/sede
  /admin/notification-templates:
    get:
      operationId: getNotificationTemplates
      summary: ADM-05 - Plantillas de notificacion (vigente + historial) por evento del catalogo
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Una entrada por cada evento del catalogo, con variables y canales permitidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplatesResponse' }
        '403':
          description: Sin contexto vigente, o rol sin MANAGE_NOTIFICATIONS
    post:
      operationId: saveNotificationTemplate
      summary: ADM-05 - Guardar plantilla (siempre INSERTA una version nueva)
      description: >
        Rechaza cualquier variable `{...}` que no este en la lista
        blanca (sin datos sensibles en logs ni mensajes). ALCANCE REAL:
        solo guarda texto/canal - no dispara ningun envio (TR-07
        pendiente).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveNotificationTemplateRequest' }
      responses:
        '201':
          description: Version nueva creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateItem' }
        '400':
          description: 'UNKNOWN_EVENT_TYPE | NO_CHANNEL_SELECTED | variable no permitida en el cuerpo'
        '403':
          description: Sin contexto vigente, o rol sin MANAGE_NOTIFICATIONS
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: 'Firebase ID token' }
  schemas:
    RoleRef:
      type: object
      required: [id, name, key]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 'Nombre visible, editable por el administrador' }
        key:
          type: [string, 'null']
          description: >
            Codigo estable de los roles de sistema (ADMINISTRACION,
            AUDITORIA, CAMPO, FINANZAS, FRONT_OFFICE, GERENCIA,
            PLATFORM_ADMIN, RRHH); null en roles creados a mano. El front
            NO debe decidir acceso por `key`: usa /me/permissions.
    Role:
      type: object
      required: [id, name, key, isSystem, active, version, assignmentCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key: { type: [string, 'null'] }
        isSystem: { type: boolean }
        active: { type: boolean }
        version: { type: integer, description: 'Concurrencia optimista (ETag/If-Match)' }
        assignmentCount: { type: integer, minimum: 0, description: 'Asignaciones activas con este rol' }
    CreateRoleRequest:
      type: object
      required: [companyId, branchId, name]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
    RenameRoleRequest:
      type: object
      required: [companyId, branchId, name]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
    EffectivePermission:
      type: object
      required: [module, action]
      properties:
        module: { $ref: '#/components/schemas/PermissionModule' }
        action: { type: string }
    EffectivePermissionsResponse:
      type: object
      required: [role, matrixVersion, permissions]
      properties:
        role: { $ref: '#/components/schemas/RoleRef' }
        matrixVersion: { type: integer }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/EffectivePermission' }
    OrganizationBranch:
      type: object
      required: [branchId, branchName]
      properties:
        branchId: { type: string, format: uuid }
        branchName: { type: string }
    OrganizationCompany:
      type: object
      required: [companyId, companyName, branches]
      properties:
        companyId: { type: string, format: uuid }
        companyName: { type: string }
        branches:
          type: array
          items: { $ref: '#/components/schemas/OrganizationBranch' }
    OrganizationUser:
      type: object
      required: [id, firebaseUid, email, companyId, companyName, branchId, branchName, role, active, mfaEnrolled]
      properties:
        id: { type: string, format: uuid }
        firebaseUid: { type: string }
        email: { type: [string, 'null'] }
        companyId: { type: string, format: uuid }
        companyName: { type: string }
        branchId: { type: string, format: uuid }
        branchName: { type: string }
        role: { $ref: '#/components/schemas/RoleRef' }
        active: { type: boolean }
        mfaEnrolled: { type: boolean }
    AssignUserRequest:
      type: object
      required: [companyId, branchId, targetEmail, targetCompanyId, targetBranchId, targetRoleId]
      properties:
        companyId: { type: string, format: uuid, description: 'Empresa vigente del admin (contexto de trabajo)' }
        branchId: { type: string, format: uuid, description: 'Sede vigente del admin (contexto de trabajo)' }
        targetEmail: { type: string, format: email }
        targetCompanyId: { type: string, format: uuid, description: 'Empresa destino de la asignacion' }
        targetBranchId: { type: string, format: uuid, description: 'Sede destino de la asignacion' }
        targetRoleId: { type: string, format: uuid, description: 'Rol activo de la organizacion (GET /admin/roles)' }
        initialPassword:
          type: string
          minLength: 8
          description: >
            Contraseña inicial del usuario. Obligatoria solo cuando el
            correo todavia no existe en Firebase (el backend responde
            400 INITIAL_PASSWORD_REQUIRED si falta en ese caso); se
            ignora si el correo ya existe. TR-02 fuerza el cambio en el
            primer login.
    AuditEvent:
      type: object
      required: [id, actorFirebaseUid, actorEmail, entityType, entityId, action, changes, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorFirebaseUid: { type: [string, 'null'] }
        actorEmail: { type: [string, 'null'] }
        entityType: { type: string }
        entityId: { type: string }
        action: { type: string }
        changes: { type: [object, 'null'] }
        createdAt: { type: string, format: date-time }
    ReservationDepositPolicyItem:
      type: object
      required: [version, amount, currency, effectiveFrom]
      properties:
        version: { type: integer }
        amount: { type: string, description: 'Numero decimal como string, ej. "350.00"' }
        currency: { type: string, enum: [PEN, USD] }
        effectiveFrom: { type: [string, 'null'], format: date-time }
    ReservationDepositPolicyResponse:
      type: object
      required: [current, history]
      properties:
        current: { $ref: '#/components/schemas/ReservationDepositPolicyItem' }
        history:
          type: array
          items: { $ref: '#/components/schemas/ReservationDepositPolicyItem' }
    UpdateReservationDepositPolicyRequest:
      type: object
      required: [companyId, branchId, amount, currency]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string, enum: [PEN, USD] }
    PermissionModule:
      type: string
      description: >
        Modulos cuyas acciones administra la matriz ADM-02 (PERMISSION_MODULES
        del dominio). 0.3.0: se declaran RETURN, FLEET, CUSTOMER, TEMPLATE,
        PAYMENT y REPORT, que el backend ya devolvia en el catalogo. Acciones
        de Reserva incluidas en el catalogo: READ_LIST, READ_DETAIL, CREATE,
        REGISTER_PAYMENT, REGISTER_DOCUMENTS, CONFIRM,
        CANCEL_CUSTOMER_REQUESTED_CHANGE, CANCEL_NO_SHOW, FLAG_SALE,
        RESOLVE_SALE y CHANGE_VEHICLE. Una version ya guardada que no incluya
        una accion nueva la deniega hasta que se guarde la matriz (deny-by-default).
      enum: [RESERVATION, INQUIRY, ADMIN, RENTAL, INCIDENT, RETURN, FLEET, CUSTOMER, RECRUITMENT, TEMPLATE, HR_ADMINISTRATION, PAYMENT, REPORT]
    RolePermissionEntry:
      type: object
      required: [roleId, module, action, allowed]
      properties:
        roleId: { type: string, format: uuid }
        module: { $ref: '#/components/schemas/PermissionModule' }
        action: { type: string }
        allowed: { type: boolean }
    PermissionActionDescriptor:
      type: object
      required: [module, action, label]
      properties:
        module: { $ref: '#/components/schemas/PermissionModule' }
        action: { type: string }
        label: { type: string }
    RolePermissionMatrixResponse:
      type: object
      required: [version, entries, actionCatalog]
      properties:
        version: { type: integer }
        scope:
          type: object
          description: 'Ambito de la version devuelta; companyId/branchId null = aplica a toda la organizacion/empresa'
          properties:
            companyId: { type: [string, 'null'], format: uuid }
            branchId: { type: [string, 'null'], format: uuid }
        entries:
          type: array
          items: { $ref: '#/components/schemas/RolePermissionEntry' }
        actionCatalog:
          type: array
          items: { $ref: '#/components/schemas/PermissionActionDescriptor' }
    SaveRolePermissionMatrixRequest:
      type: object
      required: [companyId, branchId, entries]
      properties:
        companyId: { type: string, format: uuid, description: 'Contexto de trabajo del admin' }
        branchId: { type: string, format: uuid, description: 'Contexto de trabajo del admin' }
        scopeCompanyId: { type: [string, 'null'], format: uuid, description: 'Ambito de la nueva version; omitido/null = toda la organizacion' }
        scopeBranchId: { type: [string, 'null'], format: uuid, description: 'Ambito de la nueva version; omitido/null = toda la empresa (o la organizacion si scopeCompanyId tambien es null)' }
        entries:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RolePermissionEntry' }
    NotificationChannel:
      type: string
      enum: [EMAIL, PUSH, SMS]
    NotificationTemplateItem:
      type: object
      required: [eventType, version, channels, body]
      properties:
        eventType: { type: string }
        version: { type: integer }
        channels:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
        body: { type: string, maxLength: 500 }
    NotificationTemplateEntry:
      type: object
      required: [eventType, label, current, history]
      properties:
        eventType: { type: string }
        label: { type: string }
        current: { oneOf: [{ $ref: '#/components/schemas/NotificationTemplateItem' }, { type: 'null' }] }
        history:
          type: array
          items: { $ref: '#/components/schemas/NotificationTemplateItem' }
    NotificationTemplatesResponse:
      type: object
      required: [templates, allowedVariables, channels]
      properties:
        templates:
          type: array
          items: { $ref: '#/components/schemas/NotificationTemplateEntry' }
        allowedVariables:
          type: array
          items: { type: string }
        channels:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
    SaveNotificationTemplateRequest:
      type: object
      required: [companyId, branchId, eventType, channels, body]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        eventType: { type: string }
        channels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NotificationChannel' }
        body: { type: string, maxLength: 500 }
