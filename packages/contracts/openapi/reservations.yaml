openapi: 3.1.0
info:
  title: KAIROS ERP - Reservations API
  version: 0.5.0
  description: >
    Contrato del modulo Reserva (HU-27, TDD-RES-001.md seccion 11).
    Primer corte: crear, registrar pago/documentos, confirmar (bloqueo
    atomico), cancelar por cambio solicitado, y las consultas de bandeja
    (RES-01) y detalle (RES-04/RES-05). No incluye todavia resolucion de
    venta de vehiculo (RES-06/RES-07) ni conversion a alquiler (RES-08,
    ALQ-02) - fuera de alcance de este primer corte, ver tarea HU-27 en
    ClickUp. No expone ningun comando de "reprogramar" (BR-RES-003,
    deliberado).

    Cambios 0.5.0: la disponibilidad del vehiculo (VEHICLE_NOT_AVAILABLE) usa
    una regla unica de solape para crear y confirmar: vehicle_commitments
    ACTIVE|CONSOLIDATED (alquileres y reservas confirmadas) y reservas no
    terminales. Al crear responde 422 y al confirmar 409, ambos con
    {statusCode, code: VEHICLE_NOT_AVAILABLE, detail} en espanol. Para saber
    de antemano que vehiculos estan libres: GET /fleet/vehicles?availableFrom&availableTo.

    Hallazgos de revision PR#6 corregidos en esta version (0.2.0):
    formato UUID en todos los identificadores (antes `type: string`
    libre), `branchId` obligatorio en la bandeja (antes solo companyId -
    el bug que vaciaba la bandeja vivia tambien aqui, el contrato nunca
    exigio una sede), paginacion por cursor, bloques `required` en
    ReservationResponse (antes ninguna propiedad era obligatoria segun el
    contrato, aunque la implementacion siempre las devolvia), y los
    codigos de error de concurrencia optimista corregidos: 428 (If-Match
    ausente) y 412 (version no coincide) en vez de 400/409 - ver
    reservation-errors.ts para el detalle de cada hallazgo.
paths:
  /reservations:
    post:
      operationId: createReservation
      deprecated: true
      summary: 'DESHABILITADO - crear una reserva se hace con POST /inquiries/{id}/commands/convert-to-reservation'
      description: >
        Revalidacion PR#7 (hallazgo CRITICO "cardinalidad Inquiry ->
        Reservation"): este endpoint permitia crear una reserva citando
        una consulta en cualquier estado sin transicionarla (varias
        reservas por consulta, reservas de consultas cerradas). Decision
        interina (docs/conflicts/CONFLICT-CON-001.md, pendiente de
        aprobacion): la unica via es convert-to-reservation de Consulta.
        Este endpoint conserva autenticacion, contexto y rol y responde 409
        INQUIRY_CONVERSION_REQUIRED.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
      responses:
        '403':
          description: Empresa/sede no autorizada, o ROLE_NOT_ALLOWED
        '409':
          description: 'INQUIRY_CONVERSION_REQUIRED - usar POST /inquiries/{inquiryId}/commands/convert-to-reservation'
    get:
      operationId: listReservations
      summary: Bandeja de reservas (RES-01)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: >
            Hallazgo critico de revision PR#6 ("bug de bandeja: companyId
            enviado como branchId"): antes este parametro no existia en el
            contrato - el controller reutilizaba companyId tambien como
            branchId, vaciando siempre la bandeja. Ahora es su propia sede
            obligatoria (TR-05/RES-01 nunca operan sin una sede concreta
            seleccionada).
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ReservationStatus' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursorCreatedAt, in: query, required: false, schema: { type: string, format: date-time }, description: 'Junto con cursorId, continua la pagina anterior' }
        - { name: cursorId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservationResponse' }
        '400':
          description: cursorCreatedAt y cursorId deben enviarse juntos
        '403':
          description: Empresa/sede no autorizada para el usuario
  /reservations/{id}:
    get:
      operationId: getReservation
      summary: Detalle de una reserva (RES-04/RES-05)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
        '403':
          description: Empresa/sede no autorizada para el usuario
        '404':
          description: >
            Reserva no encontrada en el scope del usuario (hallazgo
            critico "IDOR entre sedes/empresas": una reserva de otra
            sede/empresa de la misma organizacion tambien devuelve 404,
            nunca 403, para no confirmar a quien consulta que el id
            existe en otro lado)
  /reservations/{id}/commands/register-payment:
    post:
      operationId: registerReservationPayment
      summary: Marca el pago del monto de reserva vigente (RES-P09, BR-RES-001)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'ETag fuerte con la version vigente de la reserva, ej. "3"' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandScopeRequest' }
      responses:
        '200': { description: Requisito de pago registrado, content: { application/json: { schema: { $ref: '#/components/schemas/ReservationResponse' } } } }
        '404': { description: Reserva no encontrada en el scope del usuario }
        '409': { description: 'RESERVATION_STATE_CONFLICT - la reserva ya no esta en DRAFT' }
        '412': { description: 'RESERVATION_VERSION_CONFLICT - If-Match no coincide con la version actual' }
        '428': { description: 'IF_MATCH_REQUIRED - falta el header If-Match' }
  /reservations/{id}/commands/register-documents:
    post:
      operationId: registerReservationDocuments
      summary: Marca documentos/contrato completos (RES-P10)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandScopeRequest' }
      responses:
        '200': { description: Requisito de documentos registrado, content: { application/json: { schema: { $ref: '#/components/schemas/ReservationResponse' } } } }
        '404': { description: Reserva no encontrada en el scope del usuario }
        '409': { description: 'RESERVATION_STATE_CONFLICT - la reserva ya no esta en DRAFT' }
        '412': { description: RESERVATION_VERSION_CONFLICT }
        '428': { description: IF_MATCH_REQUIRED }
  /reservations/{id}/commands/confirm:
    post:
      operationId: confirmReservation
      summary: Confirma la reserva - bloqueo atomico del vehiculo (RES-P11, BR-RES-009)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandScopeRequest' }
      responses:
        '200': { description: Reserva confirmada, vehiculo bloqueado, content: { application/json: { schema: { $ref: '#/components/schemas/ReservationResponse' } } } }
        '404': { description: Reserva no encontrada en el scope del usuario }
        '409': { description: 'VEHICLE_NOT_AVAILABLE (el detail indica las fechas ocupadas, dd/mm/yyyy) o RESERVATION_STATE_CONFLICT (la reserva ya no esta en DRAFT)' }
        '412': { description: RESERVATION_VERSION_CONFLICT }
        '422': { description: REQUIREMENTS_INCOMPLETE - falta pago o documentos }
        '428': { description: IF_MATCH_REQUIRED }
  /reservations/{id}/commands/cancel:
    post:
      operationId: cancelReservation
      summary: Cancela por cambio solicitado por el cliente (BR-RES-003 - nunca una reprogramacion)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelReservationRequest' }
      responses:
        '200': { description: Reserva cancelada, content: { application/json: { schema: { $ref: '#/components/schemas/ReservationResponse' } } } }
        '404': { description: Reserva no encontrada en el scope del usuario }
        '409': { description: 'RESERVATION_STATE_CONFLICT - la reserva ya esta en un estado terminal (CANCELLED/CONVERTED)' }
        '412': { description: RESERVATION_VERSION_CONFLICT }
        '428': { description: IF_MATCH_REQUIRED }

  /reservations/{id}/documents/upload-url:
    post:
      operationId: requestReservationDocumentUploadSession
      summary: Obtener URL firmada de GCS para subir un comprobante de pago u otro documento (Bug-03)
      description: >
        Devuelve una URL de carga firmada de GCS. Después de subir, llamar a
        POST /reservations/{id}/documents para registrar el documento.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestReservationDocumentUploadSessionRequest' }
      responses:
        '201':
          description: URL de carga generada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDocumentUploadSessionResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: No autorizado }
        '404': { description: Reserva no encontrada }

  /reservations/{id}/documents:
    post:
      operationId: recordReservationDocument
      summary: Registrar un documento ya subido a GCS (comprobante de pago, etc.) (Bug-03)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordReservationDocumentRequest' }
      responses:
        '201':
          description: Documento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDocumentResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: No autorizado }
        '404': { description: Reserva no encontrada }
    get:
      operationId: listReservationDocuments
      summary: Listar documentos adjuntos a una reserva
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: companyId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: branchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservationDocumentResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: No autorizado }
        '404': { description: Reserva no encontrada }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: 'Firebase ID token' }
  schemas:
    ReservationStatus:
      type: string
      enum: [DRAFT, CONFIRMED, PENDING_SALE_RESOLUTION, CONVERTED, CANCELLED]
    ChannelMode:
      type: string
      enum: [PRESENCIAL, VIRTUAL]
    CommandScopeRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
    CreateReservationRequest:
      allOf:
        - { $ref: '#/components/schemas/CommandScopeRequest' }
        - type: object
          required: [customerId, vehicleId, channelMode, startAt, endAt, requiredPaymentAmount, currency, paymentPolicyVersion]
          properties:
            inquiryId: { type: string, format: uuid, description: 'CONFLICT-CON-001: opcional. Si se omite, se crea una reserva directa sin consulta previa.' }
            customerId: { type: string, format: uuid }
            vehicleId: { type: string, format: uuid }
            channelMode: { $ref: '#/components/schemas/ChannelMode' }
            startAt: { type: string, format: date-time }
            endAt: { type: string, format: date-time }
            requiredPaymentAmount:
              type: string
              description: >
                Importe de pago requerido en formato decimal (ej. "300.00"). Si la reserva llega a
                alquiler, este monto se TRASLADA ÍNTEGRO a la garantía del alquiler y solo se cobra la
                diferencia (P0-03 opción a; ver rentals.yaml formalize-contract). Una reserva cancelada
                (incluye no-show) no traslada nada.
            currency: { type: string }
            paymentPolicyVersion: { type: integer, minimum: 1 }
    CancelReservationRequest:
      allOf:
        - { $ref: '#/components/schemas/CommandScopeRequest' }
        - type: object
          required: [reason]
          properties:
            reason: { type: string, enum: [CUSTOMER_REQUESTED_CHANGE, NO_SHOW] }
            note: { type: string }
    ReservationResponse:
      type: object
      required: [id, status, channelMode, version, customer, vehicle, startAt, endAt, requiredPayment, requirements, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        channelMode: { $ref: '#/components/schemas/ChannelMode' }
        version: { type: integer }
        customer:
          type: object
          required: [id, name]
          properties: { id: { type: string, format: uuid }, name: { type: string } }
        vehicle:
          type: object
          required: [id, plate, label]
          properties: { id: { type: string, format: uuid }, plate: { type: string }, label: { type: string } }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        requiredPayment:
          type: object
          required: [amount, currency]
          properties: { amount: { type: string }, currency: { type: string } }
        requirements:
          type: object
          required: [paymentValidatedAt, documentsCompletedAt]
          properties:
            paymentValidatedAt: { type: string, format: date-time, nullable: true }
            documentsCompletedAt: { type: string, format: date-time, nullable: true }
        missingRequirements:
          type: array
          items: { type: string }
        confirmedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ReservationDocumentType:
      type: string
      enum: [PAYMENT_VOUCHER, ID_DOCUMENT, OTHER]
      description: Tipo de documento adjunto a una reserva.

    RequestReservationDocumentUploadSessionRequest:
      type: object
      required: [companyId, branchId, documentType, contentType, contentLength]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        documentType: { $ref: '#/components/schemas/ReservationDocumentType' }
        contentType:
          type: string
          description: MIME type del archivo (image/jpeg, image/png, application/pdf).
        contentLength:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Tamaño en bytes. Máximo 10 MB.

    ReservationDocumentUploadSessionResponse:
      type: object
      required: [uploadUrl, objectUrl, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: URL firmada de GCS para PUT directo (válida 15 minutos).
        objectUrl:
          type: string
          format: uri
          description: URL permanente del objeto. Pasar a POST /reservations/:id/documents.
        expiresAt: { type: string, format: date-time }

    RecordReservationDocumentRequest:
      type: object
      required: [companyId, branchId, documentType, objectUrl]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        documentType: { $ref: '#/components/schemas/ReservationDocumentType' }
        objectUrl: { type: string, format: uri }

    ReservationDocumentResponse:
      type: object
      required: [id, reservationId, documentType, objectUrl, createdAt]
      properties:
        id: { type: string, format: uuid }
        reservationId: { type: string, format: uuid }
        documentType: { $ref: '#/components/schemas/ReservationDocumentType' }
        objectUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
