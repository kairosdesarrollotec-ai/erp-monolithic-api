openapi: 3.1.0
info:
  title: KAIROS ERP - Transversal API
  version: 0.1.0
  description: >
    Contrato del modulo Transversal. Primer endpoint: registro de intentos
    de login (TR-01), auditoria reutilizando la tabla audit_events
    (TDD-KAIROS-TRANSVERSAL.md 7.3). El login en si lo resuelve Firebase
    Authentication directamente desde el frontend (TDD 8.3) - este backend
    solo registra el resultado para auditoria.

    NOTA (PR#4, corregido el hallazgo medio "OpenAPI incompleto"):
    /users/me/activation-status y /users/me/complete-activation (TR-02,
    HU-21) ya se documentan aqui.

    NOTA IMPORTANTE (PR#4, hallazgo critico "'fijar contexto' no persiste
    ningun contexto"): esta API es stateless (SDD-KAIROS-TRANSVERSAL.md
    9.3) - POST /users/me/work-context valida la combinacion empresa/sede
    contra las asignaciones vigentes del usuario y deja un evento
    auditable, pero NO crea una sesion ni un contexto activo del lado del
    servidor. El cliente debe reenviar companyId/branchId en cada request
    subsecuente que lo necesite, y cada endpoint que reciba esos valores
    los re-valida de forma independiente contra las asignaciones vigentes
    del usuario (deny-by-default) - nunca confia en una seleccion previa.
paths:
  /audit/login-attempts:
    post:
      operationId: recordLoginAttempt
      summary: Registra un intento de inicio de sesion (TR-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordLoginAttemptRequest'
      responses:
        '204':
          description: Evento de auditoria registrado
        '400':
          description: Payload invalido
  /users/me/assignments:
    get:
      operationId: getWorkContextAssignments
      summary: Lista las empresas/sedes autorizadas para el usuario autenticado (TR-05)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            Asignaciones vigentes del usuario (active=true, dentro de
            [validFrom, validUntil)) - puede ser una lista vacia. Una
            asignacion revocada o caducada nunca aparece aqui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkContextAssignmentsResponse'
        '401':
          description: Token de Firebase ausente o invalido
  /users/me/work-context:
    post:
      operationId: selectWorkContext
      summary: Valida y audita la seleccion de contexto de trabajo (empresa/sede) de TR-05
      description: >
        NO fija una sesion/contexto activo del lado del servidor (API
        stateless, ver nota de la seccion "description" de este
        documento). Valida la combinacion contra las asignaciones
        vigentes del usuario y registra el evento auditable del punto 11
        del contrato TR-05.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectWorkContextRequest'
      responses:
        '204':
          description: Combinacion valida y vigente - evento de auditoria registrado
        '400':
          description: Payload invalido (companyId/branchId ausentes o con formato distinto de UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
        '401':
          description: Token de Firebase ausente o invalido
        '403':
          description: >
            La combinacion companyId/branchId no es una asignacion vigente
            del usuario (BR-ORG-002) - nunca se acepta un contexto que el
            usuario no tiene autorizado o cuya asignacion esta
            revocada/caducada, aunque lo haya enviado el cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
  /users/me/activation-status:
    get:
      operationId: getActivationStatus
      summary: Estado de primer acceso del usuario autenticado (TR-02, HU-21)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            Si el usuario todavia no tiene UserProfile (cuentas previas a
            este modelo), se asume que no requiere activacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationStatusResponse'
        '401':
          description: Token de Firebase ausente o invalido
  /users/me/complete-activation:
    post:
      operationId: completeActivation
      summary: Marca completado el flujo de activacion (TR-02, HU-21)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Activacion marcada como completa
        '401':
          description: Token de Firebase ausente o invalido
  /users/me/dashboard:
    get:
      operationId: getDashboard
      summary: >
        Resuelve el rol del usuario para el contexto elegido y el estado
        del tablero (TR-06).
      description: >
        PROVISIONAL (HU-24/TR-06, hallazgo medio de revision PR#5
        "dashboard siempre EMPTY"): esta operacion es infraestructura de
        enrutamiento por rol, no la funcionalidad completa de TR-06. Los
        modulos de dominio (Consulta, Reserva, Alquiler, Devolucion,
        Reclutamiento, Administracion de Personal) todavia no existen,
        asi que hoy `state` solo puede ser EMPTY - no hay tareas ni
        alertas reales que calcular. No se cierra HU-24/TR-06 como
        funcionalidad terminada mientras este endpoint no calcule datos
        reales por rol.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rol resuelto y estado del tablero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: Payload invalido (companyId/branchId ausentes o con formato distinto de UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
        '401':
          description: Token de Firebase ausente o invalido
        '403':
          description: >
            La combinacion companyId/branchId no es una asignacion vigente
            del usuario (BR-ORG-002) - nunca se acepta un contexto que el
            usuario no tiene autorizado o cuya asignacion esta
            revocada/caducada, aunque lo haya enviado el cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ID token de Firebase Authentication, enviado como "Authorization Bearer <idToken>"
  schemas:
    RecordLoginAttemptRequest:
      type: object
      required: [email, outcome]
      properties:
        email:
          type: string
          format: email
        outcome:
          type: string
          enum: [SUCCESS, FAILURE]
        reason:
          type: string
          maxLength: 200
          description: Motivo del fallo, nunca la contrasena.
    WorkContextAssignmentsResponse:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/WorkContextAssignment'
    WorkContextAssignment:
      type: object
      required: [companyId, companyName, branchId, branchName, role]
      properties:
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        role:
          $ref: '#/components/schemas/WorkerRole'
    WorkerRole:
      type: string
      description: >
        PROVISIONAL (HU-24/TR-06) - modelo minimo de rol solo para enrutar
        al tablero correcto. El modelo definitivo (matriz rol-accion-
        empresa-sede versionada) vive en ADM-02, todavia no construido.
      enum:
        - ADMINISTRACION
        - AUDITORIA
        - CAMPO
        - FINANZAS
        - FRONT_OFFICE
        - GERENCIA
        - RRHH
    DashboardResponse:
      type: object
      required: [role, state]
      description: >
        Hallazgo medio de revision PR#5 ("OpenAPI provisional sin
        estrategia de evolucion"): `state` se modela como un enum
        abierto a crecer de forma aditiva. Cuando exista un estado con
        datos reales (p.ej. READY con tareas/alertas por rol), se agrega
        como un nuevo valor del enum mas un campo opcional nuevo (p.ej.
        `tasks`) - nunca reemplazando o removiendo EMPTY ni cambiando el
        tipo de `state`, para no romper clientes generados contra este
        contrato. La forma exacta de READY se define cuando el modulo de
        dominio correspondiente exista (fuente BDD/SDD/TDD del modulo),
        no se inventa aqui.
      properties:
        role:
          $ref: '#/components/schemas/WorkerRole'
        state:
          type: string
          description: >
            PROVISIONAL: unico valor soportado hoy. Ver descripcion de
            DashboardResponse para la estrategia de evolucion.
          enum: [EMPTY]
    SelectWorkContextRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
    ActivationStatusResponse:
      type: object
      required: [requiresPasswordChange, requiresMfaEnrollment]
      properties:
        requiresPasswordChange:
          type: boolean
        requiresMfaEnrollment:
          type: boolean
    NestErrorResponse:
      description: >
        Forma real y actual del error (no problem+json todavia): el
        formato default que NestJS serializa para toda HttpException sin
        un ExceptionFilter global (no existe uno en este backend por
        ahora). Migrar a application/problem+json (RFC 9457, ya usado
        como convencion objetivo en TDD-KAIROS-*.md) es un cambio
        transversal a todos los modulos, fuera de alcance de PR#4 -
        pendiente como su propio cambio.
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
