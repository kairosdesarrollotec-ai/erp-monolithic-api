openapi: 3.1.0
info:
  title: KAIROS ERP - Transversal API
  version: 0.1.0
  description: >
    Contrato del modulo Transversal. Primer endpoint: registro de intentos
    de login (TR-01), auditoria reutilizando la tabla audit_events
    (TDD-KAIROS-TRANSVERSAL.md 7.3). El login en si lo resuelve Firebase
    Authentication directamente desde el frontend (TDD 8.3) - este backend
    solo registra el resultado para auditoria.

    NOTA (PR#4, corregido el hallazgo medio "OpenAPI incompleto"):
    /users/me/activation-status y /users/me/complete-activation (TR-02,
    HU-21) ya se documentan aqui.

    NOTA IMPORTANTE (PR#4, hallazgo critico "'fijar contexto' no persiste
    ningun contexto"): esta API es stateless (SDD-KAIROS-TRANSVERSAL.md
    9.3) - POST /users/me/work-context valida la combinacion empresa/sede
    contra las asignaciones vigentes del usuario y deja un evento
    auditable, pero NO crea una sesion ni un contexto activo del lado del
    servidor. El cliente debe reenviar companyId/branchId en cada request
    subsecuente que lo necesite, y cada endpoint que reciba esos valores
    los re-valida de forma independiente contra las asignaciones vigentes
    del usuario (deny-by-default) - nunca confia en una seleccion previa.
paths:
  /health:
    get:
      operationId: checkHealth
      summary: Liveness/readiness probe de infraestructura
      x-internal: true
      description: >
        Endpoint de infraestructura para health checks de plataforma (Kubernetes,
        Cloud Run, load balancers). No forma parte de ningún proceso de negocio ni
        contrato entre módulos. Excluido deliberadamente de audits de contrato
        (ver decision-log AUDIT-2026-10-02-ORPHANS). No requiere autenticación.
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: kairos-api
                  timestamp:
                    type: string
                    format: date-time
  /audit/login-attempts:
    post:
      operationId: recordLoginAttempt
      summary: Registra un intento de inicio de sesion (TR-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordLoginAttemptRequest'
      responses:
        '204':
          description: Evento de auditoria registrado
        '400':
          description: Payload invalido
  /users/me/assignments:
    get:
      operationId: getWorkContextAssignments
      summary: Lista las empresas/sedes autorizadas para el usuario autenticado (TR-05)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            Asignaciones vigentes del usuario (active=true, dentro de
            [validFrom, validUntil)) - puede ser una lista vacia. Una
            asignacion revocada o caducada nunca aparece aqui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkContextAssignmentsResponse'
        '401':
          description: Token de Firebase ausente o invalido
  /users/me/work-context:
    post:
      operationId: selectWorkContext
      summary: Valida y audita la seleccion de contexto de trabajo (empresa/sede) de TR-05
      description: >
        NO fija una sesion/contexto activo del lado del servidor (API
        stateless, ver nota de la seccion "description" de este
        documento). Valida la combinacion contra las asignaciones
        vigentes del usuario y registra el evento auditable del punto 11
        del contrato TR-05.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectWorkContextRequest'
      responses:
        '204':
          description: Combinacion valida y vigente - evento de auditoria registrado
        '400':
          description: Payload invalido (companyId/branchId ausentes o con formato distinto de UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
        '401':
          description: Token de Firebase ausente o invalido
        '403':
          description: >
            La combinacion companyId/branchId no es una asignacion vigente
            del usuario (BR-ORG-002) - nunca se acepta un contexto que el
            usuario no tiene autorizado o cuya asignacion esta
            revocada/caducada, aunque lo haya enviado el cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
  /users/me/activation-status:
    get:
      operationId: getActivationStatus
      summary: Estado de primer acceso del usuario autenticado (TR-02, HU-21)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >
            Si el usuario todavia no tiene UserProfile (cuentas previas a
            este modelo), se asume que no requiere activacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationStatusResponse'
        '401':
          description: Token de Firebase ausente o invalido
  /users/me/complete-activation:
    post:
      operationId: completeActivation
      summary: Marca completado el flujo de activacion (TR-02, HU-21)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Activacion marcada como completa
        '401':
          description: Token de Firebase ausente o invalido
  /users/me/dashboard:
    get:
      operationId: getDashboard
      summary: >
        Resuelve el rol del usuario para el contexto elegido y el estado
        del tablero (TR-06).
      description: >
        PROVISIONAL (HU-24/TR-06, hallazgo medio de revision PR#5
        "dashboard siempre EMPTY"): esta operacion es infraestructura de
        enrutamiento por rol, no la funcionalidad completa de TR-06. Los
        modulos de dominio (Consulta, Reserva, Alquiler, Devolucion,
        Reclutamiento, Administracion de Personal) todavia no existen,
        asi que hoy `state` solo puede ser EMPTY - no hay tareas ni
        alertas reales que calcular. No se cierra HU-24/TR-06 como
        funcionalidad terminada mientras este endpoint no calcule datos
        reales por rol.
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rol resuelto y estado del tablero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: Payload invalido (companyId/branchId ausentes o con formato distinto de UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
        '401':
          description: Token de Firebase ausente o invalido
        '403':
          description: >
            La combinacion companyId/branchId no es una asignacion vigente
            del usuario (BR-ORG-002) - nunca se acepta un contexto que el
            usuario no tiene autorizado o cuya asignacion esta
            revocada/caducada, aunque lo haya enviado el cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ID token de Firebase Authentication, enviado como "Authorization Bearer <idToken>"
  schemas:
    RecordLoginAttemptRequest:
      type: object
      required: [email, outcome]
      properties:
        email:
          type: string
          format: email
        outcome:
          type: string
          enum: [SUCCESS, FAILURE]
        reason:
          type: string
          maxLength: 200
          description: Motivo del fallo, nunca la contrasena.
    WorkContextAssignmentsResponse:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/WorkContextAssignment'
    WorkContextAssignment:
      type: object
      required: [companyId, companyName, branchId, branchName, role]
      properties:
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        role:
          $ref: '#/components/schemas/RoleRef'
    RoleRef:
      type: object
      required: [id, name, key]
      description: >
        Roles dinamicos (ADM-02, admin.yaml 0.2.0): el rol ya no es un
        enum cerrado. `id`/`name` identifican el rol del usuario en el
        contexto vigente; `key` es el codigo estable de los roles de
        sistema (null en roles creados a mano). El front NO decide acceso
        por rol: usa GET /me/permissions.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key: { type: [string, 'null'] }
    DashboardResponse:
      type: object
      required: [role, state]
      description: >
        Hallazgo medio de revision PR#5 ("OpenAPI provisional sin
        estrategia de evolucion"): `state` se modela como un enum
        abierto a crecer de forma aditiva. Cuando exista un estado con
        datos reales (p.ej. READY con tareas/alertas por rol), se agrega
        como un nuevo valor del enum mas un campo opcional nuevo (p.ej.
        `tasks`) - sin reemplazar ni remover EMPTY ni cambiar el tipo de
        `state`. La forma exacta de READY se define cuando el modulo de
        dominio correspondiente exista (fuente BDD/SDD/TDD del modulo),
        no se inventa aqui.

        ACLARACION (hallazgo MEDIO de revision de seguimiento de PR#5,
        12fc688 - "la estrategia OpenAPI no es necesariamente
        no-breaking"): agregar un valor a un enum es aditivo a nivel de
        ESTE contrato, pero NO esta garantizado que sea no-breaking para
        todo cliente generado - un cliente que modele `state`/`role` como
        enum cerrado, o que haga un switch exhaustivo sobre los valores
        actuales, SI se rompe (o deja de compilar) cuando aparece un
        valor nuevo que no contemplaba. Este contrato no puede garantizar
        compatibilidad del lado del cliente por si solo. Recomendacion
        para quien genere un cliente desde este YAML: tratar `state` y
        `role` como enums ABIERTOS (agregar una rama/`default` de
        fallback tipo `UNKNOWN` en vez de un switch exhaustivo sin
        default), y no asumir que la lista de valores de hoy es
        definitiva. Cuando el modelo de READY este definido, se evalua si
        amerita una version nueva del contrato (no solo un valor de enum
        mas) para los clientes que necesiten una garantia mas fuerte.
      properties:
        role:
          $ref: '#/components/schemas/RoleRef'
        state:
          type: string
          description: >
            EXTENDIDO 23 sep 2026 (HU-24, TR-06): se agrega READY de forma
            aditiva, exactamente como preveia esta misma descripcion -
            EMPTY no se remueve ni cambia de significado. Ver
            DashboardResponse para la aclaracion sobre compatibilidad de
            clientes (un switch exhaustivo sin default se rompe con este
            valor nuevo).
          enum: [EMPTY, READY]
        tasks:
          type: array
          description: >
            Presente solo cuando state=READY. Alcance real de esta
            primera version: solo se calculan tareas de Reservations
            (ReservationCreated -> pendiente de pago/documentos,
            descartada al confirmar o cancelar) para el rol FRONT_OFFICE.
            Los demas roles y fuentes (Rentals, Returns, Recruitment,
            HR-Administration) se agregan cuando esos modulos existan -
            ver claude/Diseno_Agregador_Transversal_TR-06-07-08.md
            (Project KAIROS).
          items:
            $ref: '#/components/schemas/DashboardTaskItem'
    DashboardTaskItem:
      type: object
      required: [id, itemType, priority, title, detail, deepLink]
      properties:
        id:
          type: string
          format: uuid
        itemType:
          type: string
          enum: [TASK, ALERT, DRAFT, ACTIVITY]
        priority:
          type: integer
          description: Mayor valor = mas urgente. El frontend ordena por esto, no reimplementa la regla de negocio.
        title:
          type: string
        detail:
          type: string
          nullable: true
        deepLink:
          type: string
          description: Lleva directo al paso exacto (ej. la reserva especifica), nunca al inicio generico del flujo.
    SelectWorkContextRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
    ActivationStatusResponse:
      type: object
      required: [requiresPasswordChange, requiresMfaEnrollment]
      properties:
        requiresPasswordChange:
          type: boolean
        requiresMfaEnrollment:
          type: boolean
    NestErrorResponse:
      description: >
        Forma real y actual del error (no problem+json todavia): el
        formato default que NestJS serializa para toda HttpException sin
        un ExceptionFilter global (no existe uno en este backend por
        ahora). Migrar a application/problem+json (RFC 9457, ya usado
        como convencion objetivo en TDD-KAIROS-*.md) es un cambio
        transversal a todos los modulos, fuera de alcance de PR#4 -
        pendiente como su propio cambio.
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
