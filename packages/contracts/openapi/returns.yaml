        - organizationId
        - operatingCompanyId
        - branchId
        - rentalId
        - vehicleId
        - customerId
        - status
        - custodyHolder
        - customerPresent
        - scheduledAt
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
        - etag
        - damages
        - immobilizationCharges
        - alcoholEscalation
        - responsibilityDocument
        - reminder
        - depositRequired
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        operatingCompanyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        vehiclePlate: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        depositRequired:
          type: boolean
          description: false = alquiler con conductor de la empresa, sin garantía (liberación/devolución N/A, sin alerta de 24 h). true por defecto.
