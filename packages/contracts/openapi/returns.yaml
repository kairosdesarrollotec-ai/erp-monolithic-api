        custodyHolder: { $ref: '#/components/schemas/CustodyHolder' }
        customerPresent: { type: boolean }
        mileageAtReturn: { type: integer, nullable: true }
        fuelLevelAtReturn: { $ref: '#/components/schemas/ReturnFuelLevel', nullable: true }
        alcoholTestResult: { $ref: '#/components/schemas/AlcoholTestResult', nullable: true }
        alcoholTestNotes: { type: string, nullable: true }
        manualLateCharge:
          nullable: true
          description: Cargo por retraso registrado manualmente (DEC-DEV-LATE-CHARGE-002); null si no hay
          allOf:
            - $ref: '#/components/schemas/ManualLateChargeResponse'
        alcoholEscalation:
          nullable: true
          description: Última decisión de Gerencia ante alcolímetro desfavorable (null si no hubo)
          allOf:
            - $ref: '#/components/schemas/AlcoholEscalationResponse'
        responsibilityDocument:
          nullable: true
          description: Documento de responsabilidad firmado en la inspección (null antes de completarla); sin signatureData
          allOf:
            - $ref: '#/components/schemas/ResponsibilityDocumentResponse'
        reminder:
          nullable: true
          description: Recordatorio previo 3 h antes de la hora pactada (null mientras no se haya generado; BR-DEV-004)
          allOf:
            - $ref: '#/components/schemas/ReturnReminderResponse'
        alerts:
          description: >
            Alertas operativas calculadas con el reloj. Solo en GET /returns/{id} y GET /returns; las respuestas de comandos
            la omiten. warrantyRelease = garantía por liberar a las 24 h; immobilization = más de 24 h sin cobrar (solo alertan).
          allOf:
            - $ref: '#/components/schemas/ReturnAlerts'
        lateness:
          nullable: true
