openapi: 3.1.0
info:
  title: KAIROS ERP - Returns API
  version: 1.11.0
  description: >
    1.11.0 - DEC-DEV-REPORT-001 / DEC-DEV-LEGAL-001 / DEC-DEV-OFFLINE-001 (23-oct-2026, Frente C): (1) Inmovilización y reporte mecánico: si la
    devolución registra daños técnicos/estéticos (hasDamages=true), el vehículo queda inmovilizado y NO se puede cerrar la devolución
    (POST /returns/{id}/commands/close) sin que una persona con permiso de cierre registre que el cliente aceptó el informe mecánico/Motrix
    (POST /returns/{id}/commands/record-mechanic-report; de lo contrario responde 422 MECHANIC_REPORT_NOT_ACCEPTED). (2) Vía legal: nuevo
    POST /returns/{id}/commands/escalate-legal para anotación y escalamiento a Gerencia. (3) Sincronización offline: no se puede cerrar una
    devolución con cambios pendientes de sincronización offline (422 RETURN_OFFLINE_CHANGES_PENDING). (4) Multa de combustible calculada según
    tarifa del vehículo por línea faltante.
    1.10.0 - (22-oct-2026, G2) BR-DEV-011 RELOJ DE INMOVILIZACION DESDE EL CIERRE (respuesta de negocio del 22-oct): los dias de
    paralizacion se cuentan desde que se CIERRA la devolucion (estado CERRADA, `closedAt`), ya no desde la recepcion (COMPORTAMIENTO
    CAMBIADO). (1) `POST charge-immobilization`: solo procede con la devolucion CERRADA; en CON_DANOS / CIERRE_FINANCIERO (reloj aun sin
    arrancar) responde 422 `IMMOBILIZATION_CLOCK_NOT_STARTED` (codigo nuevo); a menos de 24 h naturales del cierre sigue siendo 422
    `IMMOBILIZATION_PERIOD_NOT_ELAPSED`. La formula de dias NO cambia (24 h de gracia y luego ceil(horas excedentes / 24)). (2) Alerta
    IMMOBILIZATION (GET /returns/alerts, `alerts.immobilization` de GET /returns y /returns/{id}, y tablero): solo existe con la devolucion
    CERRADA y > 24 h desde el cierre; `ImmobilizationAlert.since` pasa a ser el instante de CIERRE (antes la recepcion). Devolucion sin
    cerrar = sin reloj = sin alerta. (3) PD-07 (ADITIVO): `GET|POST /returns/{id}/zone-marks` persisten las marcas por zona de DEV-05 y auditan `RETURN_ZONE_MARKED` y `RETURN_ROUTE_TAKEN`. PREGUNTA ABIERTA: la formula (ceil sobre el exceso de 24 h)
    difiere de la redaccion del TDD; y como el cierre exige que todo dano tecnico ya tenga monto de informe, el cobro posterior al cierre
    se anota como ajuste de garantia sin reabrir la liquidacion (confirmar con negocio).
    1.9.0 - (a) DEC-EVID-DELETE-002 (Respuestas 2026-10-20 #35, SDD 15.5): eliminar evidencia exige DOBLE APROBACION (contrato nuevo
    evidence.yaml). `DELETE /returns/{id}/evidence/{evidenceId}` queda DEPRECADO (header `Deprecation: true`) y CAMBIA su permiso:
    exige EVIDENCE.DELETE_DIRECT (v0: solo PLATFORM_ADMIN) en lugar de RETURN.UPLOAD_EVIDENCE -> 403 ROLE_NOT_ALLOWED para los demas
    roles (COMPORTAMIENTO CAMBIADO). (b) P3 (sin cambio de contrato HTTP): ademas de la garantia de 24 h, la sugerencia de cargo por
    retraso (LATE_CHARGE) y la inmovilizacion > 24 h por dano tecnico (IMMOBILIZATION) se proyectan a dashboard_items (type ALERT,
    sourceType RETURN, deepLink /devoluciones/{id}) para los roles con NOTIFICATIONS.RECEIVE_RETURN_ALERTS; se descartan al
    resolverse (cargo registrado / dias cobrados). El cobro sigue siendo manual.
    1.8.0 — DEC-DEVREM-003 (sugerencia por tardanza): GET /returns/alerts admite type=LATE_CHARGE y ReturnAlertItem.lateCharge
    {lateMinutes, lateToleranceMinutes}: devolución recibida con retraso > 30 min (BR-DEV-003) y SIN cargo por retraso registrado ->
    el sistema SUGIERE registrarlo con register-late-charge (F-03: SIN monto; lo digita el usuario autorizado, sin cálculo
    automático). Se apaga sola al registrar el cargo. Campo nuevo `lateCharge` (null en los otros tipos) en todos los items.
    Sin endpoints nuevos. (La alerta de garantía de 24 h además se proyecta al tablero de Finanzas por un proceso interno
    sobre dashboard_items: sin cambio de contrato HTTP.)
    1.7.0 — Respuestas de negocio de Fiorella (2026-10-16). (1) DEV-03: alcolímetro DESFAVORABLE = check "no cumple el rango" +
    FOTO de la prueba OBLIGATORIA (evidencia PHOTO con zona ALCOHOL_TEST subida antes con upload-url/evidence); sin foto ->
    422 ALCOHOL_TEST_PHOTO_REQUIRED. No se registra hora ni otros campos; RECHAZADO tambien exige la foto (evidencia por si acaso). (2) Retraso pasada la tolerancia
    de 30 min: SÍ hay cargo, MANUAL por ahora: POST register-late-charge (monto digitado por usuario autorizado, sin cálculo
    automático; auditado y evento CargoRetrasoRegistrado.v1) y ReturnResponse.manualLateCharge. (3) "Día completo" = 100% de la
    tarifa diaria (tramo > 300 min de latenessCharge).
    1.4.0 — DEC-ALQ-COMPANY-DRIVER-004: alquiler CON CONDUCTOR DE LA EMPRESA = sin garantía.
    ReturnResponse.depositRequired (false = N/A liberación/devolución de garantía): el expediente
    no emite la alerta WARRANTY_RELEASE de 24 h y close-financial solo admite refundAmount =
    retainedAmount = 0 (si no, 422 RETURN_NO_DEPOSIT_TO_SETTLE). Sin otros cambios.
    1.5.0 — DEC-DEV-LATE-CHARGE-001 (Hoja de Políticas VR-GA-PA-VS.04, 26.03.2026, CONFIRMADA): ReturnResponse.latenessCharge,
    cargo SUGERIDO por retraso en GET /returns y GET /returns/{id} (informativo: NO cobra ni bloquea; el cobro sigue manual).
    Tramos: 31-120 min = 25% del día (penalidad sobre garantía 20%), 121-300 min = 50% (30%), >300 min = día completo (50%);
    >12 h no autorizado = severeBreach. Montos como string decimal. Tarifa = dailyRate vigente del vehículo; garantía =
    garantía del alquiler (null si no hay, p. ej. con conductor de la empresa).

    1.3.0 — BR-DEV-003/004 (tolerancia de 30 min CONFIRMADA): ReturnResponse.lateness
    {lateToleranceMinutes, lateMinutes, isLate, basis} en GET /returns y GET /returns/{id}
    (solo informativo: no hay cargo por retraso definido en los documentos).
    Recordatorio: "si el cliente no contesta, SOLO se registra" (register-reminder FAILED + nota;
    sin escalamiento ni reintentos automáticos). DUE_SOON a 4 h del límite de garantía CONFIRMADO.

    1.2.0 — DEC-TZ-LIMA-001 — Zona horaria de negocio America/Lima (UTC-5,
    sin DST): toda fecha date-only (YYYY-MM-DD) enviada a esta API como
    inicio/fin/ventana de viaje, disponibilidad, reserva, alquiler, devolución
    o reporte se interpreta como 00:00 America/Lima (= 05:00Z); los date-time
    con offset/Z se respetan tal cual. Los textos de notificaciones/documentos
    muestran fecha y hora de Lima. Los campos `format: date` de calendario
    puro (p. ej. travelStartDate) no cambian.

    Contrato del módulo Devolución (DEV-01 a DEV-10, BDD-04-devolucion.md, SDD-04-devolucion.md, TDD-04-devolucion.md).
    Implementa el ciclo de vida completo de devolución: programación, recepción provisional con custodia preventiva (DR-DEV-003),
    prueba de alcolímetro de salida con tolerancia cero (BR-DEV-005), checklist de inspección con evidencia fotográfica (BR-DEV-009, TR-08),
    evaluación de daños estéticos por tarifario de paños (BR-DEV-006) y técnicos mediante informe externo de Motrix, cobro de días de
    paralización por inmovilización (BR-DEV-011), liquidación financiera de garantía (BR-DEV-001, DR-DEV-001) y cierre definitivo.
    Versión 1.1.0: resolución provisional de Gerencia ante alcolímetro desfavorable (PROP-014), semáforo de riesgo del cliente
    NORMAL/AMBAR/ROJO (BR-DEV-007/008), documento de responsabilidad firmado en la inspección (PROP-015), tarifa de paralización
    tomada del vehículo y catálogo del tarifario estético.
    Versión 1.2.0: recordatorio previo 3 h antes de la hora pactada con envío MANUAL-ASISTIDO por WhatsApp (BR-DEV-004, DAT-DEV-001,
    DEC-DEV-REMINDER-001): campo `reminder` en el expediente, bandeja GET /returns/reminders y comando register-reminder; alertas
    operativas de garantía por liberar a las 24 h (BR-DEV-001) e inmovilización > 24 h sin cobro (BR-DEV-011): campo opcional `alerts`
    y GET /returns/alerts (solo alertan: no ejecutan reembolso ni cobro). Zona horaria de negocio America/Lima (UTC-5) para los textos.
    close libera el compromiso RENTAL del vehículo (DEC-DEV-COMMITMENT-001). Los errores siguen la forma { statusCode, code, detail }.

paths:
  /returns:
    post:
      operationId: createReturn
      summary: Programar o registrar inicio de devolución (DEV-01)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleReturnRequest' }
      responses:
        '201':
          description: Devolución creada exitosamente en estado PROGRAMADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '400':
          description: Datos inválidos
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Alquiler no encontrado en la empresa/sede
        '409':
          description: El alquiler ya cuenta con una devolución activa (RENTAL_ALREADY_HAS_ACTIVE_RETURN) o no está en estado ACTIVE/RETURN_IN_PROGRESS (RENTAL_NOT_RETURNABLE)
        '500':
          description: Error interno del servidor

    get:
      operationId: listReturns
      summary: Bandeja de devoluciones con filtros y paginación keyset (DEV-01 / DEV-02)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ReturnStatus' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursorCreatedAt, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: cursorId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de devoluciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReturnResponse' }
        '400':
          description: Parámetros de cursor inválidos o limit fuera de rango
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '500':
          description: Error interno del servidor

  /returns/receive-provisional:
    post:
      operationId: receiveProvisional
      summary: Recepción física provisional del vehículo en base (DEV-03 / DR-DEV-003)
      description: >
        Toma custodia física preventiva en base VeloxRent (kilometraje, combustible y presencia del cliente)
        sin extinguir obligaciones contractuales (estado RECEPCION_PROVISIONAL). Si el alquiler ya tiene una devolución
        PROGRAMADA la avanza; si no, crea el expediente directamente en RECEPCION_PROVISIONAL. El alquiler pasa a RETURN_IN_PROGRESS.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveProvisionalRequest' }
      responses:
        '201':
          description: Vehículo recibido provisionalmente bajo custodia de VeloxRent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '400':
          description: Datos inválidos
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Alquiler no encontrado en la empresa/sede
        '409':
          description: El alquiler no está en estado ACTIVE o RETURN_IN_PROGRESS (RENTAL_NOT_RETURNABLE), o su devolución ya avanzó más allá de PROGRAMADA (RENTAL_ALREADY_HAS_ACTIVE_RETURN)
        '500':
          description: Error interno del servidor

  /returns/reminders:
    get:
      operationId: listReturnReminders
      summary: Bandeja de recordatorios de devolución pendientes de envío o fallidos (DEV-01 / BR-DEV-004)
      description: >
        Un scheduler genera, para cada devolución PROGRAMADA cuya hora pactada cae dentro de las próximas 3 h, un recordatorio en
        estado PENDING con el texto ya redactado (hora en America/Lima). El envío por WhatsApp es MANUAL-ASISTIDO: el operador copia
        `reminder.text`, lo envía y registra el resultado con register-reminder. Sin `status` devuelve PENDING + FAILED, ordenados por
        `dueAt` ascendente (el más urgente primero). Solo lectura; no requiere If-Match.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ReturnReminderStatus' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Recordatorios de la sede
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReturnReminderInboxItem' }
        '400':
          description: Parámetros inválidos o limit fuera de rango
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '500':
          description: Error interno del servidor

  /returns/alerts:
    get:
      operationId: listReturnAlerts
      summary: Alertas operativas de devolución - garantía por liberar (24 h) e inmovilización > 24 h (DEV-07 / DEV-08)
      description: >
        Calculadas con el reloj en cada consulta (sin estado propio). WARRANTY_RELEASE: devolución SIN_DANOS sin cierre financiero a la
        que le faltan 4 h o menos (DUE_SOON) o ya venció (OVERDUE) el plazo MÁXIMO de 24 h naturales desde la recepción (BR-DEV-001);
        un daño suspende ese plazo. IMMOBILIZATION: más de 24 h naturales desde el cierre con daño TÉCNICO y días de paralización
        aún sin cobrar (BR-DEV-011; desde 1.10.0 el reloj corre desde el CIERRE de la devolución, no desde la recepción: devolución sin cerrar = sin alerta). SOLO ALERTAN: el reembolso y el cobro siguen siendo manuales (close-financial / charge-immobilization).
        LATE_CHARGE (1.8.0): recibida con retraso mayor que la tolerancia de 30 min y sin cargo por retraso registrado; SUGERENCIA de
        registrarlo (sin monto: lo digita el usuario autorizado). Sin `type` devuelve todos los tipos. Solo lectura; no requiere If-Match.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/ReturnAlertType' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Alertas vigentes de la sede
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReturnAlertItem' }
        '400':
          description: Parámetros inválidos o limit fuera de rango
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '500':
          description: Error interno del servidor

  /returns/cosmetic-tariff:
    get:
      operationId: getCosmeticTariff
      summary: Catálogo del tarifario oficial de daños estéticos por paño (BDD 9.6.1 / BR-DEV-006)
      description: >
        Lista los códigos válidos de `damagedZone` para assess-damage con su nombre y precio fijo en soles. Solo lectura;
        no requiere If-Match.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tarifario de daños estéticos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CosmeticTariffResponse' }
        '400':
          description: Parámetros de empresa/sede inválidos
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '500':
          description: Error interno del servidor

  /returns/{id}:
    get:
      operationId: getReturn
      summary: Detalle completo del expediente de devolución
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Expediente de devolución
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '500':
          description: Error interno del servidor

  /returns/{id}/responsibility-template:
    get:
      operationId: getResponsibilityTemplate
      summary: Obtener plantilla del documento de responsabilidad para firma del cliente (PROP-015b / BR-DEV-009)
      description: |
        Retorna el contenido de la plantilla activa del documento de responsabilidad asociado a la empresa
        operativa de la devolución. El frontend debe mostrar este contenido al cliente antes de solicitar la firma.
        Requiere que la devolución exista y que el usuario tenga acceso a ella.
      tags: [returns]
      parameters:
        - $ref: '#/components/parameters/returnId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/branchId'
      responses:
        '200':
          description: Plantilla activa del documento de responsabilidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsibilityTemplateResponse'
        '401':
          description: No autenticado
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada o plantilla no configurada para la empresa
        '500':
          description: Error interno del servidor

  /returns/{id}/zone-marks:
    get:
      operationId: listReturnZoneMarks
      summary: Marcas por zona de DEV-05 persistidas en el servidor (PD-07)
      description: >
        Devuelve las marcas "Sin daño" / "Con daño" guardadas por zona y la ruta resultante (`route`): NO_DAMAGE (las 5 zonas sin daño ->
        DEV-09), DAMAGE (al menos una con daño -> DEV-06) o null mientras falten zonas. Sirve para restaurar la pantalla Resultado tras
        recargar o en otro dispositivo. Solo lectura.
      tags: [returns]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/returnId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/branchId'
      responses:
        '200':
          description: Marcas y ruta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnZoneMarksResponse' }
        '401': { description: No autenticado }
        '403': { description: No autorizado para el contexto o rol insuficiente }
        '404': { description: Devolución no encontrada (RETURN_NOT_FOUND) }
        '500': { description: Error interno del servidor }
    post:
      operationId: recordReturnZoneMarks
      summary: Registrar las marcas por zona de DEV-05 y la ruta tomada (PD-07)
      description: >
        Upsert por zona (solo las zonas enviadas cambian; las 5 zonas: FRONTAL, LATERAL_IZQUIERDO, LATERAL_DERECHO, POSTERIOR, INTERIOR).
        Cada marca nueva o cambiada emite el evento auditable RETURN_ZONE_MARKED; cuando las 5 zonas quedan marcadas por primera vez, o la
        ruta resultante cambia, emite RETURN_ROUTE_TAKEN (route = NO_DAMAGE | DAMAGE, zonas con daño). La ruta "incidente" la audita el
        módulo de Incidencias. Mismo permiso que completar la inspección. Solo con la devolución en RECEPCION_PROVISIONAL | INSPECCION
        (resuelta ya la inspección -> 409 RETURN_STATE_CONFLICT). NO lleva If-Match (no cambia el agregado) y es idempotente
        (repetir las mismas marcas no escribe ni audita). No bloquea ni condiciona complete-inspection.
      tags: [returns]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/returnId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordReturnZoneMarksRequest' }
      responses:
        '200':
          description: Marcas vigentes y ruta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnZoneMarksResponse' }
        '401': { description: No autenticado }
        '403': { description: No autorizado para el contexto o rol insuficiente }
        '404': { description: Devolución no encontrada (RETURN_NOT_FOUND) }
        '409': { description: Devolución fuera de RECEPCION_PROVISIONAL / INSPECCION (RETURN_STATE_CONFLICT) }
        '422': { description: Zona o marca fuera del catálogo, zona repetida o lista vacía (INVALID_ZONE_MARK) }
        '500': { description: Error interno del servidor }

  /returns/{id}/commands/register-alcohol-test:
    post:
      operationId: registerAlcoholTest
      summary: Registrar resultado de prueba de alcolímetro de salida (DEV-04 / BR-DEV-005)
      description: >
        DESFAVORABLE = check "no cumple el rango del alcoholímetro" + foto de la prueba OBLIGATORIA: antes de registrar, subir la
        foto como evidencia PHOTO con zona ALCOHOL_TEST (upload-url -> PUT -> POST evidence). Sin foto -> 422
        ALCOHOL_TEST_PHOTO_REQUIRED. No se registra hora ni más campos. RECHAZADO tambien exige la foto (evidencia por si acaso).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterReturnAlcoholTestRequest' }
      responses:
        '200':
          description: Prueba registrada; pasa a INSPECCION si favorable, o permanece en custodia y escala a Gerencia si desfavorable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: Estado incompatible (debe estar en RECEPCION_PROVISIONAL)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: Resultado DESFAVORABLE o RECHAZADO sin la foto de la prueba (evidencia PHOTO con zona ALCOHOL_TEST) -> ALCOHOL_TEST_PHOTO_REQUIRED
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/resolve-alcohol-escalation:
    post:
      operationId: resolveAlcoholEscalation
      summary: Gerencia resuelve la escalada por alcolímetro desfavorable/rechazado (DEV-04 / BR-DEV-005, PROP-014 provisional)
      description: >
        Solo rol GERENCIA (deny-by-default). Válido únicamente con status RECEPCION_PROVISIONAL y alcoholTestResult
        DESFAVORABLE o RECHAZADO; en otro caso 409 RETURN_STATE_CONFLICT.
        CONTINUE_TO_INSPECTION pasa el expediente a INSPECCION (custodia VELOXRENT). KEEP_IN_CUSTODY lo mantiene en
        RECEPCION_PROVISIONAL y puede volver a resolverse mientras siga allí (cada decisión se audita:
        RETURN_ALCOHOL_ESCALATION_RESOLVED; evento DevolucionAlcoholResueltoPorGerencia.v1).
        markCustomerRed=true lleva Customer.status a ROJO (solo hacia adelante). Decisión PROVISIONAL: los documentos no
        definen las opciones. La última decisión se expone en ReturnResponse.alcoholEscalation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveAlcoholEscalationRequest' }
      responses:
        '200':
          description: Decisión registrada; el expediente pasa a INSPECCION o permanece en RECEPCION_PROVISIONAL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '400':
          description: Datos inválidos (decision fuera del enum, notes con menos de 5 caracteres)
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: Rol no permitido (solo GERENCIA) o contexto no autorizado
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: Estado incompatible - no está en RECEPCION_PROVISIONAL o el alcolímetro no fue DESFAVORABLE/RECHAZADO (RETURN_STATE_CONFLICT)
        '412':
          description: Versión no coincide (If-Match)
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/complete-inspection:
    post:
      operationId: completeInspection
      summary: Completar checklist de inspección y categorizar estado de daños (DEV-04 / DEV-05)
      description: >
        Requiere el estado INSPECCION, la evidencia mínima registrada (35 fotos + 3 videos, BR-DEV-009) y el documento de
        responsabilidad firmado (responsibilityDocument, DAT-DEV-005 / EX-DEV-001). Si quien devuelve no es el titular
        (signerIsHolder=false) debe informarse signerRelationToHolder; los datos del tercero se conservan solo en este
        documento/`notes`. PROVISIONAL: validez jurídica de la firma pendiente de Legal (mismo criterio que PROP-012).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteInspectionRequest' }
      responses:
        '200':
          description: Inspección completada; transiciona a SIN_DANOS o CON_DANOS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: Estado incompatible (debe estar en INSPECCION)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: Falta evidencia obligatoria del checklist de retorno - mínimo 35 fotos y 3 videos registrados (MISSING_REQUIRED_EVIDENCE, BR-DEV-009) o falta/está incompleto el documento de responsabilidad (MISSING_RESPONSIBILITY_DOCUMENT)
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/assess-damage:
    post:
      operationId: assessDamage
      summary: Evaluar daño estético por tarifario o registrar derivación técnica a Motrix (DEV-06 / DEV-07 / BR-DEV-006)
      description: >
        AESTHETIC - damagedZone es obligatoria y debe pertenecer al tarifario por paño; el monto SIEMPRE lo fija el tarifario
        (estimatedAmount enviado por el cliente se ignora) y no admite externalReportReference.
        TECHNICAL - externalReportReference obligatoria (informe externo de Motrix); estimatedAmount es el monto manual del informe y,
        mientras falte, el daño cuenta como incidencia abierta (bloquea close-financial y close, DR-DEV-001).
        El expediente permanece en CON_DANOS y su versión se incrementa (ver returnVersion/returnEtag en la respuesta).
        Semáforo del cliente (Customer.status, solo avanza NORMAL -> AMBAR -> ROJO, BR-DEV-007/008): severidad GRAVE -> ROJO
        siempre; LEVE o MODERADO con customerAcceptsCost=true -> AMBAR; en otro caso sin cambio. El resultado vuelve en
        customerRiskStatus. El monto de un daño técnico es manual (sin tarifario).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessDamageRequest' }
      responses:
        '200':
          description: Daño evaluado exitosamente y registrado en la devolución
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnDamageResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: Estado incompatible (debe estar en CON_DANOS)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: Daño técnico requiere externalReportReference o paño estético no reconocido
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/charge-immobilization:
    post:
      operationId: chargeImmobilization
      summary: Aplicar cobro de días de paralización por inmovilización en taller (DEV-07 / BR-DEV-011)
      description: >
        La tarifa diaria NO se envía: se toma del dailyRate vigente del vehículo del alquiler (TDD §9.3) y se devuelve en
        ImmobilizationChargeResponse.dailyRate. Si el vehículo no tiene dailyRate -> 422 INVALID_IMMOBILIZATION_CHARGE.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChargeImmobilizationRequest' }
      responses:
        '201':
          description: Cargo por paralización generado e imputado a la liquidación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImmobilizationChargeResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución (o damageId) no encontrada en la empresa/sede
        '409':
          description: Estado incompatible (debe estar en CON_DANOS, CIERRE_FINANCIERO o CERRADA; solo CERRADA arranca el reloj)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: La devolución aún no está cerrada, el reloj no corre (IMMOBILIZATION_CLOCK_NOT_STARTED), no han transcurrido 24 horas naturales desde el cierre (IMMOBILIZATION_PERIOD_NOT_ELAPSED), no hay daño técnico, el vehículo no tiene dailyRate o los días exceden los pendientes de cobro (INVALID_IMMOBILIZATION_CHARGE)
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/register-late-charge:
    post:
      operationId: registerReturnLateCharge
      summary: Registrar el cargo por retraso en la devolución, MANUAL (DEC-DEV-LATE-CHARGE-002)
      description: >
        Pasada la tolerancia de 30 min sobre la hora pactada SÍ hay cargo; por ahora el monto lo digita un usuario autorizado
        (Administración, Gerencia o Finanzas) y NO se calcula automáticamente (el cargo sugerido de latenessCharge sigue siendo
        informativo). Volver a registrar corrige el monto (queda el último; cada registro se audita y emite CargoRetrasoRegistrado.v1).
        No ajusta la garantía por sí mismo.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterReturnLateChargeRequest' }
      responses:
        '200':
          description: Cargo por retraso registrado (ReturnResponse.manualLateCharge)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: Estado incompatible (el vehículo debe estar recibido y la devolución no cerrada/cancelada)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: La devolución no superó la tolerancia de 30 minutos o el monto no es válido (INVALID_LATE_CHARGE)
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/register-reminder:
    post:
      operationId: registerReturnReminder
      summary: Registrar el resultado del envío manual del recordatorio de devolución (DEV-01 / BR-DEV-004 / DAT-DEV-001)
      description: >
        El sistema NO envía el WhatsApp (la integración no existe): el operador lo envía a mano y aquí registra la hora y el resultado
        (SENT | FAILED + nota; la nota es obligatoria si FAILED). `If-Match` lleva la versión del RECORDATORIO (`reminder.version` /
        `reminder.etag`), no la del expediente, y el comando no modifica la versión del expediente. Un recordatorio FAILED admite un nuevo
        registro MANUAL del operador; uno SENT es definitivo (409 RETURN_REMINDER_ALREADY_SENT). Acción de matriz: RETURN.CREATE.
        Regla CONFIRMADA: si el cliente no contesta, SOLO se registra (FAILED + nota con el motivo): el sistema no escala, no notifica a
        terceros ni reintenta el envío automáticamente. La tolerancia de 30 min (BR-DEV-003/004) solo se informa en el texto del recordatorio.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterReturnReminderRequest' }
      responses:
        '200':
          description: Recordatorio actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnReminderResponse' }
        '400':
          description: Datos inválidos
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada (RETURN_NOT_FOUND) o aún sin recordatorio generado (RETURN_REMINDER_NOT_FOUND)
        '409':
          description: El recordatorio ya fue registrado como enviado (RETURN_REMINDER_ALREADY_SENT) o la devolución está CANCELADA (RETURN_STATE_CONFLICT)
        '412':
          description: Versión del recordatorio no coincide (If-Match, RETURN_REMINDER_VERSION_CONFLICT)
        '422':
          description: FAILED sin nota o hora de envío en el futuro (INVALID_RETURN_REMINDER_RESULT)
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/close-financial:
    post:
      operationId: closeFinancial
      summary: Realizar cierre y balance financiero de garantía y penalidades (DEV-08 / BR-DEV-001)
      description: >
        refundAmount + retainedAmount debe ser igual a la garantía constituida del alquiler y retainedAmount debe cubrir los cargos de
        paralización ya imputados. finalSettlementAmount del expediente queda con el valor de retainedAmount. No procede con
        incidencias abiertas (INCIDENT_STILL_OPEN -> 422, DR-DEV-001).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseFinancialRequest' }
      responses:
        '200':
          description: Liquidación financiera completada; transiciona a CIERRE_FINANCIERO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: Estado incompatible (debe estar en SIN_DANOS o CON_DANOS)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: Existen incidencias abiertas (INCIDENT_STILL_OPEN, TDD §11.4) o la liquidación no cuadra con la garantía / no cubre los cargos de paralización (INVALID_FINANCIAL_SETTLEMENT), o el alquiler no tiene garantía (conductor de la empresa) y se envían montos > 0 (RETURN_NO_DEPOSIT_TO_SETTLE)
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/close:
    post:
      operationId: closeReturn
      summary: Firma final de acta y cierre formal de la devolución (DEV-09 / DEV-10 / DR-DEV-001)
      description: >
        Además de cerrar el expediente, pasar el alquiler a CLOSED y actualizar la flota, libera el compromiso RENTAL del vehículo
        (`vehicle_commitments` -> RELEASED) en la misma transacción, también en devolución anticipada (DEC-DEV-COMMITMENT-001).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseReturnRequest' }
      responses:
        '200':
          description: Devolución cerrada; alquiler pasa a CLOSED y flota se actualiza a AVAILABLE o MAINTENANCE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: Estado incompatible (debe estar en CIERRE_FINANCIERO)
        '412':
          description: Versión no coincide (If-Match)
        '422':
          description: Existen incidencias técnicas abiertas pendientes (INCIDENT_STILL_OPEN, TDD §11.4), el cliente no ha aceptado el informe mecánico (MECHANIC_REPORT_NOT_ACCEPTED), o hay cambios offline pendientes de sincronización (RETURN_OFFLINE_CHANGES_PENDING)
        '428':
          description: Falta header If-Match
        '500':
          description: Error interno del servidor

  /returns/{id}/commands/record-mechanic-report:
    post:
      operationId: recordMechanicReport
      summary: Registrar aceptación del cliente del informe mecánico / Motrix (DEC-DEV-REPORT-001)
      description: >
        Permite a un usuario con permiso de cierre registrar que el cliente aceptó el informe mecánico
        y se compromete al pago de los daños. Requisito obligatorio para poder cerrar una devolución con daños.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordMechanicReportRequest' }
      responses:
        '200':
          description: Aceptación del informe mecánico registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token no autenticado }
        '403': { description: No autorizado para el contexto o permiso insuficiente (RETURN.CLOSE) }
        '404': { description: Devolución no encontrada }
        '412': { description: Versión no coincide (If-Match) }
        '428': { description: Falta header If-Match }

  /returns/{id}/commands/escalate-legal:
    post:
      operationId: escalateLegal
      summary: Anotación y escalamiento a Gerencia por vía legal (DEC-DEV-LEGAL-001)
      description: >
        Registra la anotación de caso legal y escala la notificación a Gerencia.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalateLegalRequest' }
      responses:
        '200':
          description: Escalamiento legal registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token no autenticado }
        '403': { description: No autorizado para el contexto o permiso insuficiente (RETURN.CLOSE) }
        '404': { description: Devolución no encontrada }
        '412': { description: Versión no coincide (If-Match) }
        '428': { description: Falta header If-Match }

  /returns/{id}/evidence/upload-url:
    post:
      operationId: requestReturnEvidenceUploadSession
      summary: Solicitar URL firmada para subir evidencia fotográfica/video de retorno (TR-08)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestReturnEvidenceUploadSessionRequest' }
      responses:
        '201':
          description: URL firmada de GCS generada para subida directa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnEvidenceUploadSessionResponse' }
        '400':
          description: Datos inválidos o tipo de archivo no admitido
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: La devolución no está en un estado que admita evidencia (RECEPCION_PROVISIONAL, INSPECCION o CON_DANOS)
        '500':
          description: Error interno del servidor
        '503':
          description: Almacenamiento de evidencia no configurado

  /returns/{id}/evidence:
    post:
      operationId: recordReturnEvidence
      summary: Registrar evidencia de retorno tras subida a GCS (TR-08)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordReturnEvidenceRequest' }
      responses:
        '201':
          description: Evidencia vinculada exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnEvidenceResponse' }
        '400':
          description: Datos inválidos o objectUrl no emitida por upload-url para esta devolución
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '409':
          description: La devolución no está en un estado que admita evidencia (RECEPCION_PROVISIONAL, INSPECCION o CON_DANOS)
        '500':
          description: Error interno del servidor

    get:
      operationId: listReturnEvidence
      summary: Listar evidencias registradas de una devolución
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de evidencias registradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReturnEvidenceResponse' }
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución no encontrada en la empresa/sede
        '500':
          description: Error interno del servidor

  /returns/{id}/evidence/{evidenceId}:
    delete:
      operationId: deleteReturnEvidence
      deprecated: true
      summary: Eliminar una evidencia de recepción registrada por error (DEV-04)
      description: >
        DEPRECADO (DEC-EVID-DELETE-002): usar POST /evidence/deletion-requests (doble aprobación, evidence.yaml). Este atajo exige
        EVIDENCE.DELETE_DIRECT (v0: solo PLATFORM_ADMIN) y responde con el header `Deprecation: true`. Solo en los estados que
        admiten evidencia (RECEPCION_PROVISIONAL, INSPECCION o CON_DANOS). Se elimina el registro; el archivo del bucket no se toca.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Evidencia eliminada
        '401':
          description: Token de autenticación ausente o inválido
        '403':
          description: No autorizado para el contexto o rol insuficiente
        '404':
          description: Devolución o evidencia no encontradas en la empresa/sede (RETURN_NOT_FOUND / RETURN_EVIDENCE_NOT_FOUND)
        '409':
          description: La devolución no está en un estado que admita evidencia
        '500':
          description: Error interno del servidor

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Firebase ID token'
      description: 'ID token de Firebase Authentication, enviado como "Authorization: Bearer <idToken>"'

  parameters:
    returnId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    companyId: { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
    branchId: { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }

  schemas:
    ReturnReminderStatus:
      type: string
      description: PENDING = generado por el sistema, pendiente de envío manual; SENT / FAILED = resultado registrado por el operador
      enum: [PENDING, SENT, FAILED]

    ReturnReminderResult:
      type: string
      enum: [SENT, FAILED]

    ReturnAlertType:
      type: string
      enum: [WARRANTY_RELEASE, IMMOBILIZATION, LATE_CHARGE]

    RegisterReturnReminderRequest:
      type: object
      required: [companyId, branchId, result]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        result: { $ref: '#/components/schemas/ReturnReminderResult' }
        sentAt:
          type: string
          format: date-time
          description: Hora real del envío; si se omite, el servidor usa la hora actual. No puede estar en el futuro (tolerancia 5 min).
        note:
          type: string
          maxLength: 500
          description: Obligatoria cuando result = FAILED (motivo).

    ReturnReminderResponse:
      type: object
      required: [id, status, dueAt, text, generatedAt, sentAt, sentBy, note, attempts, version, etag]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReturnReminderStatus' }
        dueAt: { type: string, format: date-time, description: Hora pactada menos 3 h }
        text: { type: string, description: Mensaje redactado por el sistema (hora en America/Lima), listo para copiar y enviar por WhatsApp }
        generatedAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
        sentBy: { type: string, nullable: true, description: Firebase UID del operador que registró el resultado }
        note: { type: string, nullable: true }
        attempts: { type: integer, description: Cantidad de resultados registrados }
        version: { type: integer, description: Valor para If-Match de register-reminder }
        etag: { type: string }

    ReturnReminderInboxItem:
      type: object
      required: [returnId, rentalId, returnStatus, scheduledAt, vehiclePlate, customerName, customerPhone, reminder]
      properties:
        returnId: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        returnStatus: { $ref: '#/components/schemas/ReturnStatus' }
        scheduledAt: { type: string, format: date-time }
        vehiclePlate: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        customerPhone: { type: string, nullable: true, description: Teléfono del cliente para el envío manual }
        reminder: { $ref: '#/components/schemas/ReturnReminderResponse' }

    WarrantyReleaseAlert:
      type: object
      required: [level, deadlineAt, hoursRemaining]
      properties:
        level:
          type: string
          enum: [DUE_SOON, OVERDUE]
          description: DUE_SOON faltan 4 h o menos para el límite de 24 h; OVERDUE ya venció
        deadlineAt: { type: string, format: date-time, description: Recepción + 24 h naturales }
        hoursRemaining: { type: number, description: Horas restantes (negativo si venció) }

    ImmobilizationAlert:
      type: object
      required: [since, hoursElapsed, pendingDays, dailyRate, suggestedAmount]
      properties:
        since: { type: string, format: date-time, description: Cierre de la devolución (inicio del reloj de paralización, desde 1.10.0; antes la recepción) }
        hoursElapsed: { type: number }
        pendingDays: { type: integer, description: Días de paralización que el reloj justifica y aún no se cobraron }
        dailyRate: { type: number, nullable: true, description: dailyRate vigente del vehículo }
        suggestedAmount: { type: number, nullable: true, description: pendingDays x dailyRate (sugerencia; el cobro es manual) }

    ReturnLateness:
      type: object
      required: [lateToleranceMinutes, lateMinutes, isLate, basis]
      properties:
        lateToleranceMinutes: { type: integer, example: 30 }
        lateMinutes: { type: integer, minimum: 0, description: Minutos enteros pasados de la hora pactada (0 si no hay retraso bruto) }
        isLate: { type: boolean, description: true solo si el retraso supera estrictamente la tolerancia }
        basis:
          type: string
          enum: [RECEIVED, NOW]
          description: RECEIVED = contra la recepción real (definitivo); NOW = aún no recibido (parcial, crece con el reloj)
    ReturnLatenessCharge:
      type: object
      description: >
        Cargo SUGERIDO por retraso (Hoja de Políticas VR-GA-PA-VS.04). Solo informativo; el cobro es manual
        (ajustes de garantía / cargo de paralización). La tolerancia de 30 min exactos (30:00) no es retraso (tier NONE).
      required: [tier, basis, informational, timeChargePercent, guaranteePenaltyPercent, dailyRate, guaranteeAmount, currency, suggestedTimeCharge, suggestedGuaranteePenalty, noticeAndPrepaymentVerified, severeBreach, severeBreachThresholdHours]
      properties:
        tier:
          type: string
          enum: [NONE, EXTRA_31_120, EXTRA_121_300, EXTRA_OVER_300]
          description: NONE = dentro de tolerancia; EXTRA_31_120 = 31-120 min; EXTRA_121_300 = 121 min a 5 h; EXTRA_OVER_300 = más de 5 h
        basis: { type: string, enum: [RECEIVED, NOW] }
        informational: { type: boolean, enum: [true] }
        timeChargePercent: { type: integer, description: '0 / 25 / 50 / 100 (% de la tarifa diaria)' }
        guaranteePenaltyPercent: { type: integer, description: '0 / 20 / 30 / 50 (% de la garantía)' }
        dailyRate: { type: string, nullable: true, pattern: '^\\d+\\.\\d{2}$', description: dailyRate vigente del vehículo (misma fuente que el cargo de paralización) }
        guaranteeAmount: { type: string, nullable: true, pattern: '^\\d+\\.\\d{2}$', description: Garantía del alquiler; null si no tiene (p. ej. con conductor de la empresa) }
        currency: { type: string, nullable: true }
        suggestedTimeCharge: { type: string, nullable: true, pattern: '^\\d+\\.\\d{2}$', description: timeChargePercent x tarifa diaria; null si NONE o sin tarifa }
        suggestedGuaranteePenalty:
          type: string
          nullable: true
          pattern: '^\\d+\\.\\d{2}$'
          description: >
            guaranteePenaltyPercent x garantía, aplicable "si no avisó / no pagó antes". null si NONE, sin garantía o si
            noticeAndPrepaymentVerified es true.
        noticeAndPrepaymentVerified:
          type: boolean
          nullable: true
          description: true = ampliación AUTORIZADA y pagada que cubre el tiempo; false = ninguna cubre; null = no determinable, lo confirma el operador
        severeBreach: { type: boolean, description: 'Retraso > 12 h: incumplimiento grave (retener garantía / resolver contrato es decisión de Gerencia)' }
        severeBreachThresholdHours: { type: integer, example: 12 }
    ReturnAlerts:
      type: object
      required: [warrantyRelease, immobilization]
      properties:
        warrantyRelease:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/WarrantyReleaseAlert'
        immobilization:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ImmobilizationAlert'

    ReturnAlertItem:
      type: object
      required: [type, returnId, rentalId, returnStatus, returnVersion, vehiclePlate, customerName, receivedAt, warrantyRelease, immobilization, lateCharge]
      properties:
        type: { $ref: '#/components/schemas/ReturnAlertType' }
        returnId: { type: string, format: uuid }
        rentalId: { type: string, format: uuid }
        returnStatus: { $ref: '#/components/schemas/ReturnStatus' }
        returnVersion: { type: integer }
        vehiclePlate: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        warrantyRelease:
          nullable: true
          description: Presente cuando type = WARRANTY_RELEASE
          allOf:
            - $ref: '#/components/schemas/WarrantyReleaseAlert'
        immobilization:
          nullable: true
          description: Presente cuando type = IMMOBILIZATION
          allOf:
            - $ref: '#/components/schemas/ImmobilizationAlert'
        lateCharge:
          nullable: true
          description: Presente cuando type = LATE_CHARGE (sugerencia de registrar el cargo por retraso manual; sin monto)
          allOf:
            - $ref: '#/components/schemas/LateChargeSuggestion'

    LateChargeSuggestion:
      type: object
      required: [lateMinutes, lateToleranceMinutes]
      properties:
        lateMinutes: { type: integer, minimum: 0, description: Minutos enteros de retraso real (recepción menos hora pactada) }
        lateToleranceMinutes: { type: integer, example: 30, description: Tolerancia sin sanción (BR-DEV-003) }

    ResponsibilityTemplateResponse:
      type: object
      required: [type, name, content, version]
      properties:
        type:
          type: string
          description: Tipo de plantilla (e.g. RETURN_RESPONSIBILITY)
          example: RETURN_RESPONSIBILITY
        name:
          type: string
          description: Nombre descriptivo de la plantilla
          example: Documento de Responsabilidad - Devolución VeloxRent
        content:
          type: string
          description: Contenido de la plantilla que el cliente debe firmar
        version:
          type: integer
          description: Versión activa de la plantilla

    ReturnStatus:
      type: string
      enum:
        - PROGRAMADA
