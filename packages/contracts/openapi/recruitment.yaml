openapi: 3.1.0
info:
  title: KAIROS ERP - Recruitment & Selection API
  version: 0.4.0
  description: >
    v0.4.0 (Respuestas de negocio 2026-10-20, frente B): (1) incorporación repetida -> 409 `ONBOARDING_ALREADY_COMPLETED`
    (antes 422 CANDIDATE_STATE_TRANSITION_INVALID); «Ingresado» y «Periodo de prueba» son UN solo paso (una sola llamada a
    complete-onboarding). (2) Registrar un resultado de entrevista NO_AVANZA lo decide solo Gerencia General (permiso nuevo
    RECRUITMENT.DECIDE_NO_ADVANCE): otro rol -> 403 ROLE_NOT_ALLOWED. (3) Evaluar el periodo de prueba con passed=false (término)
    lo registra solo Gerencia General (permiso nuevo RECRUITMENT.TERMINATE_PROBATION): otro rol -> 403 ROLE_NOT_ALLOWED; no emite
    RelacionLaboralTerminada (ese evento es del Empleado de HR-Administration y el TDD-REC no lo define para el candidato).
    (4) Rechazar (RECHAZADO) a un candidato ya ENTREVISTADO exige `decisionNotes` (motivo) -> 422 `DECISION_REASON_REQUIRED`; queda
    DESCARTADO. (5) Registrar candidatos en vacantes PAUSADA/CANCELADA está permitido (sin cambio; la vacante no avanza).

    Contrato del módulo de Reclutamiento y Selección (REC-01 a REC-08).
    Fuentes canónicas: BDD-05 (BDD-REC-001 v1.7), SDD-05 (SDD-REC-001 v2.0), TDD-05 (TDD-REC-001 v2.0)
    y prototipos Stitch aprobados (PROTO-REC-01 a PROTO-REC-08).
    Diseñado para soportar la operación AS-IS (decisiones cualitativas abiertas sin rúbrica numérica obligatoria,
    DR-REC-001 / BR-REC-006) dejando campos opcionales listos para la evolución TO-BE (Plan de Talento Humano formal).
    Cumple con segregación multiempresa estricta (BR-REC-001), trazabilidad documental (BR-REC-003),
    enmascaramiento dinámico de datos sensibles (BR-REC-005, PROTO-REC-04) y matriz dinámica ADM-02.
    Concurrencia optimista mediante If-Match / ETag e Idempotency-Key en comandos de creación.

    v0.2.0 (cierre de huecos): pausar/reanudar vacante (REC-02), CV del candidato con subida por URL firmada y
    visor (REC-03/REC-04, DAT-REC-004), historial de negociación de condiciones (REC-04) y honorarios del
    periodo de prueba (REC-08, DAT-REC-007). El CV, la negociación y los honorarios son datos sensibles: solo se
    exponen con RECRUITMENT.VIEW_CANDIDATE_SENSITIVE_DATA.

    v0.3.0 (flujo de estados BDD-REC-001 §11.6): el candidato expone `processState` (EN_NEGOCIACION, ENTREVISTADO,
    DECIDIDO, DESCARTADO, INGRESADO, PERIODO_PRUEBA, PLANILLA, TERMINADO) y la vacante suma el estado ENTREVISTADA.
    Las transiciones son derivadas de los comandos existentes (no hay endpoint para fijar el estado a mano):
    registrar candidato (vacante PUBLICADA -> EN_NEGOCIACION), registrar resultado de entrevista (candidato ->
    ENTREVISTADO, vacante -> ENTREVISTADA), decidir (CONTRATADO -> DECIDIDO y vacante DECIDIDA; RECHAZADO -> DESCARTADO),
    completar incorporación (DECIDIDO -> INGRESADO -> PERIODO_PRUEBA, SDD UC-REC-004) y evaluar periodo de prueba
    (PLANILLA | TERMINADO). Una transición fuera de la tabla del BDD responde 422 `CANDIDATE_STATE_TRANSITION_INVALID`.
    PLANILLA -> TERMINADO está marcado "(futuro)" en el BDD y no se habilita.
    Errores de dominio: cuerpo `{ statusCode, code, detail }` (schema ProblemDetail).

paths:
  /vacancies:
    post:
      operationId: registerVacancy
      summary: Registrar necesidad de personal (REC-01, PROTO-REC-01)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterVacancyRequest' }
      responses:
        '201':
          description: Vacante registrada exitosamente en estado NECESIDAD_REGISTRADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.CREATE_VACANCY o contexto no autorizado }
        '409': { description: Idempotency-Key en conflicto }
        '500': { description: Error interno }
    get:
      operationId: listVacancies
      summary: Bandeja de vacantes con filtros y paginación keyset (REC-01, PROTO-REC-01)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/VacancyStatus' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursorCreatedAt, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: cursorId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista de vacantes ordenadas por fecha de creación descendente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VacancyResponse' }
        '400': { description: Parámetros inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.VIEW_VACANCY o contexto no autorizado }
        '500': { description: Error interno }

  /vacancies/{id}:
    get:
      operationId: getVacancy
      summary: Detalle de vacante y métricas de postulantes (REC-02, PROTO-REC-02)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detalle completo de la vacante
          headers:
            ETag: { schema: { type: string }, description: Versión actual para concurrencia optimista }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyDetailResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.VIEW_VACANCY o contexto no autorizado }
        '404': { description: Vacante no encontrada }
        '500': { description: Error interno }

  /vacancies/{id}/commands/publish:
    post:
      operationId: publishVacancy
      summary: Definir perfil y publicar vacante en canales de difusión (REC-02, PROTO-REC-02)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishVacancyRequest' }
      responses:
        '200':
          description: Vacante transicionada a PUBLICADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyDetailResponse' }
        '400': { description: Datos inválidos o canales técnicos faltantes para mecánico (BR-REC-004) }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.PUBLISH_VACANCY o contexto no autorizado }
        '404': { description: Vacante no encontrada }
        '409': { description: Conflicto de versión (VERSION_CONFLICT) o estado no transicionable }
        '500': { description: Error interno }

  /vacancies/{id}/commands/pause:
    post:
      operationId: pauseVacancy
      summary: Pausar una vacante publicada (REC-02, PROTO-REC-02)
      description: >
        PUBLICADA -> PAUSADA. Detiene temporalmente la convocatoria sin perder el perfil ni los canales ya definidos.
        Usa el mismo permiso que publicar (RECRUITMENT.PUBLISH_VACANCY). Deja rastro de auditoría (VACANCY_PAUSED).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PauseVacancyRequest' }
      responses:
        '200':
          description: Vacante transicionada a PAUSADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyDetailResponse' }
        '400': { description: Datos inválidos o If-Match mal formado }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.PUBLISH_VACANCY o contexto no autorizado }
        '404': { description: Vacante no encontrada }
        '409': { description: Conflicto de versión (VERSION_CONFLICT) }
        '422': { description: La vacante no está publicada (VACANCY_NOT_PAUSABLE) }
        '428': { description: Falta If-Match }
        '500': { description: Error interno }

  /vacancies/{id}/commands/resume:
    post:
      operationId: resumeVacancy
      summary: Reanudar una vacante pausada (REC-02, PROTO-REC-02)
      description: PAUSADA -> PUBLICADA. Conserva el perfil, el sueldo base y los canales. Auditoría VACANCY_RESUMED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeVacancyRequest' }
      responses:
        '200':
          description: Vacante transicionada a PUBLICADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacancyDetailResponse' }
        '400': { description: Datos inválidos o If-Match mal formado }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.PUBLISH_VACANCY o contexto no autorizado }
        '404': { description: Vacante no encontrada }
        '409': { description: Conflicto de versión (VERSION_CONFLICT) }
        '422': { description: La vacante no está pausada (VACANCY_NOT_PAUSABLE) }
        '428': { description: Falta If-Match }
        '500': { description: Error interno }

  /vacancies/{id}/candidates:
    post:
      operationId: registerCandidate
      summary: Registrar postulante a una vacante (REC-03, PROTO-REC-03)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCandidateRequest' }
      responses:
        '201':
          description: Postulante registrado en etapa NUEVO y estado de proceso EN_NEGOCIACION; si la vacante estaba PUBLICADA pasa a EN_NEGOCIACION (BDD-REC §11.6)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.REGISTER_CANDIDATE o contexto no autorizado }
        '404': { description: Vacante no encontrada }
        '409': { description: Candidato ya postulado con ese documento a esta vacante }
        '500': { description: Error interno }
    get:
      operationId: listCandidates
      summary: Listar candidatos de una vacante para tablero Kanban (REC-03, PROTO-REC-03)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: stage, in: query, required: false, schema: { $ref: '#/components/schemas/CandidateStage' } }
      responses:
        '200':
          description: Lista de candidatos en la vacante
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CandidateResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.VIEW_CANDIDATE o contexto no autorizado }
        '404': { description: Vacante no encontrada }
        '500': { description: Error interno }

  /candidates/{id}:
    get:
      operationId: getCandidate
      summary: Ficha 360 del candidato con enmascaramiento dinámico (REC-04, PROTO-REC-04)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ficha del candidato (datos sensibles enmascarados si no tiene permiso RECRUITMENT.VIEW_CANDIDATE_SENSITIVE_DATA)
          headers:
            ETag: { schema: { type: string }, description: Versión actual para concurrencia optimista }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDetailResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.VIEW_CANDIDATE o contexto no autorizado }
        '404': { description: Candidato no encontrado }
        '500': { description: Error interno }

  /candidates/{id}/cv/upload-session:
    post:
      operationId: requestCandidateCvUploadSession
      summary: Pedir URL firmada para subir el CV del candidato (REC-03/REC-04, DAT-REC-004)
      description: >
        Valida tipo (PDF, Word .docx, JPG o PNG) y tamaño (máximo 10 MB) ANTES de firmar. El cliente sube el archivo con
        PUT a `uploadUrl` enviando EXACTAMENTE las cabeceras de `uploadHeaders` y luego confirma con `record-cv`.
        Exige RECRUITMENT.REGISTER_CANDIDATE.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCandidateCvUploadSessionRequest' }
      responses:
        '201':
          description: Sesión de subida creada (vigencia 15 minutos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateCvUploadSessionResponse' }
        '400': { description: Datos inválidos (tipo no permitido o tamaño fuera de rango) }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.REGISTER_CANDIDATE o contexto no autorizado }
        '404': { description: Candidato no encontrado en esta empresa/sede }
        '422': { description: Archivo no válido para CV (CANDIDATE_CV_INVALID_FILE) }
        '503': { description: Almacenamiento no configurado }
        '500': { description: Error interno }

  /candidates/{id}/commands/record-cv:
    post:
      operationId: recordCandidateCv
      summary: Confirmar el CV ya subido (REC-03/REC-04, DAT-REC-004)
      description: >
        Verifica contra el almacenamiento que el objeto existe, pertenece a este candidato/empresa y que su tipo y
        tamaño reales son válidos. Reemplaza el CV anterior si lo había. Auditoría CANDIDATE_CV_UPLOADED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordCandidateCvRequest' }
      responses:
        '200':
          description: CV registrado; devuelve la ficha del candidato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDetailResponse' }
        '400': { description: Datos inválidos o If-Match mal formado }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.REGISTER_CANDIDATE o contexto no autorizado }
        '404': { description: Candidato no encontrado }
        '409': { description: Conflicto de versión (VERSION_CONFLICT) }
        '422': { description: Archivo inexistente, ajeno o inválido (CANDIDATE_CV_NOT_UPLOADED, CANDIDATE_CV_OBJECT_MISMATCH, CANDIDATE_CV_INVALID_FILE) }
        '428': { description: Falta If-Match }
        '500': { description: Error interno }

  /candidates/{id}/cv:
    get:
      operationId: getCandidateCv
      summary: Visor del CV - URL firmada de lectura (REC-04, DAT-REC-004)
      description: >
        Devuelve una URL firmada de vida corta (5 minutos) para mostrar el CV en línea. Exige
        RECRUITMENT.VIEW_CANDIDATE_SENSITIVE_DATA y deja rastro de cada consulta (CANDIDATE_CV_VIEWED).
        La respuesta no debe almacenarse en caché (Cache-Control: no-store).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: URL firmada y metadatos del CV
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateCvViewResponse' }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.VIEW_CANDIDATE_SENSITIVE_DATA o contexto no autorizado }
        '404': { description: Candidato no encontrado o sin CV (CANDIDATE_CV_NOT_FOUND) }
        '500': { description: Error interno }

  /candidates/{id}/negotiations:
    post:
      operationId: recordNegotiation
      summary: Registrar una ronda de negociación de condiciones (REC-04, REC-P06/P07)
      description: >
        Agrega una ronda al historial append-only (condiciones ofrecidas vs. condiciones del candidato). Resultado
        EN_CURSO guarda la anotación; ACORDADA exige `agreedSalary` y avanza al candidato a ENTREVISTA si aún no la
        alcanzó ("Acordar y continuar"); NO_ACORDADA exige `reason` (el descarte formal sigue siendo la decisión
        RECHAZADO). Dato sensible: exige RECRUITMENT.REGISTER_CANDIDATE y RECRUITMENT.VIEW_CANDIDATE_SENSITIVE_DATA.
        El sistema no calcula ni sugiere montos (la documentación no define una regla de cálculo).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordNegotiationRequest' }
      responses:
        '201':
          description: Ronda registrada; devuelve la ficha con el historial actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDetailResponse' }
        '400': { description: Datos inválidos o If-Match mal formado }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso para registrar candidatos o ver datos sensibles }
        '404': { description: Candidato no encontrado }
        '409': { description: Conflicto de versión (VERSION_CONFLICT) o candidato ya decidido (CANDIDATE_ALREADY_DECIDED) }
        '422': { description: Reglas de negociación incumplidas (NEGOTIATION_INVALID) }
        '428': { description: Falta If-Match }
        '500': { description: Error interno }

  /candidates/{id}/commands/set-probation-fees:
    post:
      operationId: setProbationFees
      summary: Registrar los honorarios del periodo de prueba (REC-08, BR-REC-005, DAT-REC-007)
      description: >
        Captura (sin cálculo) de los honorarios mensuales pactados durante la prueba, el sueldo posterior si hay
        cláusula de ajuste y observaciones. Solo antes de evaluar la prueba. Dato financiero: exige
        RECRUITMENT.EVALUATE_PROBATION y RECRUITMENT.VIEW_CANDIDATE_SENSITIVE_DATA. If-Match usa `onboarding.version`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetProbationFeesRequest' }
      responses:
        '200':
          description: Honorarios registrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingResponse' }
        '400': { description: Datos inválidos o If-Match mal formado }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso para evaluar la prueba o ver datos sensibles }
        '404': { description: Candidato u onboarding no encontrado }
        '409': { description: Conflicto de versión (VERSION_CONFLICT) o prueba ya evaluada (PROBATION_ALREADY_EVALUATED) }
        '422': { description: Montos inválidos (NEGOTIATION_INVALID) }
        '428': { description: Falta If-Match }
        '500': { description: Error interno }

  /candidates/{id}/commands/change-stage:
    post:
      operationId: changeCandidateStage
      summary: Transicionar etapa de candidato en Kanban (REC-03, PROTO-REC-03)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeCandidateStageRequest' }
      responses:
        '200':
          description: Etapa actualizada exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDetailResponse' }
        '400': { description: Transición de etapa no permitida }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.REGISTER_CANDIDATE o contexto no autorizado }
        '404': { description: Candidato no encontrado }
        '409': { description: Conflicto de versión (VERSION_CONFLICT) }
        '500': { description: Error interno }

  /candidates/{id}/interviews:
    post:
      operationId: scheduleInterview
      summary: Programar entrevista (REC-05, PROTO-REC-05)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInterviewRequest' }
      responses:
        '201':
          description: Entrevista programada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateInterviewResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.MANAGE_INTERVIEW o contexto no autorizado }
        '404': { description: Candidato no encontrado }
        '500': { description: Error interno }

  /interviewers:
    get:
      operationId: listInterviewers
      summary: Buscador de entrevistadores (REC-05, PROTO-REC-05)
      description: >
        Usuarios con asignación vigente en la empresa cuyo rol tiene RECRUITMENT.MANAGE_INTERVIEW en la
        matriz dinámica ADM-02 (ámbito empresa/sede del contexto). Pensado para el selector de
        `interviewerId` al agendar una entrevista. No expone correo ni teléfono.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, description: Búsqueda por nombre (sin distinguir mayúsculas ni tildes), schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Entrevistadores ordenados por nombre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewerListResponse' }
        '400': { description: Parámetros inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.MANAGE_INTERVIEW ni RECRUITMENT.VIEW_CANDIDATE, o contexto no autorizado }
        '500': { description: Error interno }

  /interviews/{id}/commands/record-result:
    post:
      operationId: recordInterviewResult
      summary: Registrar resultado cualitativo de entrevista (REC-05, PROTO-REC-05)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInterviewResultRequest' }
      responses:
        '200':
          description: Resultado de entrevista registrado. Si es la primera entrevista realizada, el candidato pasa a ENTREVISTADO y la vacante a ENTREVISTADA (BDD-REC §11.6); NO_AVANZA no descarta ni decide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateInterviewResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: 'Rol sin permiso RECRUITMENT.MANAGE_INTERVIEW o contexto no autorizado; o result=NO_AVANZA sin permiso RECRUITMENT.DECIDE_NO_ADVANCE (solo Gerencia General)' }
        '404': { description: Entrevista no encontrada }
        '409':
          description: Candidato ya decidido (CANDIDATE_ALREADY_DECIDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { description: Error interno }

  /candidates/{id}/commands/decide:
    post:
      operationId: decideCandidate
      summary: Decisión de contratación (REC-06, PROTO-REC-06)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideCandidateRequest' }
      responses:
        '200':
          description: >
            Decisión procesada. CONTRATADO: candidato DECIDIDO, vacante DECIDIDA y evento CandidatoSeleccionado.v1 en outbox.
            RECHAZADO: candidato DESCARTADO (tras la entrevista recorre DECIDIDO -> DESCARTADO).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDetailResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.DECIDE_CANDIDATE o contexto no autorizado }
        '404': { description: Candidato no encontrado }
        '409':
          description: Conflicto de versión (VERSION_CONFLICT) o candidato ya decidido (CANDIDATE_ALREADY_DECIDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >
            Transición no permitida por BDD-REC §11.6 (CANDIDATE_STATE_TRANSITION_INVALID): CONTRATADO exige que el candidato
            esté ENTREVISTADO; RECHAZADO exige EN_NEGOCIACION o ENTREVISTADO. RECHAZADO sobre un candidato ENTREVISTADO sin
            decisionNotes -> DECISION_REASON_REQUIRED (el motivo es obligatorio).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { description: Error interno }

  /candidates/{id}/commands/complete-onboarding:
    post:
      operationId: completeOnboarding
      summary: Completar checklist de incorporación (REC-07, PROTO-REC-07)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteOnboardingRequest' }
      responses:
        '200':
          description: Incorporación completada. El candidato recorre DECIDIDO -> INGRESADO -> PERIODO_PRUEBA en la misma operación (SDD UC-REC-004) y se emite PersonalIncorporado.v1 hacia ADP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingResponse' }
        '400': { description: Checklist incompleto o falta contrato notariado para mecánico (BR-REC-009) }
        '401': { description: Token ausente o inválido }
        '403': { description: Rol sin permiso RECRUITMENT.MANAGE_ONBOARDING o contexto no autorizado }
        '404': { description: Candidato no encontrado o no contratado }
        '409': { description: 'Incorporación repetida: el candidato ya está INGRESADO / PERIODO_PRUEBA / PLANILLA / TERMINADO (ONBOARDING_ALREADY_COMPLETED)' }
        '422':
          description: >
            Candidato no contratado (CANDIDATE_NOT_CONTRACTED), checklist incompleto, falta contrato notariado de mecánico,
            o el candidato no está DECIDIDO (CANDIDATE_STATE_TRANSITION_INVALID, p. ej. aún ENTREVISTADO). La incorporación repetida es 409.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { description: Error interno }

  /candidates/{id}/commands/evaluate-probation:
    post:
      operationId: evaluateProbation
      summary: Evaluar periodo de prueba a 3 meses (REC-08, PROTO-REC-08)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateProbationRequest' }
      responses:
        '200':
          description: Evaluación registrada. Aprobada -> candidato PLANILLA y evento PasoAPlanilla.v1; no aprobada -> candidato TERMINADO (sin evento nuevo, ver preguntas abiertas del BDD)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingResponse' }
        '400': { description: Datos inválidos }
        '401': { description: Token ausente o inválido }
        '403': { description: 'Rol sin permiso RECRUITMENT.EVALUATE_PROBATION o contexto no autorizado; o passed=false sin permiso RECRUITMENT.TERMINATE_PROBATION (solo Gerencia General)' }
        '404': { description: Candidato u onboarding no encontrado }
        '409': { description: Periodo de prueba ya evaluado }
        '422':
          description: El candidato no está en PERIODO_PRUEBA (CANDIDATE_STATE_TRANSITION_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { description: Error interno }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    VacancySource:
      type: string
      enum: [RENUNCIA, CRECIMIENTO, NUEVA_AREA]

    VacancyStatus:
      type: string
      enum: [NECESIDAD_REGISTRADA, PUBLICADA, EN_NEGOCIACION, ENTREVISTADA, DECIDIDA, CANCELADA, PAUSADA]

    CandidateStage:
      type: string
      enum: [NUEVO, CONTACTADO, ENTREVISTA, DECISION]

    CandidateProcessState:
      type: string
      description: >
        Estado normativo del candidato (BDD-REC-001 §11.6). Distinto de `stage` (columna del tablero Kanban de REC-03).
        Salidas permitidas: EN_NEGOCIACION -> ENTREVISTADO | DESCARTADO; ENTREVISTADO -> DECIDIDO;
        DECIDIDO -> INGRESADO | DESCARTADO; INGRESADO -> PERIODO_PRUEBA; PERIODO_PRUEBA -> PLANILLA | TERMINADO.
        DESCARTADO, PLANILLA y TERMINADO no tienen salidas.
      enum: [EN_NEGOCIACION, ENTREVISTADO, DECIDIDO, DESCARTADO, INGRESADO, PERIODO_PRUEBA, PLANILLA, TERMINADO]

    CandidateDecision:
      type: string
      enum: [CONTRATADO, RECHAZADO]

    InterviewResult:
      type: string
      enum: [PENDIENTE, AVANZA, NO_AVANZA]

    NegotiationOutcome:
      type: string
      enum: [EN_CURSO, ACORDADA, NO_ACORDADA]

    PauseVacancyRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500, description: Motivo opcional de la pausa (queda en la auditoría) }

    ResumeVacancyRequest:
      type: object
      required: [companyId, branchId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }

    RequestCandidateCvUploadSessionRequest:
      type: object
      required: [companyId, branchId, contentType, contentLength]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        contentType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - image/jpeg
            - image/png
        contentLength: { type: integer, minimum: 1, maximum: 10485760, description: Tamaño del archivo en bytes (máximo 10 MB) }

    CandidateCvUploadSessionResponse:
      type: object
      required: [uploadUrl, objectUrl, expiresAt, uploadHeaders]
      properties:
        uploadUrl: { type: string, format: uri }
        objectUrl: { type: string, format: uri, description: Se envía tal cual a record-cv }
        expiresAt: { type: string, format: date-time }
        uploadHeaders:
          type: object
          additionalProperties: { type: string }
          description: Cabeceras que el PUT debe enviar sin cambios (Content-Type y tope de tamaño firmado).

    RecordCandidateCvRequest:
      type: object
      required: [companyId, branchId, objectUrl, fileName]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        objectUrl: { type: string, maxLength: 1024 }
        fileName: { type: string, minLength: 1, maxLength: 200 }

    CandidateCvResponse:
      type: object
      required: [fileName, contentType, sizeBytes, uploadedAt]
      properties:
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        uploadedAt: { type: string, format: date-time }

    CandidateCvViewResponse:
      allOf:
        - { $ref: '#/components/schemas/CandidateCvResponse' }
        - type: object
          required: [url, expiresAt]
          properties:
            url: { type: string, format: uri, description: URL firmada de lectura (credencial temporal; no almacenar) }
            expiresAt: { type: string, format: date-time }

    RecordNegotiationRequest:
      type: object
      required: [companyId, branchId, outcome, offeredSalary]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        outcome: { $ref: '#/components/schemas/NegotiationOutcome' }
        offeredSalary: { type: number, minimum: 0, description: Sueldo base mensual ofrecido (PEN) }
        offeredSchedule: { type: string, maxLength: 255 }
        offeredOtherConditions: { type: string, maxLength: 2000, description: Alimentación, guardias, seguros u otras condiciones ofrecidas }
        candidateSalary: { type: number, minimum: 0, description: Pretensión salarial planteada por el candidato en esta ronda }
        candidateSchedule: { type: string, maxLength: 255 }
        candidateOtherConditions: { type: string, maxLength: 2000 }
        candidateStartDate: { type: string, format: date, description: Fecha de incorporación solicitada por el candidato }
        agreedSalary: { type: number, minimum: 0, description: Obligatorio si outcome = ACORDADA; prohibido en otro caso }
        agreedConditions: { type: string, maxLength: 2000 }
        reason: { type: string, maxLength: 1000, description: Obligatorio si outcome = NO_ACORDADA }

    NegotiationResponse:
      type: object
      required: [id, candidateId, outcome, offeredSalary, recordedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        outcome: { $ref: '#/components/schemas/NegotiationOutcome' }
        offeredSalary: { type: number }
        offeredSchedule: { type: string, nullable: true }
        offeredOtherConditions: { type: string, nullable: true }
        candidateSalary: { type: number, nullable: true }
        candidateSchedule: { type: string, nullable: true }
        candidateOtherConditions: { type: string, nullable: true }
        candidateStartDate: { type: string, format: date, nullable: true }
        agreedSalary: { type: number, nullable: true }
        agreedConditions: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        recordedBy: { type: string }
        createdAt: { type: string, format: date-time }

    SetProbationFeesRequest:
      type: object
      required: [companyId, branchId, probationMonthlyFee]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        probationMonthlyFee: { type: number, minimum: 0, description: Honorarios mensuales brutos pactados durante la prueba (PEN) }
        postProbationMonthlySalary: { type: number, minimum: 0, description: Sueldo posterior si hay cláusula de ajuste al pasar a planilla }
        probationFeeNotes: { type: string, maxLength: 500, description: Jornada, guardias, viáticos u otras condiciones de la prueba }

    RegisterVacancyRequest:
      type: object
      required: [companyId, branchId, title, department, source]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        title: { type: string, minLength: 3, maxLength: 150 }
        department: { type: string, minLength: 2, maxLength: 100 }
        source: { $ref: '#/components/schemas/VacancySource' }
        isMechanic: { type: boolean, default: false }

    PublishVacancyRequest:
      type: object
      required: [companyId, branchId, profileDescription, baseSalary, scheduleDetails, channels]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        profileDescription: { type: string, minLength: 10 }
        baseSalary: { type: number, minimum: 0 }
        scheduleDetails: { type: string, minLength: 3, maxLength: 255 }
        channels:
          type: array
          minItems: 1
          items: { type: string }

    RegisterCandidateRequest:
      type: object
      required: [companyId, branchId, fullName, documentNumber]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        fullName: { type: string, minLength: 3, maxLength: 200 }
        documentType: { type: string, default: DNI }
        documentNumber: { type: string, minLength: 4, maxLength: 30 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, maxLength: 50, nullable: true }
        cvDocumentId:
          type: string
          format: uuid
          deprecated: true
          description: Obsoleto. El CV se sube después con POST /candidates/{id}/cv/upload-session y record-cv; si se omite, el servidor asigna un código interno.
        salaryExpectation: { type: number, minimum: 0, nullable: true }

    ChangeCandidateStageRequest:
      type: object
      required: [companyId, branchId, stage]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        stage: { $ref: '#/components/schemas/CandidateStage' }

    ScheduleInterviewRequest:
      type: object
      required: [companyId, branchId, scheduledAt, isVirtual, interviewerId]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        isVirtual: { type: boolean }
        meetUrl: { type: string, format: uri, nullable: true }
        location: { type: string, nullable: true }
        interviewerId: { type: string, minLength: 1 }

    RecordInterviewResultRequest:
      type: object
      required: [companyId, branchId, result, qualitativeNotes]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        result: { $ref: '#/components/schemas/InterviewResult' }
        qualitativeNotes: { type: string, minLength: 5 }

    DecideCandidateRequest:
      type: object
      required: [companyId, branchId, decision]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        decision: { $ref: '#/components/schemas/CandidateDecision' }
        decisionNotes: { type: string, nullable: true }

    CompleteOnboardingRequest:
      type: object
      required: [companyId, branchId, startDate, inductionScheduled, equipmentAssigned, responsibilityCardSigned]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        inductionScheduled: { type: boolean }
        equipmentAssigned: { type: boolean }
        responsibilityCardSigned: { type: boolean }
        notarizedContractSigned: { type: boolean, default: false }

    EvaluateProbationRequest:
      type: object
      required: [companyId, branchId, passed, qualitativeEvaluation]
      properties:
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        passed: { type: boolean }
        qualitativeEvaluation: { type: string, minLength: 5 }

    ProblemDetail:
      type: object
      description: >
        Cuerpo de error de dominio. `code` es estable y apto para que el front decida el mensaje
        (p. ej. CANDIDATE_STATE_TRANSITION_INVALID, CANDIDATE_ALREADY_DECIDED, VERSION_CONFLICT).
      required: [statusCode, code, detail]
      properties:
        statusCode: { type: integer }
        code: { type: string, example: CANDIDATE_STATE_TRANSITION_INVALID }
        detail: { type: string }

    VacancyResponse:
      type: object
      required: [id, code, title, department, source, status, isMechanic, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        department: { type: string }
        source: { $ref: '#/components/schemas/VacancySource' }
        status: { $ref: '#/components/schemas/VacancyStatus' }
        isMechanic: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }

    VacancyDetailResponse:
      allOf:
        - { $ref: '#/components/schemas/VacancyResponse' }
        - type: object
          properties:
            profileDescription: { type: string, nullable: true }
            baseSalary: { type: number, nullable: true }
            scheduleDetails: { type: string, nullable: true }
            publishedChannels: { type: array, items: { type: string } }
            candidatesCount: { type: integer, default: 0 }
            candidatesByStage:
              type: object
              properties:
                NUEVO: { type: integer }
                CONTACTADO: { type: integer }
                ENTREVISTA: { type: integer }
                DECISION: { type: integer }

    CandidateResponse:
      type: object
      required: [id, vacancyId, fullName, documentType, documentNumber, stage, processState, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        vacancyId: { type: string, format: uuid }
        fullName: { type: string }
        documentType: { type: string }
        documentNumber: { type: string }
        stage: { $ref: '#/components/schemas/CandidateStage' }
        processState: { $ref: '#/components/schemas/CandidateProcessState' }
        processStateChangedAt:
          type: string
          format: date-time
          nullable: true
          description: Último cambio del estado de proceso; null en candidatos anteriores a v0.3.0 (migrados sin fecha).
        decision: { $ref: '#/components/schemas/CandidateDecision', nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }

    CandidateDetailResponse:
      allOf:
        - { $ref: '#/components/schemas/CandidateResponse' }
        - type: object
          required: [isRestrictedView, isMechanic, hasCv, negotiations]
          properties:
            isMechanic:
              type: boolean
              description: Tomado de la vacante del candidato (true = vacante de mecanico, aplican BR-REC-004 y contrato notarial).
            email: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            cvDocumentId: { type: string, format: uuid, nullable: true }
            hasCv:
              type: boolean
              description: Hay un CV cargado (se informa también en vista restringida para mostrar el candado).
            cv:
              nullable: true
              description: Metadatos del CV; null si no hay CV o la vista es restringida. El archivo se lee con GET /candidates/{id}/cv.
              allOf:
                - { $ref: '#/components/schemas/CandidateCvResponse' }
            negotiations:
              type: array
              description: Historial de negociación, más reciente primero; vacío en vista restringida.
              items: { $ref: '#/components/schemas/NegotiationResponse' }
            salaryExpectation: { type: number, nullable: true }
            decisionNotes: { type: string, nullable: true }
            decidedAt: { type: string, format: date-time, nullable: true }
            isRestrictedView: { type: boolean }
            interviews:
              type: array
              items: { $ref: '#/components/schemas/CandidateInterviewResponse' }
            onboarding:
              nullable: true
              description: Incorporación y periodo de prueba (REC-07/REC-08); null mientras no se haya incorporado.
              allOf:
                - { $ref: '#/components/schemas/OnboardingResponse' }

    InterviewerResponse:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, description: Identificador del usuario; es el valor que se envía como interviewerId }
        fullName: { type: string }

    InterviewerListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InterviewerResponse' }

    CandidateInterviewResponse:
      type: object
      required: [id, candidateId, scheduledAt, isVirtual, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        isVirtual: { type: boolean }
        meetUrl: { type: string, nullable: true }
        location: { type: string, nullable: true }
        interviewerId: { type: string }
        qualitativeNotes: { type: string, nullable: true }
        result: { $ref: '#/components/schemas/InterviewResult' }
        evaluatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    OnboardingResponse:
      type: object
      required: [id, candidateId, startDate, inductionScheduled, equipmentAssigned, responsibilityCardSigned, notarizedContractSigned, isCompleted, feesRestricted, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        inductionScheduled: { type: boolean }
        equipmentAssigned: { type: boolean }
        responsibilityCardSigned: { type: boolean }
        notarizedContractSigned: { type: boolean }
        isCompleted: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        probationPassed: { type: boolean, nullable: true }
        probationEvaluation: { type: string, nullable: true }
        probationEvaluatedAt: { type: string, format: date-time, nullable: true }
        probationMonthlyFee: { type: number, nullable: true, description: Honorarios mensuales de la prueba (financiero); null si no se registraron o feesRestricted }
        postProbationMonthlySalary: { type: number, nullable: true }
        probationFeeNotes: { type: string, nullable: true }
        probationFeesRecordedAt: { type: string, format: date-time, nullable: true }
        feesRestricted:
          type: boolean
          description: true si el solicitante no tiene RECRUITMENT.VIEW_CANDIDATE_SENSITIVE_DATA (los honorarios no se exponen).
        version: { type: integer, description: Versión para If-Match en set-probation-fees }
        createdAt: { type: string, format: date-time }
